<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine · Teacher Profile</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f7f3ed;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* header */
        .page-header {
            background: white;
            border-radius: 32px;
            padding: 1.2rem 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-header h1 i {
            color: #f58a2e;
            background: #fcf3e8;
            padding: 0.3rem 0.6rem;
            border-radius: 16px;
            font-size: 1.2rem;
        }

        .page-header .header-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-secondary {
            background: #f0e2d2;
            color: #4d3e2b;
        }

        .btn-secondary:hover {
            background: #e6d5c0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f58a2e, #f9b042);
            color: white;
            box-shadow: 0 4px 12px rgba(245, 138, 46, 0.2);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(245, 138, 46, 0.3);
        }

        .btn-primary:disabled,
        .btn-secondary:disabled,
        .btn-danger:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: #fce4e0;
            color: #b53b2e;
        }

        .btn-danger:hover {
            background: #f8cfc7;
        }

        .btn-danger.solid {
            background: linear-gradient(135deg, #e0503c, #ef7a5f);
            color: white;
            box-shadow: 0 4px 12px rgba(224, 80, 60, 0.25);
        }

        .btn-danger.solid:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(224, 80, 60, 0.35);
        }

        /* profile layout */
        .profile-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 1.8rem;
            align-items: start;
        }

        /* sidebar */
        .sidebar {
            background: white;
            border-radius: 28px;
            padding: 1.8rem 1.2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            position: sticky;
            top: 1.5rem;
            text-align: center;
        }

        .sidebar .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fcf3e8, #f9dbb8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #f58a2e;
            margin: 0 auto 0.6rem auto;
        }

        .sidebar .teacher-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #2d1f0c;
        }

        .sidebar .teacher-id {
            font-size: 0.8rem;
            color: #b09a7e;
            margin-bottom: 0.8rem;
        }

        .sidebar .status-badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 1rem;
        }

        .status-badge.active {
            background: #e8f5e9;
            color: #2b7a3a;
        }

        .status-badge.inactive {
            background: #fce4e0;
            color: #b53b2e;
        }

        .status-badge.on-leave {
            background: #fff3e0;
            color: #e67e22;
        }

        .sidebar .quick-info {
            text-align: left;
            border-top: 1px solid #f0e2d2;
            padding-top: 1rem;
            margin-top: 0.5rem;
        }

        .sidebar .quick-info .info-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.3rem 0;
            font-size: 0.82rem;
            color: #4d3e2b;
        }

        .sidebar .quick-info .info-item i {
            color: #f58a2e;
            width: 1.2rem;
        }

        /* main content */
        .main-content {
            background: white;
            border-radius: 28px;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #2d1f0c;
            margin: 1.5rem 0 0.8rem 0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid #fcf3e8;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .section-title i {
            color: #f58a2e;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            padding: 0.25rem 0;
            font-size: 0.9rem;
            color: #3d2e1b;
            border-bottom: 1px solid #faf5ef;
        }

        .info-item .label {
            color: #b09a7e;
            font-weight: 500;
            min-width: 110px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .info-item .value {
            color: #2d1f0c;
            font-weight: 500;
            word-break: break-word;
        }

        .info-item .value i {
            color: #f58a2e;
            margin-right: 0.2rem;
        }

        .info-item.full {
            grid-column: 1 / -1;
        }

        /* password / reset area */
        .password-value {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .password-value .pw-text {
            font-weight: 500;
            color: #b09a7e;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .btn-reset-pw {
            background: #fcf3e8;
            border: 1px solid rgba(245, 138, 46, 0.2);
            color: #f58a2e;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-reset-pw:hover {
            background: #f9e6d2;
        }

        .reset-pw-panel {
            display: none;
            margin-top: 0.7rem;
            padding: 1rem;
            background: #fcf9f4;
            border: 1px solid rgba(245, 138, 46, 0.1);
            border-radius: 16px;
            width: 100%;
        }

        .reset-pw-panel.open {
            display: block;
        }

        .reset-pw-panel .field-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .reset-pw-panel input[type="password"],
        .reset-pw-panel input[type="text"] {
            flex: 1;
            min-width: 180px;
            padding: 0.5rem 0.8rem;
            border-radius: 10px;
            border: 1px solid #e6d5c0;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .reset-pw-panel input:focus {
            outline: none;
            border-color: #f58a2e;
        }

        .reset-pw-msg {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .reset-pw-msg.error {
            color: #b53b2e;
        }

        .reset-pw-msg.success {
            color: #2b7a3a;
        }

        /* classes list */
        .classes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            padding: 0.3rem 0;
        }

        .class-tag {
            background: #fcf9f4;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.82rem;
            color: #3d2e1b;
            border: 1px solid rgba(245, 138, 46, 0.08);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .class-tag i {
            color: #f58a2e;
        }

        .class-tag .sub-detail {
            font-weight: 400;
            color: #7f6a4b;
            font-size: 0.7rem;
        }

        /* permissions */
        .permissions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.3rem 1rem;
        }

        .perm-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.2rem 0;
            font-size: 0.85rem;
            color: #4d3e2b;
        }

        .perm-item .perm-icon {
            width: 1.2rem;
            font-size: 0.85rem;
        }

        .perm-item .perm-icon.allowed {
            color: #2b7a3a;
        }

        .perm-item .perm-icon.denied {
            color: #b53b2e;
        }

        .perm-item .perm-label {
            font-weight: 500;
        }

        /* loading */
        .loading-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .loading-state .spinner {
            font-size: 2.5rem;
            color: #f58a2e;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state p {
            color: #7f6a4b;
            margin-top: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #b09a7e;
        }

        .empty-state i {
            font-size: 2rem;
            color: #f0e2d2;
            margin-bottom: 0.3rem;
        }

        /* footer */
        .footer-note {
            margin-top: 2rem;
            border-top: 1px solid #f0e2d2;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            color: #b09a7e;
            font-size: 0.75rem;
        }

        .footer-note i {
            color: #f58a2e;
        }

        /* ================================== */
        /* DELETE CONFIRM MODAL */
        /* ================================== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(45, 31, 12, 0.45);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            padding: 2.5rem 1rem;
            overflow-y: auto;
        }

        .modal-overlay.open {
            display: flex;
        }

        .confirm-modal {
            background: #fffdfa;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 1.8rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
        }

        .confirm-modal .confirm-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #fce4e0;
            color: #b53b2e;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
        }

        .confirm-modal h2 {
            font-size: 1.1rem;
            color: #2d1f0c;
            margin-bottom: 0.5rem;
        }

        .confirm-modal p {
            font-size: 0.88rem;
            color: #7f6a4b;
            line-height: 1.5;
        }

        .confirm-modal p strong {
            color: #2d1f0c;
        }

        .confirm-modal-footer {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1.4rem;
        }

        .confirm-modal-msg {
            margin-top: 0.7rem;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .confirm-modal-msg.error {
            color: #b53b2e;
        }

        /* responsive */
        @media (max-width: 820px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 1rem;
                padding: 1.2rem 1.5rem;
                text-align: left;
            }
            .sidebar .avatar {
                margin: 0;
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
                flex-shrink: 0;
            }
            .sidebar .teacher-name {
                font-size: 1rem;
            }
            .sidebar .quick-info {
                border-top: none;
                padding-top: 0;
                margin-top: 0;
                flex: 1;
                display: flex;
                flex-wrap: wrap;
                gap: 0.3rem 1rem;
            }
            .sidebar .quick-info .info-item {
                padding: 0.1rem 0;
                font-size: 0.78rem;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .permissions-grid {
                grid-template-columns: 1fr;
            }
            .main-content {
                padding: 1.2rem 1.2rem;
            }
            .page-header h1 {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                flex-direction: column;
                text-align: center;
            }
            .sidebar .avatar {
                margin: 0 auto;
            }
            .sidebar .quick-info {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f58a2e">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sunshine">
  <script src="pwa.js" defer></script>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-id-card"></i> Teacher Profile</h1>
        <div class="header-actions">
            <button class="btn-action btn-secondary" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back to Teachers
            </button>
            <button class="btn-action btn-primary" onclick="editTeacher()">
                <i class="fas fa-pen"></i> Edit Teacher
            </button>
            <button class="btn-action btn-danger" onclick="openDeleteModal()">
                <i class="fas fa-trash"></i> Delete Teacher
            </button>
        </div>
    </div>

    <!-- PROFILE LAYOUT -->
    <div class="profile-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="avatar" id="avatarIcon"><i class="fas fa-user-tie"></i></div>
            <div class="teacher-name" id="teacherName">Loading...</div>
            <div class="teacher-id" id="teacherIdDisplay">Teacher ID</div>
            <div class="status-badge" id="statusBadge">Loading...</div>
            <div class="quick-info" id="quickInfo">
                <div class="info-item"><i class="fas fa-envelope"></i> <span id="quickEmail">-</span></div>
                <div class="info-item"><i class="fas fa-phone"></i> <span id="quickPhone">-</span></div>
                <div class="info-item"><i class="fas fa-calendar-plus"></i> <span id="quickJoining">-</span></div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div id="profileContainer">
                <div class="loading-state">
                    <div class="spinner"><i class="fas fa-circle-notch"></i></div>
                    <p>Loading teacher profile...</p>
                </div>
            </div>
        </main>

    </div>

    <!-- FOOTER -->
    <div class="footer-note">
        <span><i class="fas fa-school"></i> Sunshine School · est. 2006</span>
        <span><i class="fas fa-lock"></i> secure · staff profile</span>
    </div>

</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="deleteModalOverlay">
    <div class="confirm-modal">
        <div class="confirm-icon"><i class="fas fa-triangle-exclamation"></i></div>
        <h2>Delete this teacher?</h2>
        <p>You're about to permanently remove <strong id="deleteTeacherName">this teacher</strong> from the system. This action cannot be undone.</p>
        <div class="confirm-modal-msg" id="deleteModalMsg"></div>
        <div class="confirm-modal-footer">
            <button class="btn-action btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn-action btn-danger solid" id="deleteConfirmBtn" onclick="confirmDeleteTeacher()">
                <i class="fas fa-trash"></i> Delete
            </button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://sunshine-vtal.onrender.com"; // Change this to your actual API base URL

    const params = new URLSearchParams(window.location.search);
    const teacherId = params.get("id");

    // Reset-password panel state
    let resetPanelOpen = false;
    let pwVisible = false;

    // Holds the last successfully fetched teacher record, used by the delete confirm dialog
    let currentTeacher = null;

    if (!teacherId) {
        document.getElementById("profileContainer").innerHTML = `
            <div class="empty-state">
                <i class="fas fa-triangle-exclamation"></i>
                <p>Teacher ID not found.</p>
            </div>
        `;
    } else {
        fetchTeacher();
    }

    async function fetchTeacher() {
        try {
            const response = await fetch(`${API_URL}/api/teachers/${teacherId}`);
            const result = await response.json();

            const container = document.getElementById("profileContainer");

            if (!response.ok) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-triangle-exclamation"></i>
                        <p>${result.message || "Unable to load teacher."}</p>
                    </div>
                `;
                return;
            }

            const teacher = result.teacher;
            currentTeacher = teacher;
            displayTeacher(teacher);

        } catch (error) {
            console.error(error);
            document.getElementById("profileContainer").innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-wifi"></i>
                    <p>Unable to connect with server.</p>
                </div>
            `;
        }
    }

    function displayTeacher(teacher) {
        pwVisible = false;

        // Update sidebar
        const initials = (teacher.name || 'T').charAt(0).toUpperCase();
        document.getElementById("avatarIcon").innerHTML = initials;
        document.getElementById("teacherName").textContent = teacher.name || '-';
        document.getElementById("teacherIdDisplay").textContent = teacher.teacherId || 'ID: N/A';

        const status = teacher.status || 'active';
        const statusClass = status.toLowerCase();
        document.getElementById("statusBadge").textContent = status.charAt(0).toUpperCase() + status.slice(1);
        document.getElementById("statusBadge").className = `status-badge ${statusClass}`;

        document.getElementById("quickEmail").textContent = teacher.email || '-';
        document.getElementById("quickPhone").textContent = teacher.phone || '-';
        document.getElementById("quickJoining").textContent = formatDate(teacher.joiningDate);

        // ==========================================
        // ASSIGNED CLASSES
        // ==========================================

        let classesHTML = '';
        if (teacher.assignedClasses && Array.isArray(teacher.assignedClasses) && teacher.assignedClasses.length > 0) {
            teacher.assignedClasses.forEach(cls => {
                if (typeof cls === 'string') {
                    classesHTML += `<span class="class-tag"><i class="fas fa-chalkboard"></i> ${cls}</span>`;
                } else if (typeof cls === 'object' && cls !== null) {
                    const className = cls.class || cls.name || 'Unknown';
                    const sections = cls.sections ? `(${cls.sections.join(', ')})` : '';
                    const subjects = cls.subjects ? `📚 ${cls.subjects.join(', ')}` : '';
                    classesHTML += `
                        <span class="class-tag">
                            <i class="fas fa-chalkboard"></i> ${className}
                            ${sections ? `<span class="sub-detail">${sections}</span>` : ''}
                            ${subjects ? `<span class="sub-detail">${subjects}</span>` : ''}
                        </span>
                    `;
                }
            });
        } else if (teacher.assignedClasses && typeof teacher.assignedClasses === 'string') {
            classesHTML = `<span class="class-tag"><i class="fas fa-chalkboard"></i> ${teacher.assignedClasses}</span>`;
        } else {
            classesHTML = `<span style="color:#b09a7e;font-size:0.85rem;">No classes assigned</span>`;
        }

        // ==========================================
        // PERMISSIONS
        // ==========================================

        let permissionsHTML = '';
        if (teacher.permissions && typeof teacher.permissions === 'object') {
            Object.entries(teacher.permissions).forEach(([key, value]) => {
                const icon = value ? 'fa-check-circle allowed' : 'fa-circle-xmark denied';
                const label = value ? 'Allowed' : 'Not Allowed';
                permissionsHTML += `
                    <div class="perm-item">
                        <span class="perm-icon ${value ? 'allowed' : 'denied'}"><i class="fas ${icon}"></i></span>
                        <span class="perm-label">${formatText(key)}</span>
                        <span style="font-size:0.75rem;color:#b09a7e;">${label}</span>
                    </div>
                `;
            });
        } else {
            permissionsHTML = `<span style="color:#b09a7e;font-size:0.85rem;">No permissions defined</span>`;
        }

        // ==========================================
        // PROFILE (additional)
        // ==========================================

        let profileHTML = '';
        if (teacher.profile && typeof teacher.profile === 'object') {
            const profileLabels = {
                dob: 'Date of Birth',
                emergencyContact: 'Emergency Contact',
                bloodGroup: 'Blood Group'
            };
            Object.entries(teacher.profile).forEach(([key, value]) => {
                if (key === 'profilePhoto') return;
                if (value) {
                    const label = profileLabels[key] || formatText(key);
                    const displayValue = key === 'dob' ? formatDate(value) : value;
                    profileHTML += `
                        <div class="info-item">
                            <span class="label">${label}</span>
                            <span class="value">${displayValue}</span>
                        </div>
                    `;
                }
            });
        }

        // ==========================================
        // COMPLETE PROFILE
        // ==========================================

        const container = document.getElementById("profileContainer");

        container.innerHTML = `
            <!-- Basic Information -->
            <div class="section-title"><i class="fas fa-id-card"></i> Basic Information</div>
            <div class="info-grid">
                <div class="info-item"><span class="label">Teacher ID</span><span class="value">${teacher.teacherId || '-'}</span></div>
                <div class="info-item"><span class="label">Employee ID</span><span class="value">${teacher.employeeId || '-'}</span></div>
                <div class="info-item"><span class="label">Name</span><span class="value">${teacher.name || '-'}</span></div>
                <div class="info-item"><span class="label">Father Name</span><span class="value">${teacher.fatherName || '-'}</span></div>
                <div class="info-item"><span class="label">Department</span><span class="value">${teacher.department || '-'}</span></div>
                <div class="info-item"><span class="label">Mother Name</span><span class="value">${teacher.motherName || '-'}</span></div>
                <div class="info-item"><span class="label">Husband Name</span><span class="value">${teacher.husbandName || '-'}</span></div>
                <div class="info-item"><span class="label">Email</span><span class="value">${teacher.email || '-'}</span></div>
                <div class="info-item"><span class="label">Phone</span><span class="value">${teacher.phone || '-'}</span></div>
                <div class="info-item"><span class="label">Gender</span><span class="value">${teacher.gender || '-'}</span></div>
                <div class="info-item"><span class="label">Qualification</span><span class="value">${teacher.qualification || '-'}</span></div>
                <div class="info-item"><span class="label">Joining Date</span><span class="value">${formatDate(teacher.joiningDate)}</span></div>
                <div class="info-item"><span class="label">Role</span><span class="value">${teacher.role || '-'}</span></div>
                <div class="info-item"><span class="label">Status</span><span class="value"><span class="status-badge ${statusClass}" style="font-size:0.75rem;padding:0.1rem 0.8rem;">${status.charAt(0).toUpperCase() + status.slice(1)}</span></span></div>
                <div class="info-item full">
                    <span class="label"><i class="fas fa-key"></i> Password</span>
                    <span class="value">
                        <div class="password-value">
                            <span class="pw-text" id="pwText">••••••••</span>
                            <button class="btn-reset-pw" onclick="togglePwVisibility()" id="pwToggleBtn" title="Show/hide password">
                                <i class="fas fa-eye"></i> Show
                            </button>
                            <button class="btn-reset-pw" onclick="toggleResetPanel()" title="Reset this teacher's password">
                                <i class="fas fa-rotate"></i> Reset Password
                            </button>
                        </div>
                        <div class="reset-pw-panel" id="resetPwPanel">
                            <div class="field-row">
                                <input type="password" id="newPasswordInput" placeholder="New password (min 6 characters)" autocomplete="new-password" />
                                <button class="btn-action btn-primary" id="resetPwSubmitBtn" onclick="submitPasswordReset()">
                                    <i class="fas fa-check"></i> Save
                                </button>
                                <button class="btn-action btn-secondary" onclick="toggleResetPanel()">
                                    Cancel
                                </button>
                            </div>
                            <div class="reset-pw-msg" id="resetPwMsg"></div>
                        </div>
                    </span>
                </div>
            </div>

            <!-- Assigned Classes -->
            <div class="section-title"><i class="fas fa-chalkboard"></i> Assigned Classes</div>
            <div class="classes-list">${classesHTML}</div>

            <!-- Permissions -->
            <div class="section-title"><i class="fas fa-lock"></i> Permissions</div>
            <div class="permissions-grid">${permissionsHTML}</div>

            ${profileHTML ? `
                <div class="section-title"><i class="fas fa-address-card"></i> Additional Profile Information</div>
                <div class="info-grid">${profileHTML}</div>
            ` : ''}
        `;
    }

    // ==========================================
    // RESET PASSWORD PANEL
    // ==========================================

    function togglePwVisibility() {
        const pwText = document.getElementById('pwText');
        const btn = document.getElementById('pwToggleBtn');
        if (!pwText || !currentTeacher) return;

        pwVisible = !pwVisible;

        if (pwVisible) {
            pwText.textContent = currentTeacher.password || '(not set)';
            pwText.style.color = '#2d1f0c';
            pwText.style.letterSpacing = 'normal';
            btn.innerHTML = '<i class="fas fa-eye-slash"></i> Hide';
        } else {
            pwText.textContent = '••••••••';
            pwText.style.color = '';
            pwText.style.letterSpacing = '2px';
            btn.innerHTML = '<i class="fas fa-eye"></i> Show';
        }
    }

    function toggleResetPanel() {
        resetPanelOpen = !resetPanelOpen;
        const panel = document.getElementById('resetPwPanel');
        const msg = document.getElementById('resetPwMsg');
        if (panel) {
            panel.classList.toggle('open', resetPanelOpen);
        }
        if (msg) {
            msg.textContent = '';
            msg.className = 'reset-pw-msg';
        }
        const input = document.getElementById('newPasswordInput');
        if (input) {
            input.value = '';
            if (resetPanelOpen) input.focus();
        }
    }

    async function submitPasswordReset() {
        const input = document.getElementById('newPasswordInput');
        const msg = document.getElementById('resetPwMsg');
        const btn = document.getElementById('resetPwSubmitBtn');

        const newPassword = input ? input.value.trim() : '';

        if (!newPassword || newPassword.length < 6) {
            msg.textContent = 'Password must be at least 6 characters.';
            msg.className = 'reset-pw-msg error';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

        try {
            const response = await fetch(`${API_URL}/api/teachers/${teacherId}/reset-password`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPassword })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                msg.textContent = result.message || 'Unable to reset password.';
                msg.className = 'reset-pw-msg error';
                return;
            }

            msg.textContent = 'Password reset successfully.';
            msg.className = 'reset-pw-msg success';

            if (currentTeacher) {
                currentTeacher.password = newPassword;
            }
            if (pwVisible) {
                togglePwVisibility();
                togglePwVisibility();
            }

            input.value = '';

            setTimeout(() => {
                toggleResetPanel();
            }, 1200);

        } catch (error) {
            console.error(error);
            msg.textContent = 'Unable to connect with server.';
            msg.className = 'reset-pw-msg error';
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Save';
        }
    }

    // ==========================================
    // DELETE TEACHER
    // ==========================================

    function openDeleteModal() {
        if (!teacherId) {
            alert("Teacher ID not found.");
            return;
        }
        if (!currentTeacher) {
            alert("Teacher data hasn't loaded yet. Please wait a moment and try again.");
            return;
        }
        const msg = document.getElementById('deleteModalMsg');
        msg.textContent = '';
        msg.className = 'confirm-modal-msg';
        document.getElementById('deleteTeacherName').textContent = currentTeacher.name || 'this teacher';
        document.getElementById('deleteModalOverlay').classList.add('open');
    }

    function closeDeleteModal() {
        document.getElementById('deleteModalOverlay').classList.remove('open');
    }

    async function confirmDeleteTeacher() {
        const btn = document.getElementById('deleteConfirmBtn');
        const msg = document.getElementById('deleteModalMsg');
        msg.textContent = '';
        msg.className = 'confirm-modal-msg';

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';

        try {
            const response = await fetch(`${API_URL}/api/teachers/${teacherId}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (!response.ok || result.success === false) {
                msg.textContent = result.message || 'Unable to delete teacher.';
                msg.className = 'confirm-modal-msg error';
                return;
            }

            // Successfully deleted, go back to the teachers list
            window.location.href = "teacher-profile.html";

        } catch (error) {
            console.error(error);
            msg.textContent = 'Unable to connect with server.';
            msg.className = 'confirm-modal-msg error';
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-trash"></i> Delete';
        }
    }

    // ==========================================
    // HELPERS
    // ==========================================

    function formatText(text) {
        if (!text) return '';
        return text
            .replace(/([A-Z])/g, " $1")
            .replace(/^./, str => str.toUpperCase());
    }

    function formatDate(date) {
        if (!date) return "-";
        const d = new Date(date);
        if (isNaN(d.getTime())) return date;
        return d.toLocaleDateString("en-IN");
    }

    function goBack() {
        window.location.href = "teacher-profile.html";
    }

    function editTeacher() {
        if (!teacherId) {
            alert("Teacher ID not found.");
            return;
        }
        window.location.href = `teacher-profile-edit.html?id=${encodeURIComponent(teacherId)}`;
    }
</script>

</body>

</html>
