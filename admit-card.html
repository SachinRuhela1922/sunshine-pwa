<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine · Admit Card</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f7f3ed;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            background: white;
            border-radius: 32px;
            padding: 1.2rem 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-header h1 i {
            color: #f58a2e;
            background: #fcf3e8;
            padding: 0.3rem 0.6rem;
            border-radius: 16px;
            font-size: 1.2rem;
        }

        .page-header .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-secondary {
            background: #f0e2d2;
            color: #4d3e2b;
        }

        .btn-secondary:hover {
            background: #e6d5c0;
        }

        /* Main Box */
        .main-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
        }

        .main-box h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d1f0c;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .main-box h2 i {
            color: #f58a2e;
        }

        /* Info Card */
        .info-card {
            background: #fcf9f4;
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #f0e2d2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem 2rem;
        }

        .info-card .info-item {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            padding: 0.2rem 0;
        }

        .info-card .info-item .label {
            color: #b09a7e;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            min-width: 70px;
        }

        .info-card .info-item .value {
            color: #2d1f0c;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .info-card .info-item .value i {
            color: #f58a2e;
            margin-right: 0.3rem;
        }

        /* Section Title */
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #2d1f0c;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .section-title i {
            color: #f58a2e;
        }

        .section-title .badge {
            background: #f58a2e;
            color: white;
            font-size: 0.7rem;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-weight: 600;
        }

        /* Subject Rows */
        .subjects-container {
            margin-bottom: 1.2rem;
        }

        .subject-row {
            display: grid;
            grid-template-columns: 1fr 1fr 150px 50px;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            align-items: center;
            background: #fcfaf7;
            padding: 0.6rem 0.8rem;
            border-radius: 14px;
            border: 1px solid #f0e2d2;
            transition: all 0.2s;
        }

        .subject-row:hover {
            border-color: #f9b042;
            background: #fcf9f4;
        }

        .subject-row input {
            padding: 0.6rem 0.9rem;
            border: 1.5px solid #f0e2d2;
            border-radius: 10px;
            font-size: 0.88rem;
            background: white;
            transition: all 0.2s;
            outline: none;
            color: #1f160c;
            font-weight: 500;
            width: 100%;
        }

        .subject-row input:focus {
            border-color: #f58a2e;
            box-shadow: 0 0 0 4px rgba(245, 138, 46, 0.06);
        }

        .subject-row input::placeholder {
            color: #b8a58b;
            font-weight: 400;
        }

        .subject-row .subject-input {
            font-weight: 600;
        }

        .subject-row .date-input {
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        .subject-row .date-input.invalid {
            border-color: #b53b2e;
            box-shadow: 0 0 0 4px rgba(181, 59, 46, 0.06);
        }

        .subject-row .day-input {
            background: #fcfaf7;
            cursor: default;
            font-weight: 600;
            color: #2d1f0c;
        }

        .subject-row .day-input:focus {
            border-color: #f0e2d2;
            box-shadow: none;
        }

        .btn-remove {
            background: #fce4e0;
            border: none;
            color: #b53b2e;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .btn-remove:hover {
            background: #f5b7b1;
            transform: scale(1.05);
        }

        /* Buttons */
        .btn-add {
            background: #f0e2d2;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: #4d3e2b;
            margin-bottom: 1.5rem;
        }

        .btn-add:hover {
            background: #e6d5c0;
            transform: scale(1.02);
        }

        .btn-add i {
            color: #f58a2e;
        }

        .btn-save {
            background: linear-gradient(135deg, #f58a2e, #f9b042);
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: white;
            box-shadow: 0 4px 12px rgba(245, 138, 46, 0.2);
            width: 100%;
            justify-content: center;
        }

        .btn-save:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(245, 138, 46, 0.3);
        }

        .btn-save i {
            font-size: 1.1rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #b09a7e;
        }

        .empty-state i {
            font-size: 2.5rem;
            color: #f0e2d2;
            margin-bottom: 0.5rem;
        }

        /* Footer */
        .footer-note {
            margin-top: 2rem;
            border-top: 1px solid #f0e2d2;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            color: #b09a7e;
            font-size: 0.75rem;
        }

        .footer-note i {
            color: #f58a2e;
        }

        /* Responsive */
        @media (max-width: 820px) {
            .main-box {
                padding: 1.2rem 1.2rem;
            }
            .page-header h1 {
                font-size: 1.3rem;
            }
            .info-card {
                grid-template-columns: 1fr;
                gap: 0.2rem;
            }
            .subject-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
                padding: 0.8rem;
            }
            .btn-remove {
                width: 100%;
                height: 44px;
            }
        }

        @media (max-width: 480px) {
            .page-header .actions .btn-action {
                font-size: 0.75rem;
                padding: 0.3rem 0.8rem;
            }
            .info-card .info-item {
                flex-wrap: wrap;
            }
            .info-card .info-item .label {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-ticket"></i> Admit Card</h1>
        <div class="actions">
            <button class="btn-action btn-secondary" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-box">

        <h2><i class="fas fa-pen-to-square"></i> Create Admit Card</h2>

        <!-- Info Card -->
        <div class="info-card">
            <div class="info-item">
                <span class="label"><i class="fas fa-file"></i> Exam</span>
                <span class="value" id="examName"><i class="fas fa-tag"></i> -</span>
            </div>
            <div class="info-item">
                <span class="label"><i class="fas fa-graduation-cap"></i> Class</span>
                <span class="value" id="className"><i class="fas fa-chalkboard"></i> -</span>
            </div>
        </div>

        <!-- Subjects -->
        <div class="section-title">
            <i class="fas fa-book"></i> Subjects
            <span class="badge" id="subjectCount">0</span>
        </div>

        <div class="subjects-container" id="subjectsContainer"></div>

        <button class="btn-add" onclick="addSubject()">
            <i class="fas fa-plus-circle"></i> Add Subject
        </button>

        <button class="btn-save" onclick="saveAdmitCard()">
            <i class="fas fa-save"></i> Save Admit Card
        </button>

    </div>

    <!-- FOOTER -->
    <div class="footer-note">
        <span><i class="fas fa-school"></i> Sunshine School · est. 2006</span>
        <span><i class="fas fa-lock"></i> secure · admit card</span>
    </div>

</div>


<script>
    const API_URL = "https://sunshine-swp6.onrender.com";

    const params = new URLSearchParams(window.location.search);

    const exam = params.get("exam") || "";
    const className = params.get("class") || "";

    document.getElementById("examName").innerHTML = `<i class="fas fa-tag"></i> ${exam || 'Not specified'}`;
    document.getElementById("className").innerHTML = `<i class="fas fa-chalkboard"></i> ${className || 'Not specified'}`;

    let subjectCounter = 0;

    /* =========================
       DATE HELPERS
       User types digits only (e.g. 25082026) and it auto-formats
       into DD/MM/YYYY as they type, no calendar popup.
    ========================= */

    // Formats raw digits into DD/MM/YYYY as the user types
    function formatDateInput(raw) {
        const digits = raw.replace(/\D/g, "").slice(0, 8); // max 8 digits: DDMMYYYY
        let out = digits;

        if (digits.length > 4) {
            out = digits.slice(0, 2) + "/" + digits.slice(2, 4) + "/" + digits.slice(4);
        } else if (digits.length > 2) {
            out = digits.slice(0, 2) + "/" + digits.slice(2);
        }

        return out;
    }

    // Parses DD/MM/YYYY into a real Date object, or null if invalid/incomplete
    function parseDDMMYYYY(value) {
        const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(value);
        if (!match) return null;

        const day = parseInt(match[1], 10);
        const month = parseInt(match[2], 10);
        const year = parseInt(match[3], 10);

        if (month < 1 || month > 12) return null;

        const date = new Date(year, month - 1, day);

        // Reject dates like 31/02/2026 that JS silently rolls over
        if (
            date.getFullYear() !== year ||
            date.getMonth() !== month - 1 ||
            date.getDate() !== day
        ) {
            return null;
        }

        return date;
    }

    /* =========================
       ADD SUBJECT
    ========================= */

    function addSubject() {
        const container = document.getElementById("subjectsContainer");

        const row = document.createElement("div");
        row.className = "subject-row";

        row.innerHTML = `
            <input
                type="text"
                class="subject-input"
                placeholder="Subject name"
                autocomplete="off"
            >

            <input
                type="text"
                class="date-input"
                placeholder="DD/MM/YYYY"
                inputmode="numeric"
                autocomplete="off"
                maxlength="10"
            >

            <input
                type="text"
                class="day-input"
                placeholder="Day"
                readonly
            >

            <button
                class="btn-remove"
                onclick="this.parentElement.remove(); updateCount();"
            >
                ×
            </button>
        `;

        const dateInput = row.querySelector(".date-input");
        const dayInput = row.querySelector(".day-input");

        // Auto-format while typing (adds "/" automatically)
        dateInput.addEventListener("input", function (e) {
            const cursorAtEnd = this.selectionStart === this.value.length;
            this.value = formatDateInput(this.value);
            if (cursorAtEnd) {
                this.setSelectionRange(this.value.length, this.value.length);
            }

            const parsed = parseDDMMYYYY(this.value);
            if (this.value.length === 10) {
                if (parsed) {
                    dayInput.value = parsed.toLocaleDateString("en-US", { weekday: "long" });
                    this.classList.remove("invalid");
                } else {
                    dayInput.value = "";
                    this.classList.add("invalid");
                }
            } else {
                dayInput.value = "";
                this.classList.remove("invalid");
            }
        });

        // Allow backspace to remove the auto-inserted "/" cleanly
        dateInput.addEventListener("keydown", function (e) {
            if (e.key === "Backspace" && this.value.endsWith("/")) {
                e.preventDefault();
                this.value = this.value.slice(0, -1);
                const parsed = parseDDMMYYYY(this.value);
                dayInput.value = parsed ? parsed.toLocaleDateString("en-US", { weekday: "long" }) : "";
                this.classList.remove("invalid");
            }
        });

        // Auto-focus the subject input
        const subjectInput = row.querySelector(".subject-input");
        setTimeout(() => subjectInput.focus(), 100);

        container.appendChild(row);
        updateCount();
    }

    /* =========================
       UPDATE COUNT
    ========================= */

    function updateCount() {
        const rows = document.querySelectorAll(".subject-row");
        document.getElementById("subjectCount").textContent = rows.length;
    }

    /* =========================
       FIRST SUBJECT
    ========================= */

    addSubject();

    /* =========================
       SAVE
    ========================= */

    async function saveAdmitCard() {
        const rows = document.querySelectorAll(".subject-row");

        const subjects = [];
        let hasInvalid = false;

        rows.forEach(row => {
            const subject = row.querySelector(".subject-input").value.trim();
            const dateRaw = row.querySelector(".date-input").value.trim();
            const day = row.querySelector(".day-input").value;

            if (!subject && !dateRaw) return; // empty row, skip

            const parsed = parseDDMMYYYY(dateRaw);

            if (subject && dateRaw && !parsed) {
                hasInvalid = true;
                row.querySelector(".date-input").classList.add("invalid");
                return;
            }

            if (subject && parsed) {
                // Convert to ISO (YYYY-MM-DD) for the backend, same as before
                const iso = parsed.toISOString().slice(0, 10);
                subjects.push({
                    subject,
                    date: iso,
                    day
                });
            }
        });

        if (hasInvalid) {
            alert("⚠️ Please enter a valid date in DD/MM/YYYY format.");
            return;
        }

        if (subjects.length === 0) {
            alert("⚠️ Please add at least one subject with a date.");
            return;
        }

        const data = {
            exam,
            className,
            subjects
        };

        try {
            const response = await fetch(
                `${API_URL}/api/admitcard`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }
            );

            const result = await response.json();

            if (!response.ok) {
                alert(result.message || "Failed to save admit card");
                return;
            }

            alert("✅ Admit card saved successfully!");

            window.location.href =
                `exam-student.html?exam=${encodeURIComponent(exam)}&class=${encodeURIComponent(className)}`;

        } catch (error) {
            console.error(error);
            alert("❌ Server connection error. Please try again.");
        }
    }
</script>

</body>
</html>
