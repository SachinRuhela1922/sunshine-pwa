<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<title>Sunshine · Exam Marks</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ===== ALL STYLES REMAIN SAME ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
}

body {
    background: #f7f3ed;
    min-height: 100vh;
    padding: 1.5rem;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
}

/* ===== HEADER ===== */
.page-header {
    background: white;
    border-radius: 32px;
    padding: 1.2rem 2rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.02);
    border: 1px solid rgba(245, 138, 46, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.8rem;
}

.page-header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #2d1f0c;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.page-header h1 i {
    color: #f58a2e;
    background: #fcf3e8;
    padding: 0.3rem 0.6rem;
    border-radius: 16px;
    font-size: 1.2rem;
}

.page-header .header-sub {
    font-size: 0.85rem;
    color: #b09a7e;
    font-weight: 500;
    margin-top: 0.2rem;
}

.page-header .header-sub i {
    color: #f58a2e;
    margin-right: 0.3rem;
}

.page-header .actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
}

.btn-action {
    padding: 0.5rem 1.2rem;
    border: none;
    border-radius: 60px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
}

.btn-secondary {
    background: #f0e2d2;
    color: #4d3e2b;
}

.btn-secondary:hover {
    background: #e6d5c0;
}

/* ===== EXAM BANNER ===== */
.exam-banner {
    background: linear-gradient(135deg, #fcf3e8, #f9dbb8);
    border-radius: 28px;
    padding: 1.5rem 2rem;
    margin-bottom: 1.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    border: 1px solid rgba(245, 138, 46, 0.15);
}

.exam-banner .exam-info {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.exam-banner .exam-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f58a2e;
    font-size: 1.8rem;
    box-shadow: 0 4px 12px rgba(245, 138, 46, 0.1);
}

.exam-banner .exam-details h2 {
    font-size: 1.2rem;
    color: #2d1f0c;
    font-weight: 700;
}

.exam-banner .exam-details p {
    color: #8a765e;
    font-size: 0.85rem;
    margin-top: 0.1rem;
}

.exam-banner .exam-badge {
    background: white;
    padding: 0.4rem 1.2rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.8rem;
    color: #f58a2e;
    box-shadow: 0 2px 8px rgba(245, 138, 46, 0.08);
}

.exam-banner .exam-badge i {
    margin-right: 0.4rem;
}

/* ===== ACTION BAR ===== */
.action-bar {
    background: white;
    border-radius: 20px;
    padding: 1rem 1.5rem;
    margin-bottom: 1.8rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.8rem;
    border: 1px solid rgba(245, 138, 46, 0.06);
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
}

.action-bar .action-group {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    align-items: center;
}

.action-bar .action-label {
    font-size: 0.75rem;
    color: #b09a7e;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 0.4rem;
}

.action-bar .action-label i {
    color: #f58a2e;
}

.btn-action-primary {
    padding: 0.5rem 1.2rem;
    border: none;
    border-radius: 60px;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
}

.btn-admit {
    background: linear-gradient(135deg, #f58a2e, #f9b042);
    color: white;
    box-shadow: 0 4px 12px rgba(245, 138, 46, 0.2);
}

.btn-admit:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(245, 138, 46, 0.3);
}

.btn-download {
    background: linear-gradient(135deg, #2b7a3a, #3a9e4a);
    color: white;
    box-shadow: 0 4px 12px rgba(43, 122, 58, 0.2);
}

.btn-download:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(43, 122, 58, 0.3);
}

.btn-add-subject-all {
    background: linear-gradient(135deg, #1a5276, #2e86c1);
    color: white;
    box-shadow: 0 4px 12px rgba(26, 82, 118, 0.2);
}

.btn-add-subject-all:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(26, 82, 118, 0.3);
}

/* ===== SEARCH BAR ===== */
.search-bar-wrapper {
    margin-bottom: 1.2rem;
}

.search-bar {
    background: white;
    border-radius: 16px;
    padding: 0.2rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    border: 1px solid rgba(245, 138, 46, 0.1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    transition: all 0.2s;
}

.search-bar:focus-within {
    border-color: #f58a2e;
    box-shadow: 0 0 0 3px rgba(245, 138, 46, 0.08);
}

.search-bar i.fa-search {
    color: #f58a2e;
    font-size: 0.95rem;
}

.search-bar input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    padding: 0.7rem 0;
    font-size: 0.9rem;
    color: #2d1f0c;
    font-weight: 500;
}

.search-bar input::placeholder {
    color: #b8a58b;
    font-weight: 400;
}

.clear-search-btn {
    border: none;
    background: #fcf3e8;
    color: #b09a7e;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    transition: all 0.2s;
    flex-shrink: 0;
}

.clear-search-btn:hover {
    background: #fce4e0;
    color: #b53b2e;
}

/* ===== SECTION HEADER ===== */
.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
}

.section-header h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: #2d1f0c;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.section-header h3 i {
    color: #f58a2e;
}

.section-header .count-badge {
    background: #fcf3e8;
    color: #f58a2e;
    padding: 0.2rem 0.8rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.75rem;
    border: 1px solid rgba(245, 138, 46, 0.1);
}

.section-header .hint {
    font-size: 0.8rem;
    color: #b09a7e;
}

.section-header .hint i {
    color: #f58a2e;
}

/* ===== STUDENT CARD ===== */
.student-card {
    background: white;
    border-radius: 24px;
    padding: 1.5rem 1.8rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.02);
    border: 1px solid rgba(245, 138, 46, 0.06);
    transition: all 0.3s;
}

.student-card:hover {
    border-color: rgba(245, 138, 46, 0.15);
    box-shadow: 0 8px 35px rgba(0,0,0,0.04);
}

.student-card .student-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-bottom: 1rem;
    padding-bottom: 0.8rem;
    border-bottom: 2px solid #fcf3e8;
}

.student-card .student-header .student-name {
    display: flex;
    align-items: center;
    gap: 0.8rem;
}

.student-card .student-header .student-name .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #fcf3e8;
    color: #f58a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
}

.student-card .student-header .student-name h4 {
    font-size: 1.05rem;
    font-weight: 700;
    color: #2d1f0c;
}

.student-card .student-header .student-name .student-id {
    font-size: 0.75rem;
    color: #b09a7e;
    font-weight: 500;
    display: block;
}

.student-card .student-header .student-meta {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
}

.student-card .student-header .student-meta .meta-item {
    font-size: 0.78rem;
    color: #7f6a4b;
    background: #fcfaf7;
    padding: 0.2rem 0.8rem;
    border-radius: 30px;
    border: 1px solid #f0e2d2;
}

.student-card .student-header .student-meta .meta-item i {
    color: #f58a2e;
    margin-right: 0.3rem;
}

/* ===== STUDENT INFO ===== */
.student-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.6rem;
    margin-bottom: 1.2rem;
}

.info-box {
    background: #fcfaf7;
    padding: 0.4rem 0.8rem;
    border-radius: 10px;
    border: 1px solid #f0e2d2;
}

.info-box strong {
    display: block;
    font-size: 0.65rem;
    color: #b09a7e;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-weight: 600;
}

.info-box .info-value {
    font-size: 0.88rem;
    color: #2d1f0c;
    font-weight: 500;
}

/* ===== SUBJECT ACTIONS ===== */
.subject-actions {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin: 0.8rem 0 0.6rem;
}

.subject-actions .subject-count {
    font-size: 0.78rem;
    color: #b09a7e;
    font-weight: 500;
}

.subject-actions .subject-count i {
    color: #f58a2e;
    margin-right: 0.3rem;
}

.add-subject-btn {
    background: #f0e2d2;
    border: none;
    padding: 0.35rem 1rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: #4d3e2b;
}

.add-subject-btn:hover {
    background: #e6d5c0;
}

.add-subject-btn i {
    color: #f58a2e;
}

/* ===== TABLE ===== */
.table-wrapper {
    overflow-x: auto;
    margin-top: 0.5rem;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
    border-radius: 14px;
    overflow: hidden;
}

th, td {
    padding: 0.6rem 0.8rem;
    border: 1px solid #f0e2d2;
    text-align: center;
}

th {
    background: #fcf3e8;
    color: #3d2e1b;
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

td {
    background: white;
}

td input {
    padding: 0.4rem 0.6rem;
    border: 1.5px solid #f0e2d2;
    border-radius: 8px;
    font-size: 0.85rem;
    background: #fcfaf7;
    transition: all 0.2s;
    outline: none;
    color: #1f160c;
    font-weight: 500;
    width: 100%;
    max-width: 150px;
}

td input:focus {
    border-color: #f58a2e;
    background: white;
    box-shadow: 0 0 0 3px rgba(245, 138, 46, 0.06);
}

td input::placeholder {
    color: #b8a58b;
    font-weight: 400;
}

td input[type="number"] {
    max-width: 100px;
}

td input[readonly] {
    background: #f0f0f0;
    cursor: not-allowed;
    color: #555;
}

.remove-subject-btn {
    background: #fce4e0;
    border: none;
    color: #b53b2e;
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
}

.remove-subject-btn:hover {
    background: #f5b7b1;
}

/* ===== STATUS ===== */
.status {
    margin-top: 0.8rem;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    background: #fcfaf7;
    border: 1px solid #f0e2d2;
}

.status .success {
    color: #2b7a3a;
}

.status .partial {
    color: #b5791f;
}

.status .locked {
    color: #b53b2e;
}

.status i {
    margin-right: 0.4rem;
}

/* ===== SAVE BUTTON ===== */
.save-btn {
    background: linear-gradient(135deg, #2b7a3a, #3a9e4a);
    color: white;
    border: none;
    padding: 0.6rem 1.8rem;
    border-radius: 60px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.8rem;
    box-shadow: 0 4px 12px rgba(43, 122, 58, 0.15);
}

.save-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(43, 122, 58, 0.25);
}

.save-btn:disabled {
    background: #6c757d;
    cursor: not-allowed;
    opacity: 0.7;
    box-shadow: none;
}

.save-btn:disabled:hover {
    transform: none;
    box-shadow: none;
}

.save-btn i {
    font-size: 1rem;
}

/* ===== LOADING ===== */
.loading {
    text-align: center;
    padding: 3rem 2rem;
}

.loading i {
    font-size: 2.5rem;
    color: #f58a2e;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading p {
    color: #b09a7e;
    margin-top: 0.8rem;
    font-weight: 500;
}

/* ===== ERROR / EMPTY ===== */
.error {
    text-align: center;
    padding: 3rem 2rem;
    color: #b53b2e;
}

.error i {
    font-size: 2.5rem;
    color: #fce4e0;
    display: block;
    margin-bottom: 0.8rem;
}

/* ===== OVERLAY ===== */
.overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.overlay.active {
    display: flex;
}

.overlay-content {
    background: white;
    border-radius: 24px;
    padding: 2rem;
    max-width: 950px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.overlay-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid #fcf3e8;
}

.overlay-header h2 {
    font-size: 1.3rem;
    color: #2d1f0c;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.overlay-header h2 i {
    color: #f58a2e;
}

.close-overlay {
    background: #fce4e0;
    color: #b53b2e;
    border: none;
    padding: 0.5rem 1.2rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
}

.close-overlay:hover {
    background: #f5b7b1;
}

.overlay-actions {
    display: flex;
    gap: 0.8rem;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 2px solid #fcf3e8;
    justify-content: flex-end;
}

.download-pdf-btn {
    background: linear-gradient(135deg, #2b7a3a, #3a9e4a);
    color: white;
    border: none;
    padding: 0.7rem 2rem;
    border-radius: 60px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
}

.download-pdf-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(43, 122, 58, 0.25);
}

/* ===== ADMIT CARD PREVIEW ===== */
.admit-card-preview {
    border: 2px solid #1a2a3a;
    border-radius: 12px;
    padding: 1.5rem;
    background: white;
    margin: 0.8rem 0;
}

.admit-card-preview .header-band {
    background: linear-gradient(135deg, #1a2a3a, #2d4a6a);
    color: white;
    padding: 0.8rem;
    text-align: center;
    border-radius: 6px;
    margin: -1.5rem -1.5rem 1rem -1.5rem;
}

.admit-card-preview .header-band h3 {
    margin: 0;
    font-size: 1.1rem;
    letter-spacing: 2px;
}

.admit-card-preview .header-band p {
    margin: 4px 0 0;
    font-size: 0.8rem;
    opacity: 0.85;
}

.admit-card-preview .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.4rem 1.5rem;
    margin: 0.8rem 0;
    padding: 0.8rem 1rem;
    background: #fcfaf7;
    border-radius: 8px;
}

.admit-card-preview .info-item {
    font-size: 0.82rem;
}

.admit-card-preview .info-item strong {
    color: #7f6a4b;
}

.admit-card-preview table {
    font-size: 0.8rem;
    margin: 0.5rem 0;
}

.admit-card-preview table th {
    background: #f58a2e;
    color: white;
}

.admit-card-preview .footer-text {
    text-align: center;
    color: #b09a7e;
    font-size: 0.7rem;
    margin-top: 0.8rem;
    padding-top: 0.5rem;
    border-top: 1px solid #f0e2d2;
}

.admit-card-preview .page-break {
    border-top: 2px dashed #ddd;
    margin: 1.2rem 0;
}

/* ===== FOOTER ===== */
.footer-note {
    margin-top: 2.5rem;
    border-top: 1px solid #f0e2d2;
    padding-top: 1.2rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    color: #b09a7e;
    font-size: 0.75rem;
}

.footer-note i {
    color: #f58a2e;
}

/* ===== RESPONSIVE - IMPROVED FOR MOBILE ===== */
@media (max-width: 820px) {
    .page-header {
        padding: 1rem 1.2rem;
    }
    .page-header h1 {
        font-size: 1.2rem;
    }
    .exam-banner {
        padding: 1rem 1.2rem;
        flex-direction: column;
        text-align: center;
    }
    .exam-banner .exam-info {
        flex-direction: column;
        text-align: center;
    }
    .exam-banner .exam-icon {
        width: 44px;
        height: 44px;
        font-size: 1.3rem;
    }
    .action-bar {
        flex-direction: column;
        align-items: stretch;
    }
    .action-bar .action-group {
        justify-content: center;
        flex-wrap: wrap;
    }
    .student-card {
        padding: 1rem 1.2rem;
    }
    .student-card .student-header {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
    }
    .student-card .student-header .student-name {
        justify-content: center;
    }
    .student-card .student-header .student-meta {
        justify-content: center;
    }
    .student-info {
        grid-template-columns: 1fr 1fr;
    }
    table {
        font-size: 0.8rem;
    }
    th, td {
        padding: 0.6rem 0.5rem;
    }
    
    /* Mobile-friendly input sizing */
    td input {
        font-size: 0.9rem;
        padding: 0.6rem 0.5rem;
        min-height: 44px;
        border-radius: 10px;
    }
    
    td input[type="number"] {
        max-width: 80px;
        font-size: 0.9rem;
        min-height: 44px;
    }
    
    td input[type="text"] {

<body>

<script>

// ==========================================
// API AND INITIALIZATION
// ==========================================

const API = "https://sunshine-vtal.onrender.com";

const params = new URLSearchParams(window.location.search);

const exam = params.get("exam") || "";
const className = params.get("class") || "";

document.getElementById("examName").textContent = exam || "Exam Not Specified";
document.getElementById("className").textContent = className || "Not Specified";
document.getElementById("pageTitle").textContent = `${exam || 'Exam'} Marks Entry`;

let students = [];
let existingMarks = [];
let studentSubjects = {}; // Will store subject list for each student
let currentAdmitCardData = [];

// ==========================================
// LOAD STUDENTS
// ==========================================

async function loadStudents() {
    const container = document.getElementById("studentsContainer");

    try {
        const studentResponse = await fetch(
            `${API}/api/exam/classes/${encodeURIComponent(className)}/students`
        );

        const studentData = await studentResponse.json();

        if (!studentResponse.ok || !studentData.success) {
            throw new Error(studentData.message || "Unable to load students.");
        }

        students = studentData.students || [];

        const marksResponse = await fetch(
            `${API}/api/exam-marks/${encodeURIComponent(exam)}/${encodeURIComponent(className)}`
        );

        const marksData = await marksResponse.json();

        if (marksResponse.ok && marksData.success) {
            existingMarks = marksData.examMarks || [];
        }

        document.getElementById("studentCount").textContent = students.length;
        document.getElementById("studentCountLabel").textContent = `${students.length} Students`;

        // Initialize subjects for each student
        // If any student has saved marks, use those subjects for ALL students
        let commonSubjects = [];

        // First, check if any student has saved marks with subjects
        for (const student of students) {
            const saved = existingMarks.find(
                record => String(record.studentMongoId) === String(student._id)
            );
            if (saved && saved.marks && saved.marks.length) {
                const subjects = saved.marks.map(m => m.subjectName);
                if (subjects.length > commonSubjects.length) {
                    commonSubjects = subjects;
                }
            }
        }

        students.forEach((student, index) => {
            // Check if this student has saved marks
            const saved = existingMarks.find(
                record => String(record.studentMongoId) === String(student._id)
            );
            
            if (saved && saved.marks && saved.marks.length) {
                // Use the student's own saved subjects
                studentSubjects[index] = saved.marks.map(m => m.subjectName);
            } else if (commonSubjects.length > 0) {
                // Use common subjects from other students
                studentSubjects[index] = [...commonSubjects];
            } else {
                // Start with empty
                studentSubjects[index] = [];
            }
        });

        renderStudents();

    } catch (error) {
        console.error(error);
        container.innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> ${escapeHtml(error.message)}</div>`;
    }
}

// ==========================================
// RENDER STUDENTS
// ==========================================

let currentSearchTerm = "";

function studentMatchesSearch(student, term) {
    if (!term) return true;
    const haystack = [
        student.studentName,
        student.studentId,
        student.rollNumber,
        student.admissionNumber
    ]
        .filter(Boolean)
        .map(v => String(v).toLowerCase())
        .join(" | ");
    return haystack.includes(term);
}

function renderStudents() {
    const container = document.getElementById("studentsContainer");

    if (!students.length) {
        container.innerHTML = `<div class="error"><i class="fas fa-users-slash"></i> No students found in this class.</div>`;
        document.getElementById("studentCount").textContent = "0";
        return;
    }

    const term = currentSearchTerm.trim().toLowerCase();

    // Keep original indices intact (studentSubjects / DOM ids rely on them)
    // while only rendering the cards that match the current search term.
    const visibleEntries = students
        .map((student, index) => ({ student, index }))
        .filter(({ student }) => studentMatchesSearch(student, term));

    document.getElementById("studentCount").textContent =
        term ? `${visibleEntries.length}/${students.length}` : students.length;

    if (!visibleEntries.length) {
        container.innerHTML = `<div class="error"><i class="fas fa-search"></i> No students match "${escapeHtml(currentSearchTerm)}".</div>`;
        return;
    }

    container.innerHTML = visibleEntries
        .map(({ student, index }) => createStudentCard(student, index))
        .join("");
}

function filterStudents(value) {
    currentSearchTerm = value || "";
    document.getElementById("clearSearchBtn").style.display = currentSearchTerm ? "flex" : "none";
    renderStudents();
}

function clearStudentSearch() {
    currentSearchTerm = "";
    const input = document.getElementById("studentSearchInput");
    if (input) input.value = "";
    document.getElementById("clearSearchBtn").style.display = "none";
    renderStudents();
}

function updateSubjectNameInState(studentIndex, rowNum, newSubjectName) {
    if (studentSubjects[studentIndex] && studentSubjects[studentIndex][rowNum] !== undefined) {
        studentSubjects[studentIndex][rowNum] = newSubjectName;
    }
}

// Returns the saved-marks entry (if any) for a given subject row.
// Tries positional match first, then falls back to matching by name.
function getSavedSubjectEntry(savedMarks, subjectName, subjectIndex) {
    if (savedMarks[subjectIndex] && savedMarks[subjectIndex].subjectName === subjectName) {
        return savedMarks[subjectIndex];
    }
    return savedMarks.find(item => item.subjectName === subjectName);
}

// SECURITY RULE: once a student has ANY saved marks record, that student
// is permanently locked — no editing, ever, regardless of whether the
// obtained marks were 0 or higher. Only students with NO saved record at
// all (fresh students) can have marks added.
function isRowLocked(savedSubject) {
    return !!savedSubject;
}

function createStudentCard(student, index) {
    const saved = existingMarks.find(
        record => String(record.studentMongoId) === String(student._id)
    );

    const subjects = studentSubjects[index] || [];
    const savedMarks = saved?.marks || [];
    const initials = (student.studentName || 'S').charAt(0).toUpperCase();

    // A saved record (even with all-zero marks) permanently locks the
    // whole student. No partial / per-row editing after first save.
    const hasExistingRecord = !!(saved && saved.marks && saved.marks.length);

    const rowLockFlags = subjects.map((subjectName, subjectIndex) => {
        const savedSubject = getSavedSubjectEntry(savedMarks, subjectName, subjectIndex);
        return hasExistingRecord ? true : isRowLocked(savedSubject);
    });

    const lockedCount = rowLockFlags.filter(Boolean).length;
    const isFullyLocked = hasExistingRecord;
    const hasAnyLocked = lockedCount > 0;

    return `
        <div class="student-card" id="student-${index}">
            <div class="student-header">
                <div class="student-name">
                    <div class="avatar">${initials}</div>
                    <div>
                        <h4>${escapeHtml(student.studentName || "-")}</h4>
                        <span class="student-id"><i class="fas fa-id-badge"></i> ${escapeHtml(student.studentId || "ID: N/A")}</span>
                    </div>
                </div>
                <div class="student-meta">
                    <span class="meta-item"><i class="fas fa-sort-numeric-up"></i> Roll: ${escapeHtml(student.rollNumber || "-")}</span>
                    <span class="meta-item"><i class="fas fa-hashtag"></i> Adm: ${escapeHtml(student.admissionNumber || "-")}</span>
                    <span class="meta-item"><i class="fas fa-user-tie"></i> ${escapeHtml(student.fatherName || "-")}</span>
                </div>
            </div>

            <div class="student-info">
                <div class="info-box">
                    <strong>Student ID</strong>
                    <div class="info-value">${escapeHtml(student.studentId || "-")}</div>
                </div>
                <div class="info-box">
                    <strong>Roll Number</strong>
                    <div class="info-value">${escapeHtml(student.rollNumber || "-")}</div>
                </div>
                <div class="info-box">
                    <strong>Admission Number</strong>
                    <div class="info-value">${escapeHtml(student.admissionNumber || "-")}</div>
                </div>
                          <div class="info-box">
    <strong>Father Name</strong>
    <div class="info-value">${escapeHtml(student.father?.name || "-")}</div>
</div>
<div class="info-box">
    <strong>Mother Name</strong>
    <div class="info-value">${escapeHtml(student.mother?.name || "-")}</div>
</div>
                <div class="info-box">
    <strong>Phone</strong>
    <div class="info-value">${escapeHtml(student.contact?.phone || student.father?.phone || student.mother?.phone || student.guardian?.phone || "-")}</div>
</div>
            </div>

            <div class="subject-actions">
                ${!isFullyLocked ? `
                    <button class="add-subject-btn" onclick="addSubjectToAllStudents()">
                        <i class="fas fa-plus-circle"></i> Add Subject to All
                    </button>
                ` : `
                    <span style="font-size:0.78rem;color:#b53b2e;font-weight:600;">
                        <i class="fas fa-lock"></i> All Marks Locked - No edits allowed
                    </span>
                `}
                ${subjects.length > 0 ? `<span class="subject-count"><i class="fas fa-book"></i> ${subjects.length} subject${subjects.length !== 1 ? 's' : ''}${hasAnyLocked ? ` · ${lockedCount} locked` : ''}</span>` : ''}
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:30%;"><i class="fas fa-book-open"></i> Subject Name</th>
                            <th style="width:35%;"><i class="fas fa-arrow-up"></i> Max Marks</th>
                            <th style="width:35%;"><i class="fas fa-arrow-down"></i> Obtained Marks</th>
                        </tr>
                    </thead>
                    <tbody id="marks-body-${index}">
                        ${subjects.map((subjectName, subjectIndex) => {
                            const savedSubject = getSavedSubjectEntry(savedMarks, subjectName, subjectIndex);
                            const isReadonly = rowLockFlags[subjectIndex];

                            return `
                                <tr id="subject-row-${index}-${subjectIndex}">
                                    <td>
                                        <input 
                                            type="text" 
                                            class="subject-name-input" 
                                            data-student="${index}" 
                                            data-row="${subjectIndex}"
                                            value="${escapeHtml(subjectName)}"
                                            placeholder="Enter subject name"
                                            onchange="updateSubjectNameInState(${index}, ${subjectIndex}, this.value)"
                                            ${isReadonly ? 'readonly' : ''}
                                        >
                                    </td>
                                    <td>
                                        <input 
                                            type="number" 
                                            min="0" 
                                            class="max-mark" 
                                            data-student="${index}" 
                                            data-row="${subjectIndex}"
                                            value="${savedSubject?.maxMarks || ""}"
                                            placeholder="Max"
                                            ${isReadonly ? 'readonly' : ''}
                                        >
                                    </td>
                                    <td>
                                        <div style="display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap;">
    <input 
        type="number" 
        min="0" 
        class="obtained-mark" 
        data-student="${index}" 
        data-row="${subjectIndex}"
        value="${savedSubject?.status === 'ABSENT' ? '' : (savedSubject?.obtainedMarks ?? '')}"
        placeholder="Obtained"
        ${savedSubject?.status === 'ABSENT' ? 'disabled' : ''}
    >

    <button
        type="button"
        class="absent-btn"
        onclick="toggleAbsent(${index}, ${subjectIndex}, this)"
        style="
            border:none;
            background:${savedSubject?.status === 'ABSENT' ? '#b53b2e' : '#f0e2d2'};
            color:${savedSubject?.status === 'ABSENT' ? 'white' : '#4d3e2b'};
            padding:7px 10px;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
            white-space:nowrap;
            touch-action:manipulation;
            min-height:36px;
        "
    >
        ${savedSubject?.status === 'ABSENT' ? 'Present' : 'Absent'}
    </button>
</div>
                                    </td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            </div>

            <div id="summary-${index}" class="status">
                ${isFullyLocked ? `
                    <span class="success">
                        <i class="fas fa-check-circle"></i> ✅ Marks Saved & Locked · 
                        Total: ${saved.totalObtainedMarks} / ${saved.totalMaxMarks} · 
                        ${saved.percentage}% · ${escapeHtml(saved.result)}
                    </span>
                ` : hasAnyLocked ? `
                    <span class="partial">
                        <i class="fas fa-hourglass-half"></i> ⏳ ${lockedCount} of ${subjects.length} subject(s) locked ·
                        remaining subjects are still editable
                    </span>
                ` : `
                    <span><i class="fas fa-clock"></i> ⏳ Marks not saved yet.</span>
                `}
            </div>

            <button class="save-btn" onclick="saveMarks(${index})" ${isFullyLocked ? 'disabled' : ''}>
                ${isFullyLocked

function addSubjectToAllStudents() {
    const subjectName = prompt("Enter the subject name to add for all students:");
    if (!subjectName || subjectName.trim() === '') {
        return;

    const trimmedSubject = subjectName.trim();

    let addedCount = 0;
    let skippedCount = 0;

    students.forEach((student, index) => {
        if (!studentSubjects[index]) {
            studentSubjects[index] = [];

// ==========================================
// SAVE MARKS - PERMANENTLY LOCKS THE STUDENT ONCE SAVED
// Fresh students (no existing record) can be saved once. After that,
// no further edits are allowed — not even for 0/blank marks.
// ==========================================

async function saveMarks(index) {
    const student = students[index];

    // Hard guard: block save entirely if a record already exists for this
    // student, even if someone tampers with the DOM/readonly attributes.
    const alreadySaved = existingMarks.find(
        record => String(record.studentMongoId) === String(student._id)
    );
    if (alreadySaved && alreadySaved.marks && alreadySaved.marks.length) {
        alert("⚠️ Marks for this student are already saved and permanently locked. Editing is not allowed.");
        renderStudents();
        return;
    }

    const card = document.getElementById(`student-${index}`);

    const rows = card.querySelectorAll(`#marks-body-${index} tr`);
    const marks = [];

    rows.forEach((row) => {

    const subjectInput =
        row.querySelector('.subject-name-input');

    const maxInput =
        row.querySelector('.max-mark');

    const obtainedInput =
        row.querySelector('.obtained-mark');


    const subjectName =
        subjectInput
            ? subjectInput.value.trim()
            : '';

    const maxMarks =
        Number(maxInput?.value) || 0;


    const isAbsent =
        obtainedInput?.dataset.absent === "true";


    const obtainedMarks =
        isAbsent
            ? 0
            : Number(obtainedInput?.value) || 0;


    if (subjectName) {

        marks.push({

            subjectName,

            maxMarks,

            obtainedMarks,

            status:
                isAbsent
                    ? "ABSENT"
                    : "PRESENT"

        });

    }

});
    if (!marks.length) {
        alert('Please add at least one subject with a name.');
        return;
    }

    // Validate all marks (locked rows keep their old, already-valid values,
    // so this mainly guards the still-editable ones)
    let allValid = true;
    let errorMsg = '';
    for (const mark of marks) {
        if (!mark.subjectName) {
            allValid = false;
            errorMsg = 'All subjects must have a name.';
            break;
        }
        if (mark.maxMarks <= 0) {
            allValid = false;
            errorMsg = `Max marks for "${mark.subjectName}" must be greater than 0.`;
            break;
        }
        if (mark.obtainedMarks < 0) {
            allValid = false;
            errorMsg = `Obtained marks for "${mark.subjectName}" cannot be negative.`;
            break;
        }
        if (mark.obtainedMarks > mark.maxMarks) {
            allValid = false;
            errorMsg = `Obtained marks (${mark.obtainedMarks}) cannot exceed max marks (${mark.maxMarks}) for "${mark.subjectName}".`;
            break;
        }
    }

    if (!allValid) {
        alert(errorMsg);
        return;
    }

    const confirmSubmit = confirm(
        `⚠️ Once saved, marks for ${student.studentName} CANNOT be edited again — ever, ` +
        `even if a subject is left at 0 or blank.\n` +
        `Please double-check every value before continuing.\n\n` +
        `Do you want to save?`
    );

    if (!confirmSubmit) return;
    
    // Update stored subjects
    studentSubjects[index] = marks.map(m => m.subjectName);

    try {
        const response = await fetch(`${API}/api/exam-marks`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                exam,
                className,
                studentMongoId: student._id,
                marks
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to save marks.");
        }

        // Refresh existingMarks from server so newly-locked (>0) rows
        // become readonly on next render, while 0/blank ones stay open.
        const marksResponse = await fetch(
            `${API}/api/exam-marks/${encodeURIComponent(exam)}/${encodeURIComponent(className)}`
        );
        const marksData = await marksResponse.json();
        if (marksResponse.ok && marksData.success) {
            existingMarks = marksData.examMarks || [];
        }

        // Re-render to show updated lock state
        renderStudents();

        alert(`✅ Marks for ${student.studentName} saved and permanently locked.`);

    } catch (error) {
        console.error(error);
        alert("Error: " + error.message);
    }
}

function formatDateValue(value) {
    if (!value) return "";

    const str = String(value).trim();

    // Matches YYYY-MM-DD or YYYY/MM/DD (with optional time part)
    const isoMatch = str.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (isoMatch) {
        const [, year, month, day] = isoMatch;
        return `${day.padStart(2, "0")}/${month.padStart(2, "0")}/${year}`;
    }

    // Fallback: try native Date parsing for other formats
    const parsed = new Date(str);
    if (!isNaN(parsed.getTime()) && /\d{4}/.test(str)) {
        const day = String(parsed.getDate()).padStart(2, "0");
        const month = String(parsed.getMonth() + 1).padStart(2, "0");
        const year = parsed.getFullYear();
        return `${day}/${month}/${year}`;
    }

    return str;
}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function isHolidayName(v) {
    return /holiday/i.test(String(v || ""));
}

// Returns { label, date, day } if this row is a holiday, else null
function getHolidayInfo(row, keys) {
    const subKey = keys.find(k => k.toLowerCase().includes("subject"));
    if (!subKey || !isHolidayName(row[subKey])) return null;
    const dateKey = keys.find(k => k.toLowerCase().includes("date"));
    const dayKey = keys.find(k => k.toLowerCase().includes("day"));
    return {
        label: String(row[subKey]).trim().toUpperCase(),
        date: dateKey ? formatDateValue(row[dateKey]) : "",
        day: dayKey ? String(row[dayKey] || "").toUpperCase() : ""
    };
}

function holidayText(h) {
    const when = [h.date, h.day ? "(" + h.day + ")" : ""].filter(Boolean).join(" ");
    return when ? when + "  -  " + h.label : h.label;
}

function generateAdmitCardPreviewHTML(rows) {
    if (!rows || !rows.length) {
        return '<div class="error"><i class="fas fa-file"></i> No admit card data available.</div>';
    }

    function getStudentKey(row) {
        const keys = Object.keys(row);
        const find = (name) =>
            keys.find(k => k.toLowerCase().replace(/\s+/g, "") === name.toLowerCase());

        const idKey = find("studentId") || find("rollNumber") || find("admissionNumber");
        if (idKey && row[idKey]) return row[idKey];

        const nameKey = find("studentName");
        return nameKey ? row[nameKey] : JSON.stringify(row);
    }

    const infoFieldMap = [
        ["studentName", "Student Name"],
        ["studentId", "Student ID"],
        ["rollNumber", "Roll Number"],
        ["admissionNumber", "Admission Number"],
        ["fatherName", "Father Name"],
        ["motherName", "Mother Name"],
        ["phone", "Phone"],
        ["className", "Class"],
        ["section", "Section"],
        ["dob", "Date of Birth"]
    ];

    const infoKeysLower = infoFieldMap.map(([k]) => k.toLowerCase());
    const groups = new Map();

    rows.forEach(row => {
        const key = getStudentKey(row);
        if (!groups.has(key)) {
            groups.set(key, []);
        }
        groups.get(key).push(row);
    });

    const studentGroups = Array.from(groups.values());
    
    let html = '';
    
    studentGroups.forEach((studentRows, index) => {
        if (index > 0) {
            html += '<div class="page-break"></div>';
        }
        
        const firstRow = studentRows[0];
        const usedKeysLower = new Set();
        
        html += `<div class="admit-card-preview">`;
        
        html += `
            <div class="header-band">
                <h3>ADMIT CARD</h3>
                <p>${exam} | Class: ${className}</p>
            </div>
        `;
        
        html += `<div class="info-grid">`;
        infoFieldMap.forEach(([key, label]) => {
            const matchedKey = Object.keys(firstRow).find(
                k => k.toLowerCase().replace(/\s+/g, "") === key.toLowerCase()
            );
            if (matchedKey && firstRow[matchedKey]) {
                usedKeysLower.add(matchedKey.toLowerCase());
                html += `
                    <div class="info-item">
                        <strong>${label}:</strong> ${escapeHtml(String(firstRow[matchedKey]))}
                    </div>
                `;
            }
        });
        html += `</div>`;
        
        const subjectKeys = Object.keys(firstRow).filter(k => 
            k.toLowerCase().includes('subject') || 
            k.toLowerCase().includes('date') || 
            k.toLowerCase().includes('day')
        );
        
        if (subjectKeys.length) {
            html += `<div style="overflow-x:auto;">`;
            html += `<table>
                <thead>
                    <tr>
                        ${subjectKeys.map(k => `<th>${escapeHtml(k)}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${studentRows.map(row => {
                        const h = getHolidayInfo(row, subjectKeys);
                        if (h) {
                            const when = [h.date, h.day ? "(" + h.day + ")" : ""].filter(Boolean).join(" ");
                            return `
                        <tr class="holiday-row">
                            <td colspan="${subjectKeys.length}" class="holiday-cell">
                                ${when ? `<span class="holiday-date">${escapeHtml(when)}</span><span class="holiday-sep">-</span>` : ""}
                                <span class="holiday-tag">${escapeHtml(h.label)}</span>
                            </td>
                        </tr>`;
                        }
                        return `
                        <tr>
                            ${subjectKeys.map(k => {
                                const rawValue = row[k] || '';
                                const displayValue = k.toLowerCase().includes('date')
                                    ? formatDateValue(rawValue)
                                    : String(rawValue);
                                return `<td>${escapeHtml(displayValue)}</td>`;
                            }).join('')}
                        </tr>
                    `;
                    }).join('')}
                </tbody>
            </table>`;
            html += `</div>`;
        }
        
        html += `
            <div class="footer-text">
                This is a system generated admit card.
            </div>
        `;
        
        html += `</div>`;
    });
    
    return html;
}

// Loads an image but never throws — resolves false on failure so a missing
// signature/stamp image doesn't stop the whole PDF from generating.
function loadImageSafe(img) {
    return new Promise((resolve) => {
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
    });
}

                }
            });
            return d.lastAutoTable.finalY;
        };

        if (sampleKeys.length) {
            // Scratch PDF me measure karke sabse bada size chuno jo signature se overlap na kare
            let chosen = tableSizes[tableSizes.length - 1];
            for (const size of tableSizes) {
                const scratch = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
                scratch.setFont("helvetica", "normal");
                const endY = buildTable(scratch, size[0], size[1], size[2]);
                if (scratch.internal.getNumberOfPages() === 1 && endY <= tableMaxEndY) {
                    chosen = size;
                    break;
                }
            }
            buildTable(doc, chosen[0], chosen[1], chosen[2]);
        } else {
            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text(
                "No subject schedule data available.",
                margin + 2,
                y + 10
            );
        }

        // ---------------------------------------------------------------
        // bottom signature block — two images (left + right), each
        // sitting above its own line, with a text label below the line.
        // Positioned above the footer disclaimer text at the very bottom.
        // ---------------------------------------------------------------
        // (signature positions upar define kiye gaye hain)

        doc.setDrawColor(40, 40, 40);
        doc.setLineWidth(0.5);

        // Left signature box
        const leftBoxX = margin + 2;
        if (leftSignLoaded) {
            doc.addImage(
                leftSignImg,
                "PNG",
                leftBoxX + (sigBoxWidth - sigImgWidth) / 2,
                sigImgY,
                sigImgWidth,
                sigImgHeight
            );
        }
        doc.line(leftBoxX, sigLineY, leftBoxX + sigBoxWidth, sigLineY);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.setTextColor(40, 40, 40);
        doc.text(
            "Stamp",
            leftBoxX + sigBoxWidth / 2,
            sigTextY,
            { align: "center" }
        );

        // Right stamp box
        const rightBoxX = pageWidth - margin - 2 - sigBoxWidth;

        // Examiner Signature label above the right stamp
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9);
        doc.setTextColor(40, 40, 40);
        doc.text(
            "Examiner Signature",
            rightBoxX + sigBoxWidth / 2,
            sigImgY - 3,
            { align: "center" }
        );

        if (rightSignLoaded) {
            doc.addImage(
                rightSignImg,
                "PNG",
                rightBoxX + (sigBoxWidth - sigImgWidth) / 2,
                sigImgY,
                sigImgWidth,
                sigImgHeight
            );
        }
        doc.line(rightBoxX, sigLineY, rightBoxX + sigBoxWidth, sigLineY);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(
            "Stamp",
            rightBoxX + sigBoxWidth / 2,
            sigTextY,
            { align: "center" }
        );
    });

    doc.save(
        `Admit_Cards_${exam}_${className}.pdf`
            .replace(/\s+/g, "_")
    );
}

// ==========================================
// START
// ==========================================

if (!exam || !className) {
    document.getElementById("studentsContainer").innerHTML = `
        <div class="error">
            <i class="fas fa-exclamation-triangle"></i>
            Invalid exam or class.
        </div>
    `;
} else {
    loadStudents();
}

</script>

</body>
