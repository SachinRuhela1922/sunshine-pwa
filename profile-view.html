<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine · Student Profile</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f7f3ed;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* header */
        .page-header {
            background: white;
            border-radius: 32px;
            padding: 1.2rem 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-header h1 i {
            color: #f58a2e;
            background: #fcf3e8;
            padding: 0.3rem 0.6rem;
            border-radius: 16px;
            font-size: 1.2rem;
        }

        .page-header .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-danger {
    background: #fce4e0;
    color: #b53b2e;
}

.btn-danger:hover {
    background: #f8cfc8;
}

        .btn-primary {
            background: linear-gradient(135deg, #f58a2e, #f9b042);
            color: white;
            box-shadow: 0 4px 12px rgba(245, 138, 46, 0.2);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(245, 138, 46, 0.3);
        }

        .btn-secondary {
            background: #f0e2d2;
            color: #4d3e2b;
        }

        .btn-secondary:hover {
            background: #e6d5c0;
        }

        /* main content */
        .main-content {
            background: white;
            border-radius: 28px;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
        }

        /* student header card */
        .student-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #fcf3e8;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .student-header .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fcf3e8, #f9dbb8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #f58a2e;
            flex-shrink: 0;
        }

        .student-header .info {
            flex: 1;
        }

        .student-header .info .name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d1f0c;
        }

        .student-header .info .id {
            font-size: 0.85rem;
            color: #b09a7e;
        }

        .student-header .info .tags {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 0.4rem;
        }

        .student-header .info .tags .tag {
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #fcf3e8;
            color: #f58a2e;
        }

        .student-header .info .tags .tag.active {
            background: #e8f5e9;
            color: #2b7a3a;
        }

        .student-header .info .tags .tag.inactive {
            background: #fce4e0;
            color: #b53b2e;
        }

        /* section */
        .section {
            margin-bottom: 2rem;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d1f0c;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid #fcf3e8;
        }

        .section-title i {
            color: #f58a2e;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.4rem 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            padding: 0.3rem 0;
            border-bottom: 1px solid #faf5ef;
            font-size: 0.9rem;
        }

        .info-item .label {
            color: #b09a7e;
            font-weight: 500;
            min-width: 110px;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .info-item .value {
            color: #2d1f0c;
            font-weight: 500;
            word-break: break-word;
        }

        .info-item.full {
            grid-column: 1 / -1;
        }

        /* status badge */
        .status-badge {
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.active {
            background: #e8f5e9;
            color: #2b7a3a;
        }

        .status-badge.inactive {
            background: #fce4e0;
            color: #b53b2e;
        }

        .status-badge.passed {
            background: #e8f5e9;
            color: #2b7a3a;
        }

        .status-badge.transferred {
            background: #fff3e0;
            color: #e67e22;
        }

        .status-badge.left {
            background: #fce4e0;
            color: #b53b2e;
        }

        /* loading */
        .loading-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .loading-state .spinner {
            font-size: 2.5rem;
            color: #f58a2e;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state p {
            color: #7f6a4b;
            margin-top: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #b09a7e;
        }

        .empty-state i {
            font-size: 2.5rem;
            color: #f0e2d2;
            margin-bottom: 0.5rem;
        }

        /* footer */
        .footer-note {
            margin-top: 2rem;
            border-top: 1px solid #f0e2d2;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            color: #b09a7e;
            font-size: 0.75rem;
        }

        .footer-note i {
            color: #f58a2e;
        }

        /* responsive */
        @media (max-width: 820px) {
            .info-grid {
                grid-template-columns: 1fr 1fr;
            }
            .main-content {
                padding: 1.2rem 1.2rem;
            }
            .page-header h1 {
                font-size: 1.3rem;
            }
            .student-header .avatar {
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
            }
            .student-header .info .name {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 500px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .student-header {
                flex-direction: column;
                text-align: center;
            }
            .student-header .info .tags {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-id-card"></i> Student Profile</h1>
        <div class="actions">
    <button class="btn-action btn-primary" onclick="editStudent()">
        <i class="fas fa-pen-to-square"></i> Edit
    </button>
    <button class="btn-action btn-danger" onclick="deleteStudent()">
        <i class="fas fa-trash"></i> Delete
    </button>
    <button class="btn-action btn-secondary" onclick="history.back()">
        <i class="fas fa-arrow-left"></i> Back
    </button>
</div>/api
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
        <div id="profile">
            <div class="loading-state">
                <div class="spinner"><i class="fas fa-circle-notch"></i></div>
                <p>Loading student information...</p>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-note">
        <span><i class="fas fa-school"></i> Sunshine School · est. 2006</span>
        <span><i class="fas fa-lock"></i> secure · student profile</span>
    </div>

</div>

<script>
    // ==========================================
    // GET STUDENT ID FROM URL
    // ==========================================

    const params = new URLSearchParams(window.location.search);
    const studentId = params.get("id");
    const profile = document.getElementById("profile");

    if (!studentId) {
        profile.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-triangle-exclamation"></i>
                <p>Student ID not found.</p>
            </div>
        `;
    } else {
        loadStudent();
    }

    // ==========================================
    // FETCH STUDENT
    // ==========================================

    async function loadStudent() {
        try {
            const response = await fetch(`https://sunshine-swp6.onrender.com/api/students/${studentId}`);
            const result = await response.json();

            if (!response.ok) {
                profile.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-triangle-exclamation"></i>
                        <p>${result.message}</p>
                    </div>
                `;
                return;
            }

            const student = result.student;
            displayStudent(student);

        } catch (error) {
            console.error(error);
            profile.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-wifi"></i>
                    <p>Unable to connect with server.</p>
                </div>
            `;
        }
    }

    // ==========================================
    // DISPLAY COMPLETE STUDENT
    // ==========================================

    function displayStudent(student) {
        // Get status class
        const status = student.status || 'inactive';
        const statusClass = status.toLowerCase();

        // Get class display name
        const className = student.academic?.class || '-';
        const displayClass = ["Nursery", "LKG", "UKG"].includes(className) ? className : `Class ${className}`;

        // Build full profile HTML
        let html = '';

        // ========== HEADER ==========
        const initials = (student.studentName || 'S').charAt(0).toUpperCase();
        html += `
            <div class="student-header">
                <div class="avatar">${initials}</div>
                <div class="info">
                    <div class="name">${student.studentName || '-'}</div>
                    <div class="id"><i class="fas fa-id-badge"></i> ${student.studentId || 'ID: N/A'}</div>
                    <div class="tags">
                        <span class="tag">${displayClass}</span>
                        <span class="tag">${student.academic?.section || 'No Section'}</span>
                        <span class="tag ${statusClass}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>
                    </div>
                </div>
            </div>
        `;

        // ========== BASIC INFORMATION ==========
        html += `
            <div class="section">
                <div class="section-title"><i class="fas fa-id-card"></i> Basic Information</div>
                <div class="info-grid">
                    <div class="info-item"><span class="label">Student ID</span><span class="value">${student.studentId || '-'}</span></div>
                    <div class="info-item"><span class="label">Name</span><span class="value">${student.studentName || '-'}</span></div>
                    <div class="info-item"><span class="label">Admission Number</span><span class="value">${student.admissionNumber || '-'}</span></div>
                    <div class="info-item"><span class="label">Roll Number</span><span class="value">${student.rollNumber || '-'}</span></div>
                    <div class="info-item"><span class="label">Date of Birth</span><span class="value">${student.dob ? new Date(student.dob).toLocaleDateString() : '-'}</span></div>
                    <div class="info-item"><span class="label">Gender</span><span class="value">${student.gender || '-'}</span></div>
                    <div class="info-item"><span class="label">Blood Group</span><span class="value">${student.bloodGroup || '-'}</span></div>
                    <div class="info-item"><span class="label">Nationality</span><span class="value">${student.nationality || '-'}</span></div>
                    <div class="info-item"><span class="label">Religion</span><span class="value">${student.religion || '-'}</span></div>
                    <div class="info-item"><span class="label">Category</span><span class="value">${student.category || '-'}</span></div>
                </div>
            </div>
        `;

        // ========== ACADEMIC INFORMATION ==========
        const a = student.academic || {};
        html += `
            <div class="section">
                <div class="section-title"><i class="fas fa-graduation-cap"></i> Academic Information</div>
                <div class="info-grid">
                    <div class="info-item"><span class="label">Session</span><span class="value">${a.session || '-'}</span></div>
                    <div class="info-item"><span class="label">Class</span><span class="value">${a.class || '-'}</span></div>
                    <div class="info-item"><span class="label">Section</span><span class="value">${a.section || '-'}</span></div>
                    <div class="info-item"><span class="label">S.R Number</span><span class="value">${a.previousClass || '-'}</span></div>
                    <div class="info-item full"><span class="label">Previous School</span><span class="value">${a.previousSchool || '-'}</span></div>
                    <div class="info-item"><span class="label">Admission Date</span><span class="value">${a.admissionDate ? new Date(a.admissionDate).toLocaleDateString() : '-'}</span></div>
                </div>
            </div>
        `;

        // ========== PARENTS & GUARDIAN ==========
        const f = student.father || {};
        const m = student.mother || {};
        const g = student.guardian || {};

        html += `
            <div class="section">
                <div class="section-title"><i class="fas fa-people-arrows"></i> Parents & Guardian</div>
                <h4 style="font-size:0.9rem;color:#3d2e1b;margin:0.3rem 0 0.2rem 0;"><i class="fas fa-user-tie"></i> Father</h4>
                <div class="info-grid">
                    <div class="info-item"><span class="label">Name</span><span class="value">${f.name || '-'}</span></div>
                    <div class="info-item"><span class="label">Phone</span><span class="value">${f.phone || '-'}</span></div>
                    <div class="info-item"><span class="label">Occupation</span><span class="value">${f.occupation || '-'}</span></div>
                </div>
                <h4 style="font-size:0.9rem;color:#3d2e1b;margin:0.8rem 0 0.2rem 0;"><i class="fas fa-user"></i> Mother</h4>
                <div class="info-grid">
                    <div class="info-item"><span class="label">Name</span><span class="value">${m.name || '-'}</span></div>
                    <div class="info-item"><span class="label">Phone</span><span class="value">${m.phone || '-'}</span></div>
                </div>
                <h4 style="font-size:0.9rem;color:#3d2e1b;margin:0.8rem 0 0.2rem 0;"><i class="fas fa-user-shield"></i> Guardian</h4>
                <div class="info-grid">
                    <div class="info-item"><span class="label">Name</span><span class="value">${g.name || '-'}</span></div>
                    <div class="info-item"><span class="label">Relation</span><span class="value">${g.relation || '-'}</span></div>
                    <div class="info-item"><span class="label">Phone</span><span class="value">${g.phone || '-'}</span></div>
                </div>
            </div>
        `;

        // ========== CONTACT INFORMATION ==========
        const c = student.contact || {};
        html += `
            <div class="section">
                <div class="section-title"><i class="fas fa-address-card"></i> Contact Information</div>
                <div class="info-grid">
                    <div class="info-item"><span class="label">Student Email</span><span class="value">${c.email || '-'}</span></div>
                    <div class="info-item full"><span class="label">Address</span><span class="value">${c.address || '-'}</span></div>
                    <div class="info-item"><span class="label">City</span><span class="value">${c.city || '-'}</span></div>
                    <div class="info-item"><span class="label">State</span><span class="value">${c.state || '-'}</span></div>
                    <div class="info-item"><span class="label">PIN Code</span><span class="value">${c.pinCode || '-'}</span></div>
                </div>
            </div>
        `;

        // ========== FEE INFORMATION ==========
        const fee = student.fees || {};
        html += `
            <div class="section">
                <div class="section-title"><i class="fas fa-coins"></i> Fee Information</div>
                <div class="info-grid">
                    <div class="info-item"><span class="label">Monthly Fee</span><span class="value">₹${fee.monthlyFee || 0}</span></div>
                    <div class="info-item"><span class="label">PEN Number</span><span class="value">${fee.transactionId || '-'}</span></div>
                </div>
            </div>
        `;

        // ========== DOCUMENTS ==========
        const docs = student.documents || {};
        html += `
            <div class="section">
                <div class="section-title"><i class="fas fa-file-alt"></i> Documents</div>
                <div class="info-grid">
                    <div class="info-item"><span class="label">Aadhaar Number</span><span class="value">${docs.aadhaarNumber || '-'}</span></div>
                </div>
            </div>
        `;

        // ========== STATUS ==========
        html += `
            <div class="section">
                <div class="section-title"><i class="fas fa-circle-check"></i> Student Status</div>
                <div class="info-grid">
                    <div class="info-item"><span class="label">Status</span><span class="value"><span class="status-badge ${statusClass}">${status.charAt(0).toUpperCase() + status.slice(1)}</span></span></div>
                    <div class="info-item"><span class="label">Student ID</span><span class="value">${student.studentId || '-'}</span></div>
                    <div class="info-item"><span class="label">Admission Number</span><span class="value">${student.admissionNumber || '-'}</span></div>
                </div>
            </div>
        `;

        profile.innerHTML = html;
    }

    function escapeHtml(value) {
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // ==========================================
    // EDIT FUNCTION
    // ==========================================

    function editStudent() {
        window.location.href = `edit-student.html?id=${studentId}`;
    }


    async function deleteStudent() {
    if (!studentId) return;

    const confirmDelete = confirm(
        "Are you sure you want to permanently delete this student's complete profile? This action cannot be undone."
    );

    if (!confirmDelete) return;

    try {
        const response = await fetch(`https://sunshine-swp6.onrender.com/api/students/${studentId}`, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.message || "Failed to delete student.");
            return;
        }

        alert("Student profile deleted successfully.");
        window.location.href = "students.html"; // apni students list wali page ka naam yaha daal do
    } catch (error) {
        console.error(error);
        alert("Unable to connect with server. Please try again.");
    }
}
</script>

</body>

</html>
