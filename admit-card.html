<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine · Admit Card</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f7f3ed;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            background: white;
            border-radius: 32px;
            padding: 1.2rem 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-header h1 i {
            color: #f58a2e;
            background: #fcf3e8;
            padding: 0.3rem 0.6rem;
            border-radius: 16px;
            font-size: 1.2rem;
        }

        .page-header .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-secondary {
            background: #f0e2d2;
            color: #4d3e2b;
        }

        .btn-secondary:hover {
            background: #e6d5c0;
        }

        /* Main Box */
        .main-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
        }

        .main-box h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d1f0c;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .main-box h2 i {
            color: #f58a2e;
        }

        /* Info Card */
        .info-card {
            background: #fcf9f4;
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #f0e2d2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem 2rem;
        }

        .info-card .info-item {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            padding: 0.2rem 0;
        }

        .info-card .info-item .label {
            color: #b09a7e;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            min-width: 70px;
        }

        .info-card .info-item .value {
            color: #2d1f0c;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .info-card .info-item .value i {
            color: #f58a2e;
            margin-right: 0.3rem;
        }

        /* Section Title */
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #2d1f0c;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .section-title i {
            color: #f58a2e;
        }

        .section-title .badge {
            background: #f58a2e;
            color: white;
            font-size: 0.7rem;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-weight: 600;
        }

        /* Subject Rows */
        .subjects-container {
            margin-bottom: 1.2rem;
        }

        .subject-row {
            display: grid;
            grid-template-columns: 1.3fr 1fr 110px 125px 125px 50px;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            align-items: center;
            background: #fcfaf7;
            padding: 0.6rem 0.8rem;
            border-radius: 14px;
            border: 1px solid #f0e2d2;
            transition: all 0.2s;
        }

        .subject-row:hover {
            border-color: #f9b042;
            background: #fcf9f4;
        }

        .subject-row input {
            padding: 0.6rem 0.9rem;
            border: 1.5px solid #f0e2d2;
            border-radius: 10px;
            font-size: 0.88rem;
            background: white;
            transition: all 0.2s;
            outline: none;
            color: #1f160c;
            font-weight: 500;
            width: 100%;
        }

        .subject-row input:focus {
            border-color: #f58a2e;
            box-shadow: 0 0 0 4px rgba(245, 138, 46, 0.06);
        }

        .subject-row input::placeholder {
            color: #b8a58b;
            font-weight: 400;
        }

        .subject-row .subject-input {
            font-weight: 600;
        }

        .subject-row .date-input {
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        .subject-row .date-input.invalid {
            border-color: #b53b2e;
            box-shadow: 0 0 0 4px rgba(181, 59, 46, 0.06);
        }

        .subject-row .day-input {
            background: #fcfaf7;
            cursor: default;
            font-weight: 600;
            color: #2d1f0c;
        }

        .subject-row .day-input:focus {
            border-color: #f0e2d2;
            box-shadow: none;
        }

        .subject-row .time-input {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .subject-row .time-field {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .subject-row .time-field label {
            font-size: 0.68rem;
            font-weight: 700;
            color: #8a7558;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding-left: 4px;
        }

        .subject-row .time-field label small {
            font-weight: 500;
            text-transform: none;
            color: #b8a58b;
        }

        .subject-row .time-input.invalid {
            border-color: #b53b2e;
            box-shadow: 0 0 0 4px rgba(181, 59, 46, 0.06);
        }

        .btn-remove {
            background: #fce4e0;
            border: none;
            color: #b53b2e;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .btn-remove:hover {
            background: #f5b7b1;
            transform: scale(1.05);
        }

        /* Buttons */
        .btn-add {
            background: #f0e2d2;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: #4d3e2b;
            margin-bottom: 1.5rem;
        }

        .btn-add:hover {
            background: #e6d5c0;
            transform: scale(1.02);
        }

        .btn-add i {
            color: #f58a2e;
        }

        .btn-save {
            background: linear-gradient(135deg, #f58a2e, #f9b042);
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: white;
            box-shadow: 0 4px 12px rgba(245, 138, 46, 0.2);
            width: 100%;
            justify-content: center;
        }

        .btn-save:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(245, 138, 46, 0.3);
        }

        .btn-save i {
            font-size: 1.1rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #b09a7e;
        }

        .empty-state i {
            font-size: 2.5rem;
            color: #f0e2d2;
            margin-bottom: 0.5rem;
        }

        /* ===== LIVE PREVIEW ===== */
        .preview-box {
            margin-top: 1.8rem;
        }

        .preview-hint {
            font-size: 0.8rem;
            color: #b09a7e;
            margin: -0.8rem 0 1rem;
        }

        .admit-preview {
            border: 2px solid #1a2a3a;
            border-radius: 14px;
            padding: 1.5rem;
            background: white;
            cursor: pointer;
            position: relative;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .admit-preview:hover {
            box-shadow: 0 6px 22px rgba(245, 138, 46, 0.35);
            transform: translateY(-1px);
        }

        .admit-preview .edit-hint {
            position: absolute;
            top: 8px;
            right: 10px;
            background: rgba(255,255,255,0.95);
            color: #b5651d;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .admit-preview .header-band {
            background: linear-gradient(135deg, #1a2a3a, #2d4a6a);
            color: white;
            padding: 0.8rem;
            text-align: center;
            border-radius: 8px;
            margin: -1.5rem -1.5rem 1rem -1.5rem;
            border-radius: 12px 12px 0 0;
        }

        .admit-preview .header-band h3 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .admit-preview .header-band p {
            margin: 4px 0 0;
            font-size: 0.8rem;
            opacity: 0.85;
        }

        .admit-preview .student-note {
            background: #fcfaf7;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            font-size: 0.8rem;
            color: #7f6a4b;
            margin-bottom: 0.8rem;
        }

        .admit-preview .student-note strong {
            color: #7f6a4b;
        }

        .admit-preview table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .admit-preview table th {
            background: #f58a2e;
            color: white;
            padding: 0.55rem 0.7rem;
            text-align: left;
            border: 1px solid #f0e2d2;
        }

        .admit-preview table td {
            padding: 0.55rem 0.7rem;
            border: 1px solid #e8d9c5;
            font-weight: 700;
            color: #000;
        }

        /* Holiday row: one full-width themed line */
        .admit-preview table td.holiday-cell {
            background: #fff4e6;
            border: 1px solid #f9b042;
            text-align: center;
            padding: 0.7rem 0.9rem;
            color: #b5651d;
            letter-spacing: 0.4px;
        }

        .admit-preview .holiday-date {
            color: #2d1f0c;
            font-weight: 700;
        }

        .admit-preview .holiday-sep {
            margin: 0 0.7rem;
            color: #f9b042;
            font-weight: 700;
        }

        .admit-preview .holiday-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: linear-gradient(135deg, #f58a2e, #f9b042);
            color: white;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 0.82em;
        }

        .subject-row.is-holiday {
            background: #fff4e6;
            border-color: #f9b042;
        }

        .subject-row.is-holiday .time-input {
            background: #f7efe3;
            cursor: not-allowed;
        }

        .admit-preview .footer-text {
            text-align: center;
            color: #b09a7e;
            font-size: 0.7rem;
            margin-top: 0.8rem;
            padding-top: 0.5rem;
            border-top: 1px solid #f0e2d2;
        }

        /* Footer */
        .footer-note {
            margin-top: 2rem;
            border-top: 1px solid #f0e2d2;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            color: #b09a7e;
            font-size: 0.75rem;
        }

        .footer-note i {
            color: #f58a2e;
        }

        /* Responsive */
        @media (max-width: 820px) {
            .main-box {
                padding: 1.2rem 1.2rem;
            }
            .page-header h1 {
                font-size: 1.3rem;
            }
            .info-card {
                grid-template-columns: 1fr;
                gap: 0.2rem;
            }
            .subject-row {
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
                padding: 0.8rem;
            }
            .subject-row .subject-input {
                grid-column: 1 / -1;
            }
            .btn-remove {
                width: 100%;
                height: 44px;
            }
            .admit-preview table {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .page-header .actions .btn-action {
                font-size: 0.75rem;
                padding: 0.3rem 0.8rem;
            }
            .info-card .info-item {
                flex-wrap: wrap;
            }
            .info-card .info-item .label {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-ticket"></i> Admit Card</h1>
        <div class="actions">
            <button class="btn-action btn-secondary" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-box" id="editBox">

        <h2><i class="fas fa-pen-to-square"></i> <span id="formTitle">Create Admit Card</span></h2>

        <!-- Info Card -->
        <div class="info-card">
            <div class="info-item">
                <span class="label"><i class="fas fa-file"></i> Exam</span>
                <span class="value" id="examName"><i class="fas fa-tag"></i> -</span>
            </div>
            <div class="info-item">
                <span class="label"><i class="fas fa-graduation-cap"></i> Class</span>
                <span class="value" id="className"><i class="fas fa-chalkboard"></i> -</span>
            </div>
        </div>

        <!-- Subjects -->
        <div class="section-title">
            <i class="fas fa-book"></i> Subjects
            <span class="badge" id="subjectCount">0</span>
        </div>

        <div class="subjects-container" id="subjectsContainer"></div>

        <button class="btn-add" onclick="addSubject()">
            <i class="fas fa-plus-circle"></i> Add Subject
        </button>

        <button class="btn-save" onclick="saveAdmitCard()">
            <i class="fas fa-save"></i> Save Admit Card
        </button>

    </div>

    <!-- LIVE PREVIEW -->
    <div class="main-box preview-box">
        <h2><i class="fas fa-eye"></i> Admit Card Preview</h2>
        <p class="preview-hint">Preview updates as you type. Click the card to edit.</p>
        <div id="admitPreview"></div>
    </div>

    <!-- FOOTER -->
    <div class="footer-note">
        <span><i class="fas fa-school"></i> Sunshine School · est. 2006</span>
        <span><i class="fas fa-lock"></i> secure · admit card</span>
    </div>

</div>


<script>
    const API_URL = "https://sunshine-vtal.onrender.com"; // Replace with your actual API base URL

    const params = new URLSearchParams(window.location.search);

    const exam = params.get("exam") || "";
    const className = params.get("class") || "";

    document.getElementById("examName").innerHTML = `<i class="fas fa-tag"></i> ${exam || 'Not specified'}`;
    document.getElementById("className").innerHTML = `<i class="fas fa-chalkboard"></i> ${className || 'Not specified'}`;

    let subjectCounter = 0;

    /* =========================
       DATE HELPERS
       User types digits only (e.g. 25082026) and it auto-formats
       into DD/MM/YYYY as they type, no calendar popup.
    ========================= */

    // Formats raw digits into DD/MM/YYYY as the user types
    function formatDateInput(raw) {
        const digits = raw.replace(/\D/g, "").slice(0, 8); // max 8 digits: DDMMYYYY
        let out = digits;

        if (digits.length > 4) {
            out = digits.slice(0, 2) + "/" + digits.slice(2, 4) + "/" + digits.slice(4);
        } else if (digits.length > 2) {
            out = digits.slice(0, 2) + "/" + digits.slice(2);
        }

        return out;
    }

    // Parses DD/MM/YYYY into a real Date object, or null if invalid/incomplete
    function parseDDMMYYYY(value) {
        const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(value);
        if (!match) return null;

        const day = parseInt(match[1], 10);
        const month = parseInt(match[2], 10);
        const year = parseInt(match[3], 10);

        if (month < 1 || month > 12) return null;

        const date = new Date(year, month - 1, day);

        // Reject dates like 31/02/2026 that JS silently rolls over
        if (
            date.getFullYear() !== year ||
            date.getMonth() !== month - 1 ||
            date.getDate() !== day
        ) {
            return null;
        }

        return date;
    }

    // Date -> "YYYY-MM-DD" using LOCAL time.
    // (toISOString() converts to UTC and shifts the date back by one day
    //  in timezones ahead of UTC such as India.)
    function toLocalISODate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
    }

    // "YYYY-MM-DD" (saved format) -> "DD/MM/YYYY" (input format)
    function isoToDDMMYYYY(iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
        return m ? `${m[3]}/${m[2]}/${m[1]}` : "";
    }

    /* =========================
       HOLIDAY HELPERS
       If the subject name contains "holiday", the row is treated as a
       holiday: time is not needed and the admit card shows one
       full-width "HOLIDAY" line instead of a normal subject row.
    ========================= */

    function isHolidaySubject(name) {
        return /holiday/i.test(String(name || ""));
    }

    function applyHolidayState(row) {
        const holiday = isHolidaySubject(row.querySelector(".subject-input").value);
        const startInput = row.querySelector(".start-time-input");
        const endInput = row.querySelector(".end-time-input");

        row.classList.toggle("is-holiday", holiday);
        startInput.disabled = holiday;
        endInput.disabled = holiday;

        if (holiday) {
            startInput.value = "";
            endInput.value = "";
            startInput.classList.remove("invalid");
            endInput.classList.remove("invalid");
        }
    }

    /* =========================
       ADD SUBJECT
       (optional `data` is used to pre-fill a saved subject)
    ========================= */

    function addSubject(data) {
        const container = document.getElementById("subjectsContainer");

        const row = document.createElement("div");
        row.className = "subject-row";

        row.innerHTML = `
            <input
                type="text"
                class="subject-input"
                placeholder="Subject name"
                autocomplete="off"
            >

            <input
                type="text"
                class="date-input"
                placeholder="DD/MM/YYYY"
                inputmode="numeric"
                autocomplete="off"
                maxlength="10"
            >

            <input
                type="text"
                class="day-input"
                placeholder="Day"
                readonly
            >

            <div class="time-field">
                <label>Start Time <small>(optional)</small></label>
                <input
                    type="time"
                    class="time-input start-time-input"
                    title="Exam start time (optional)"
                    autocomplete="off"
                >
            </div>

            <div class="time-field">
                <label>End Time <small>(optional)</small></label>
                <input
                    type="time"
                    class="time-input end-time-input"
                    title="Exam end time (optional)"
                    autocomplete="off"
                >
            </div>

            <button
                class="btn-remove"
                onclick="this.parentElement.remove(); updateCount();"
            >
                ×
            </button>
        `;

        const dateInput = row.querySelector(".date-input");
        const dayInput = row.querySelector(".day-input");

        // Holiday: disable/clear time fields automatically
        row.querySelector(".subject-input").addEventListener("input", function () {
            applyHolidayState(row);
        });

        // Auto-format while typing (adds "/" automatically)
        dateInput.addEventListener("input", function (e) {
            const cursorAtEnd = this.selectionStart === this.value.length;
            this.value = formatDateInput(this.value);
            if (cursorAtEnd) {
                this.setSelectionRange(this.value.length, this.value.length);
            }

            const parsed = parseDDMMYYYY(this.value);
            if (this.value.length === 10) {
                if (parsed) {
                    dayInput.value = parsed.toLocaleDateString("en-US", { weekday: "long" });
                    this.classList.remove("invalid");
                } else {
                    dayInput.value = "";
                    this.classList.add("invalid");
                }
            } else {
                dayInput.value = "";
                this.classList.remove("invalid");
            }
        });

        // Allow backspace to remove the auto-inserted "/" cleanly
        dateInput.addEventListener("keydown", function (e) {
            if (e.key === "Backspace" && this.value.endsWith("/")) {
                e.preventDefault();
                this.value = this.value.slice(0, -1);
                const parsed = parseDDMMYYYY(this.value);
                dayInput.value = parsed ? parsed.toLocaleDateString("en-US", { weekday: "long" }) : "";
                this.classList.remove("invalid");
            }
        });

        // Pre-fill saved data (edit mode)
        if (data) {
            row.querySelector(".subject-input").value = data.subject || "";
            dateInput.value = isoToDDMMYYYY(data.date);
            dayInput.value = data.day || "";
            row.querySelector(".start-time-input").value = data.startTime || "";
            row.querySelector(".end-time-input").value = data.endTime || "";
            applyHolidayState(row);
        } else {
            // Auto-focus the subject input
            const subjectInput = row.querySelector(".subject-input");
            setTimeout(() => subjectInput.focus(), 100);
        }

        container.appendChild(row);
        updateCount();
    }

    /* =========================
       UPDATE COUNT
    ========================= */

    function updateCount() {
        const rows = document.querySelectorAll(".subject-row");
        document.getElementById("subjectCount").textContent = rows.length;
        renderPreview();
    }

    /* =========================
       LIVE PREVIEW
    ========================= */

    function previewEscape(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // "14:30" -> "02:30 PM"
    function previewTime12h(time) {
        if (!time || !/^\d{2}:\d{2}$/.test(time)) return "";
        let [h, m] = time.split(":").map(Number);
        const ampm = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")} ${ampm}`;
    }

    function renderPreview() {
        const target = document.getElementById("admitPreview");
        if (!target) return;

        const rows = Array.from(document.querySelectorAll(".subject-row"))
            .map(row => ({
                subject: row.querySelector(".subject-input").value.trim(),
                date: row.querySelector(".date-input").value.trim(),
                day: row.querySelector(".day-input").value,
                start: row.querySelector(".start-time-input").value,
                end: row.querySelector(".end-time-input").value
            }))
            .filter(r => r.subject || r.date || r.start || r.end);

        let body = "";

        if (!rows.length) {
            body = `<div class="empty-state"><i class="fas fa-file"></i><p>Add subjects to see the preview.</p></div>`;
        } else {
            body = `
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Exam Date</th>
                            <th>Exam Day</th>
                            <th>Exam Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows.map(r => {
                            // Holiday: one full-width themed line
                            if (isHolidaySubject(r.subject)) {
                                const dateText = [r.date, r.day ? `(${r.day})` : ""].filter(Boolean).join(" ");
                                return `
                                    <tr>
                                        <td colspan="4" class="holiday-cell">
                                            ${dateText ? `<span class="holiday-date">${previewEscape(dateText)}</span><span class="holiday-sep">—</span>` : ""}
                                            <span class="holiday-tag"><i class="fas fa-umbrella-beach"></i> ${previewEscape(r.subject.toUpperCase())}</span>
                                        </td>
                                    </tr>
                                `;
                            }

                            // Time is optional: show it only when both are filled
                            const time = (r.start && r.end)
                                ? `${previewTime12h(r.start)} - ${previewTime12h(r.end)}`
                                : "";
                            return `
                                <tr>
                                    <td>${previewEscape(r.subject)}</td>
                                    <td>${previewEscape(r.date)}</td>
                                    <td>${previewEscape(r.day)}</td>
                                    <td>${previewEscape(time)}</td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            `;
        }

        target.innerHTML = `
            <div class="admit-preview" onclick="goToEdit()" title="Click to edit">
                <span class="edit-hint"><i class="fas fa-pen"></i> Click to edit</span>
                <div class="header-band">
                    <h3>ADMIT CARD</h3>
                    <p>${previewEscape(exam)} | Class: ${previewEscape(className)}</p>
                </div>
                <div class="student-note">
                    <strong>Student details</strong> (name, roll number, parents, etc.) are filled in automatically for every student.
                </div>
                ${body}
                <div class="footer-text">This is a system generated admit card.</div>
            </div>
        `;
    }

    // Clicking the preview scrolls back to the form and focuses the first empty/first field
    function goToEdit() {
        const box = document.getElementById("editBox");
        box.scrollIntoView({ behavior: "smooth", block: "start" });
        const first = document.querySelector(".subject-row .subject-input");
        if (first) setTimeout(() => first.focus(), 350);
    }

    // Keep preview in sync with every keystroke / time change
    document.getElementById("subjectsContainer").addEventListener("input", renderPreview);
    document.getElementById("subjectsContainer").addEventListener("change", renderPreview);

    /* =========================
       FIRST SUBJECT
    ========================= */

    addSubject();

    /* =========================
       LOAD SAVED ADMIT CARD (edit mode)
       If an admit card was already saved for this exam + class,
       fill the form with it so it can be previewed and edited.
    ========================= */

    async function loadExistingAdmitCard() {
        if (!exam || !className) return;

        try {
            const response = await fetch(
                `${API_URL}/api/admitcard?exam=${encodeURIComponent(exam)}&className=${encodeURIComponent(className)}`
            );

            if (!response.ok) return; // not created yet -> stay in create mode

            const result = await response.json();
            const saved = result && result.data && result.data.subjects;

            if (!saved || !saved.length) return;

            document.getElementById("subjectsContainer").innerHTML = "";
            saved.forEach(s => addSubject(s));
            document.getElementById("formTitle").textContent = "Edit Admit Card";
        } catch (error) {
            console.warn("Could not load saved admit card:", error);
        }
    }

    loadExistingAdmitCard();

    /* =========================
       SAVE
    ========================= */

    async function saveAdmitCard() {
        const rows = document.querySelectorAll(".subject-row");

        const subjects = [];
        let hasInvalid = false;

        let errorMessage = "";

        rows.forEach(row => {
            const subject = row.querySelector(".subject-input").value.trim();
            const dateRaw = row.querySelector(".date-input").value.trim();
            const day = row.querySelector(".day-input").value;
            const startInput = row.querySelector(".start-time-input");
            const endInput = row.querySelector(".end-time-input");
            const startTime = startInput.value; // "HH:mm" (24-hour) or ""
            const endTime = endInput.value;     // "HH:mm" (24-hour) or ""

            startInput.classList.remove("invalid");
            endInput.classList.remove("invalid");

            if (!subject && !dateRaw && !startTime && !endTime) return; // empty row, skip

            const label = subject || "a subject";
            const parsed = parseDDMMYYYY(dateRaw);

            if (!subject || !dateRaw || !parsed) {
                hasInvalid = true;
                row.querySelector(".date-input").classList.add("invalid");
                if (!errorMessage) {
                    errorMessage = `⚠️ Subject name and a valid date (DD/MM/YYYY) are required for ${label}.`;
                }
                return;
            }

            // Holiday: no time needed, save with empty time
            if (isHolidaySubject(subject)) {
                subjects.push({
                    subject,
                    date: toLocalISODate(parsed),
                    day,
                    startTime: "",
                    endTime: ""
                });
                return;
            }

            // Time is OPTIONAL: both empty is fine, both filled is fine.
            // Only one of them filled is an error.
            if ((startTime && !endTime) || (!startTime && endTime)) {
                hasInvalid = true;
                if (!startTime) startInput.classList.add("invalid");
                if (!endTime) endInput.classList.add("invalid");
                if (!errorMessage) {
                    errorMessage = `⚠️ Fill both start and end time for ${label}, or leave both empty.`;
                }
                return;
            }

            if (startTime && endTime && endTime <= startTime) {
                hasInvalid = true;
                startInput.classList.add("invalid");
                endInput.classList.add("invalid");
                if (!errorMessage) {
                    errorMessage = `⚠️ End time must be after start time for ${label}.`;
                }
                return;
            }

            subjects.push({
                subject,
                date: toLocalISODate(parsed),
                day,
                startTime, // e.g. "10:00" or ""
                endTime    // e.g. "13:00" or ""
            });
        });

        if (hasInvalid) {
            alert(errorMessage || "⚠️ Please check the highlighted fields.");
            return;
        }

        if (subjects.length === 0) {
            alert("⚠️ Please add at least one subject with a date.");
            return;
        }

        const data = {
            exam,
            className,
            subjects
        };

        try {
            const response = await fetch(
                `${API_URL}/api/admitcard`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }
            );

            const result = await response.json();

            if (!response.ok) {
                alert(result.message || "Failed to save admit card");
                return;
            }

            alert("✅ Admit card saved successfully!");

            window.location.href =
                `exam-student.html?exam=${encodeURIComponent(exam)}&class=${encodeURIComponent(className)}`;

        } catch (error) {
            console.error(error);
            alert("❌ Server connection error. Please try again.");
        }
    }
</script>

</body>
