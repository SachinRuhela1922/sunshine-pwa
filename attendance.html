<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine · Daily Attendance</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f7f3ed;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 1360px;
            margin: 0 auto;
        }

        /* header */
        .page-header {
            background: white;
            border-radius: 32px;
            padding: 1.2rem 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-header h1 i {
            color: #f58a2e;
            background: #fcf3e8;
            padding: 0.3rem 0.6rem;
            border-radius: 16px;
            font-size: 1.2rem;
        }

        .page-header .header-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .page-header .badge {
            background: #fcf3e8;
            color: #7f6a4b;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            border: 1px solid rgba(245, 138, 46, 0.1);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .page-header .badge i {
            color: #f58a2e;
        }

        .date-picker {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #fcf9f4;
            padding: 0.3rem 1rem 0.3rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #f0e2d2;
        }

        .date-picker label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #3d2e1b;
        }

        .date-picker input {
            border: none;
            padding: 0.4rem 0.6rem;
            border-radius: 12px;
            background: white;
            font-size: 0.9rem;
            outline: none;
            border: 1px solid #f0e2d2;
            font-weight: 500;
            color: #2d1f0c;
        }

        .date-picker input:focus {
            border-color: #f58a2e;
        }

        /* layout */
        .attendance-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 1.8rem;
            align-items: start;
        }

        /* sidebar */
        .sidebar {
            background: white;
            border-radius: 28px;
            padding: 1.5rem 1rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            position: sticky;
            top: 1.5rem;
        }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #b8a58b;
            font-weight: 700;
            margin-bottom: 1.2rem;
            padding-left: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar-title i {
            color: #f58a2e;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.5rem 0.9rem;
            border-radius: 14px;
            color: #4d3e2b;
            font-weight: 500;
            font-size: 0.82rem;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .sidebar-nav a i {
            width: 1.3rem;
            color: #b8a58b;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .sidebar-nav a:hover {
            background: #fcf3e8;
            border-color: #f9dbb8;
            color: #f58a2e;
        }

        .sidebar-nav a:hover i {
            color: #f58a2e;
        }

        .sidebar-nav a.active {
            background: #fcf3e8;
            border-color: #f9b042;
            color: #d97d22;
            font-weight: 600;
        }

        .sidebar-nav a.active i {
            color: #f58a2e;
        }

        .sidebar-divider {
            height: 1px;
            background: linear-gradient(to right, #f0e2d2, transparent);
            margin: 0.8rem 0.5rem;
        }

        /* main content */
        .main-content {
            background: white;
            border-radius: 28px;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            min-height: 500px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d1f0c;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .section-title i {
            color: #f58a2e;
        }

        /* class buttons */
        .class-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .class-btn {
            padding: 0.5rem 1.2rem;
            border: 1.5px solid #f0e2d2;
            border-radius: 60px;
            background: white;
            font-weight: 600;
            font-size: 0.85rem;
            color: #4d3e2b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .class-btn:hover {
            border-color: #f58a2e;
            color: #f58a2e;
            background: #fcf3e8;
        }

        .class-btn.active {
            background: linear-gradient(135deg, #f58a2e, #f9b042);
            color: white;
            border-color: #f58a2e;
            box-shadow: 0 4px 12px rgba(245, 138, 46, 0.2);
        }

        /* selected class header */
        .selected-class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.8rem 1.2rem;
            background: #fcf9f4;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(245, 138, 46, 0.06);
        }

        .selected-class-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .selected-class-header h2 i {
            color: #f58a2e;
        }

        .selected-class-header .student-count {
            font-size: 0.8rem;
            color: #7f6a4b;
            background: white;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            border: 1px solid #f0e2d2;
        }

        /* student list */
        .student-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .student-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 1rem;
            background: #fcf9f4;
            border-radius: 16px;
            border: 1px solid rgba(245, 138, 46, 0.04);
            transition: all 0.2s;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .student-row:hover {
            border-color: #f9dbb8;
            background: #fefcf9;
        }

        .student-row .student-info {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem 1rem;
        }

        .student-row .student-info .index {
            font-weight: 700;
            color: #b09a7e;
            font-size: 0.8rem;
            min-width: 28px;
        }

        .student-row .student-info .name-block {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .student-row .student-info .name {
            font-weight: 600;
            color: #2d1f0c;
        }

        .student-row .student-info .parents {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .student-row .student-info .parents span {
            font-size: 0.72rem;
            color: #7f6a4b;
            background: white;
            padding: 0.1rem 0.55rem;
            border-radius: 30px;
            border: 1px solid #f0e2d2;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .student-row .student-info .parents span i {
            color: #f58a2e;
            font-size: 0.7rem;
        }

        .student-row .student-info .roll {
            font-size: 0.8rem;
            color: #7f6a4b;
            background: white;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            border: 1px solid #f0e2d2;
        }

        .student-row .attendance-options {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .student-row .attendance-options label {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: #4d3e2b;
            cursor: pointer;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .student-row .attendance-options label.present {
            color: #2b7a3a;
        }

        .student-row .attendance-options label.absent {
            color: #b53b2e;
        }

        .student-row .attendance-options label:hover {
            background: #f0e2d2;
        }

        .student-row .attendance-options input[type="radio"] {
            accent-color: #f58a2e;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .student-row .attendance-options input[type="radio"]:checked + span {
            font-weight: 700;
        }

        /* save button */
        .save-section {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid #f0e2d2;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-save {
            padding: 0.7rem 2.2rem;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #2b7a3a, #3a9e4a);
            color: white;
            box-shadow: 0 4px 12px rgba(43, 122, 58, 0.2);
        }

        .btn-save:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(43, 122, 58, 0.3);
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-fetch {
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #f0e2d2;
            color: #4d3e2b;
            text-decoration: none;
        }

        .btn-fetch:hover {
            background: #e6d5c0;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #b09a7e;
        }

        .empty-state i {
            font-size: 2.5rem;
            color: #f0e2d2;
            margin-bottom: 0.5rem;
        }

        .loading-state {
            text-align: center;
            padding: 2rem;
        }

        .loading-state .spinner {
            font-size: 2rem;
            color: #f58a2e;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state p {
            color: #7f6a4b;
            margin-top: 0.3rem;
        }

        /* footer */
        .footer-note {
            margin-top: 2rem;
            border-top: 1px solid #f0e2d2;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            color: #b09a7e;
            font-size: 0.75rem;
        }

        .footer-note i {
            color: #f58a2e;
        }

        /* responsive */
        @media (max-width: 820px) {
            .attendance-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.5rem;
                padding: 1rem 1.2rem;
            }
            .sidebar-title {
                margin-bottom: 0;
                width: 100%;
            }
            .sidebar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 0.2rem;
            }
            .sidebar-nav a {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
            }
            .sidebar-nav a i {
                width: 1rem;
                font-size: 0.75rem;
            }
            .main-content {
                padding: 1.2rem 1.2rem;
            }
            .page-header h1 {
                font-size: 1.3rem;
            }
            .student-row {
                flex-direction: column;
                align-items: stretch;
            }
            .student-row .student-info {
                flex-wrap: wrap;
            }
            .student-row .attendance-options {
                justify-content: flex-start;
            }
        }

        @media (max-width: 480px) {
            .class-buttons {
                gap: 0.3rem;
            }
            .class-btn {
                padding: 0.3rem 0.8rem;
                font-size: 0.75rem;
            }
            .selected-class-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .date-picker {
                padding: 0.2rem 0.8rem;
            }
            .date-picker input {
                width: 120px;
                font-size: 0.8rem;
            }
        }

        /* ---------- holiday / festival option ---------- */
        .holiday-box {
            background: #fcf9f4;
            border: 1.5px dashed #f0e2d2;
            border-radius: 20px;
            padding: 0.9rem 1.2rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }

        .holiday-box.active {
            background: #e8f1fc;
            border: 1.5px solid #9dc1ef;
        }

        .holiday-toggle {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 0.9rem;
            color: #3d2e1b;
            cursor: pointer;
        }

        .holiday-toggle input {
            width: 18px;
            height: 18px;
            accent-color: #1565c0;
            cursor: pointer;
        }

        .holiday-details {
            display: none;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.8rem;
        }

        .holiday-box.active .holiday-details {
            display: flex;
        }

        .holiday-details select,
        .holiday-details input[type="text"] {
            padding: 0.5rem 0.9rem;
            border: 1.5px solid #f0e2d2;
            border-radius: 14px;
            font-size: 0.85rem;
            background: white;
            outline: none;
            color: #2d1f0c;
            font-weight: 500;
        }

        .holiday-details select:focus,
        .holiday-details input[type="text"]:focus {
            border-color: #1565c0;
        }

        .holiday-details input[type="text"] {
            flex: 1;
            min-width: 220px;
        }

        .holiday-note {
            width: 100%;
            font-size: 0.75rem;
            color: #5d6f86;
        }

        .student-list.holiday-mode .student-row {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-clipboard-check"></i> Daily Attendance</h1>
        <div class="header-info">
            <span class="badge"><i class="fas fa-school"></i> Sunshine · tracking</span>
            <div class="date-picker">
                <label><i class="fas fa-calendar-day"></i> Date</label>
                <input type="date" id="attendanceDate">
            </div>
            <a href="attendance-fetch.html" class="btn-fetch"><i class="fas fa-eye"></i> View Records</a>
        </div>
    </div>

    <!-- LAYOUT -->
    <div class="attendance-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-title"><i class="fas fa-compass"></i> Navigation</div>
            <nav class="sidebar-nav">
                <a href="admin.html"><i class="fas fa-gauge-high"></i> Dashboard</a>
                <a href="students.html"><i class="fas fa-users"></i> Students</a>
                <a href="#" class="active"><i class="fas fa-clipboard-check"></i> Attendance</a>
                <a href="attendance-fetch.html"><i class="fas fa-calendar-days"></i> Reports</a>
                <div class="sidebar-divider"></div>
                <a href="student.html"><i class="fas fa-user-plus"></i> Add Student</a>
                <a href="teacher.html"><i class="fas fa-chalkboard-user"></i> Teachers</a>

                <a href="setting.html"><i class="fas fa-gear"></i> Settings</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- Class Buttons -->
            <div class="section-title"><i class="fas fa-layer-group"></i> Select Class</div>
            <div class="class-buttons" id="classesContainer">
                <div class="loading-state" style="padding:0.5rem 0;">
                    <i class="fas fa-circle-notch fa-spin" style="color:#f58a2e;"></i>
                </div>
            </div>

            <!-- Selected Class & Students -->
            <div id="studentsSection">
                <div class="selected-class-header">
                    <h2 id="selectedClassTitle"><i class="fas fa-users"></i> Select a class</h2>
                    <span class="student-count" id="studentCount">0 students</span>
                </div>
                <div id="studentsContainer">
                    <div class="empty-state">
                        <i class="fas fa-hand-pointer"></i>
                        <p>Click a class button above to load students</p>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <!-- FOOTER -->
    <div class="footer-note">
        <span><i class="fas fa-school"></i> Sunshine School · est. 2006</span>
        <span><i class="fas fa-lock"></i> secure · attendance management</span>
    </div>

</div>

<script>
    const API_URL = "https://sunshine-vtal.onrender.com"; // Change this to your actual API URL

    const classesContainer = document.getElementById("classesContainer");
    const studentsContainer = document.getElementById("studentsContainer");
    const selectedClassTitle = document.getElementById("selectedClassTitle");
    const studentCountEl = document.getElementById("studentCount");
    const attendanceDate = document.getElementById("attendanceDate");

    // Set today's date
    const today = new Date().toISOString().split("T")[0];
    attendanceDate.value = today;

    let activeClass = null;

    // ==========================================
    // HELPER: DISPLAY NAME FOR A CLASS
    // ==========================================
    // Agar class ka naam sirf number hai (e.g. "1", "10") to
    // "Class 1" jaisa dikhao, warna jo backend se aaya wahi dikhao
    // (Nursery, LKG, UKG, ya koi bhi custom naam).

    function getClassDisplayName(className) {
        const isNumeric = /^\d+$/.test(String(className).trim());
        return isNumeric ? `Class ${className}` : className;
    }

    // ==========================================
    // LOAD CLASSES (DYNAMIC — NO HARDCODING)
    // ==========================================

    async function loadClasses() {
        try {
            classesContainer.innerHTML = `
                <div class="loading-state" style="padding:0.5rem 0;">
                    <i class="fas fa-circle-notch fa-spin" style="color:#f58a2e;"></i>
                </div>
            `;

            const response = await fetch(`${API_URL}/api/classes`);
            const result = await response.json();

            if (!response.ok || !result.success) {
                classesContainer.innerHTML = `<p style="color:#b53b2e;font-size:0.85rem;">Unable to load classes.</p>`;
                return;
            }

            const classes = result.classes || [];

            if (classes.length === 0) {
                classesContainer.innerHTML = `<p style="color:#b09a7e;font-size:0.85rem;">No classes found. Please add a class first.</p>`;
                return;
            }

            classesContainer.innerHTML = "";

            classes.forEach(cls => {
                const className = cls.name;

                const button = document.createElement("button");
                button.textContent = getClassDisplayName(className);
                button.className = "class-btn";
                button.dataset.class = className;

                button.addEventListener("click", () => {
                    document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
                    button.classList.add('active');
                    activeClass = className;
                    fetchStudentsByClass(className);
                });

                classesContainer.appendChild(button);
            });

            // Auto-select first class
            const firstBtn = classesContainer.querySelector('.class-btn');
            if (firstBtn) {
                firstBtn.classList.add('active');
                activeClass = firstBtn.dataset.class;
                fetchStudentsByClass(activeClass);
            }

        } catch (error) {
            console.error("Load classes error:", error);
            classesContainer.innerHTML = `<p style="color:#b53b2e;font-size:0.85rem;">Unable to connect with server.</p>`;
        }
    }

    // ==========================================
    // FETCH STUDENTS BY CLASS
    // ==========================================

    async function fetchStudentsByClass(className) {
        try {
            selectedClassTitle.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Loading ${getClassDisplayName(className)}...`;
            studentsContainer.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"><i class="fas fa-circle-notch"></i></div>
                    <p>Loading students...</p>
                </div>
            `;
            studentCountEl.textContent = 'loading...';

            const response = await fetch(
                `${API_URL}/api/students/class/${encodeURIComponent(className)}`
            );

            const result = await response.json();

            if (!response.ok) {
                selectedClassTitle.innerHTML = `<i class="fas fa-triangle-exclamation" style="color:#b53b2e;"></i> Unable to load students.`;
                studentsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-triangle-exclamation"></i><p>${result.message || "Something went wrong."}</p></div>`;
                studentCountEl.textContent = '0 students';
                return;
            }

            const students = result.students || [];

            selectedClassTitle.innerHTML = `<i class="fas fa-users"></i> ${getClassDisplayName(className)} Attendance`;
            studentCountEl.textContent = `${students.length} students`;

            if (students.length === 0) {
                studentsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-graduate"></i>
                        <p>No students found in this class.</p>
                    </div>
                `;
                return;
            }

            // Build student list
            let html = holidayPanelHtml() + `<div class="student-list">`;

            students.forEach((student, index) => {
                const fatherName =
                    student.fatherName ||
                    student.father?.name ||
                    "";

                const motherName =
                    student.motherName ||
                    student.mother?.name ||
                    "";

                html += `
                    <div class="student-row">
                        <div class="student-info">
                            <span class="index">${index + 1}.</span>
                            <div class="name-block">
                                <span class="name">${student.studentName || '-'}</span>
                                <div class="parents">
                                    <span><i class="fas fa-person"></i> ${fatherName || 'N/A'}</span>
                                    <span><i class="fas fa-person-dress"></i> ${motherName || 'N/A'}</span>
                                </div>
                            </div>
                            <span class="roll"><i class="fas fa-sort-numeric-up"></i> ${student.rollNumber || 'N/A'}</span>
                        </div>
                        <div class="attendance-options">
                            <label class="present">
                                <input type="radio" name="attendance-${student._id}" value="Present" checked>
                                <span>Present</span>
                            </label>
                            <label class="absent">
                                <input type="radio" name="attendance-${student._id}" value="Absent">
                                <span>Absent</span>
                            </label>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;

            // Add save button
            html += `
                <div class="save-section">
                    <button class="btn-save" id="saveAttendanceBtn">
                        <i class="fas fa-save"></i> Save Attendance
                    </button>
                </div>
            `;

            studentsContainer.innerHTML = html;
                initHolidayControls();

            // Attach save event
            document.getElementById('saveAttendanceBtn').addEventListener('click', () => {
                saveAttendance(students, className);
            });

        } catch (error) {
            console.error(error);
            selectedClassTitle.innerHTML = `<i class="fas fa-triangle-exclamation" style="color:#b53b2e;"></i> Error`;
            studentsContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-wifi"></i>
                    <p>Unable to connect with server.</p>
                </div>
            `;
            studentCountEl.textContent = '0 students';
        }
    }

    // ==========================================
    // SAVE ATTENDANCE
    // ==========================================

    // ==========================================
    // HOLIDAY / FESTIVAL OPTION
    // ==========================================

    function holidayPanelHtml() {
        return `
            <div class="holiday-box" id="holidayBox">
                <label class="holiday-toggle">
                    <input type="checkbox" id="holidayToggle">
                    <i class="fas fa-umbrella-beach" style="color:#1565c0;"></i>
                    Mark today as Holiday (all students of this class)
                </label>
                <div class="holiday-details">
                    <select id="holidayReason">
                        <option value="Festival">Festival</option>
                        <option value="General Holiday">General Holiday</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" id="holidayName" maxlength="80"
                        placeholder="Festival name (e.g. Diwali, Holi, Eid)">
                    <span class="holiday-note">
                        All students will be saved as "Holiday" for the selected date.
                        This day will not count as Present or Absent.
                    </span>
                </div>
            </div>
        `;
    }

    function initHolidayControls() {
        const box = document.getElementById("holidayBox");
        const toggle = document.getElementById("holidayToggle");
        const reason = document.getElementById("holidayReason");
        const nameInput = document.getElementById("holidayName");
        const list = document.querySelector(".student-list");

        if (!box || !toggle) return;

        function refreshPlaceholder() {
            nameInput.placeholder = reason.value === "Festival"
                ? "Festival name (e.g. Diwali, Holi, Eid)"
                : "Reason (optional)";
        }

        toggle.addEventListener("change", () => {
            const on = toggle.checked;
            box.classList.toggle("active", on);
            if (list) list.classList.toggle("holiday-mode", on);
            document.querySelectorAll(".student-row input[type='radio']")
                .forEach(r => { r.disabled = on; });
            if (on) nameInput.focus();
        });

        reason.addEventListener("change", refreshPlaceholder);
        refreshPlaceholder();
    }

    function getHolidayState() {
        const toggle = document.getElementById("holidayToggle");
        const isHoliday = !!(toggle && toggle.checked);

        return {
            isHoliday,
            reason: isHoliday ? document.getElementById("holidayReason").value : "",
            name: isHoliday ? document.getElementById("holidayName").value.trim() : ""
        };
    }

    async function saveAttendance(students, className) {
        const selectedDate = attendanceDate.value;

        if (!selectedDate) {
            alert("Please select attendance date.");
            return;
        }

        const holiday = getHolidayState();

            if (holiday.isHoliday && holiday.reason === "Festival" && !holiday.name) {
                alert("Please type the festival name.");
                document.getElementById("holidayName").focus();
                return;
            }

            const attendanceData = students.map(student => {
            const selected = document.querySelector(
                `input[name="attendance-${student._id}"]:checked`
            );
            return {
                studentId: student._id,
                studentName: student.studentName,
                rollNumber: student.rollNumber || "",
                status: holiday.isHoliday ? "Holiday" : (selected ? selected.value : "Absent")
            };
        });

        const data = {
            date: selectedDate,
            className: className,
            session: "2026-27",
            students: attendanceData,
                isHoliday: holiday.isHoliday,
                holidayReason: holiday.reason,
                holidayName: holiday.name
        };

        const saveBtn = document.getElementById('saveAttendanceBtn');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

        try {
            const response = await fetch(`${API_URL}/api/attendance`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                alert(result.message || "Unable to save attendance.");
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Attendance';
                return;
            }

            alert(result.message || "✅ Attendance saved successfully!");
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Attendance';

        } catch (error) {
            console.error("Attendance save error:", error);
            alert("Unable to connect with server.");
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Attendance';
        }
    }

    // Load classes dynamically on page load (auto-selects the first one)
    document.addEventListener('DOMContentLoaded', loadClasses);
</script>
