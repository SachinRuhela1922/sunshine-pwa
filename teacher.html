<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>  · Teacher Panel</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f7f3ed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    /* ---------- top bar ---------- */
    .topbar {
      background: linear-gradient(135deg, #f9b042, #f58a2e);
      padding: 0.8rem 2rem;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      box-shadow: 0 8px 24px rgba(245, 138, 46, 0.15);
      margin-bottom: 2rem;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .topbar-brand i {
      background: rgba(255,255,255,0.2);
      padding: 0.4rem 0.6rem;
      border-radius: 30px;
      font-size: 1.6rem;
    }

    .topbar-brand span {
      font-weight: 300;
      opacity: 0.9;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .teacher-badge {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logout-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* ---------- main layout ---------- */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.8rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    /* sidebar */
    .sidebar {
      background: white;
      border-radius: 32px;
      padding: 2rem 1.2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.02);
      border: 1px solid rgba(245, 138, 46, 0.06);
      height: fit-content;
      position: sticky;
      top: 1.5rem;
    }

    .sidebar-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #b8a58b;
      font-weight: 700;
      margin-bottom: 1.8rem;
      padding-left: 0.5rem;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 60px;
      color: #4d3e2b;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .sidebar-nav a i {
      width: 1.8rem;
      color: #b8a58b;
      transition: color 0.2s;
      text-align: center;
      font-size: 1.05rem;
    }

    .sidebar-nav a:hover {
      background: #fcf3e8;
      border-color: #f9dbb8;
      color: #f58a2e;
    }
    .sidebar-nav a:hover i { color: #f58a2e; }

    .sidebar-nav a.active {
      background: linear-gradient(135deg, #fcf3e8, #fef7ef);
      border-color: #f9b042;
      color: #d97d22;
      box-shadow: 0 4px 12px rgba(245,138,46,0.06);
    }
    .sidebar-nav a.active i { color: #f58a2e; }

    .sidebar-divider {
      height: 1px;
      background: linear-gradient(to right, #f0e2d2, transparent);
      margin: 1.2rem 0.5rem;
    }

    /* main content */
    .main-content {
      background: white;
      border-radius: 32px;
      padding: 2rem 2.2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.02);
      border: 1px solid rgba(245, 138, 46, 0.06);
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .page-header h2 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #2d1f0c;
    }
    .page-header h2 i {
      color: #f58a2e;
      margin-right: 0.6rem;
    }

    .page-header .sub {
      background: #fcf3e8;
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      font-size: 0.85rem;
      color: #7f6a4b;
    }

    /* info cards */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .info-item {
      background: #fcf9f4;
      border-radius: 20px;
      padding: 0.9rem 1.2rem;
      border: 1px solid rgba(245,138,46,0.04);
      display: flex;
      flex-direction: column;
    }

    .info-item .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #b09a7e;
      font-weight: 600;
    }

    .info-item .value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2d1f0c;
      margin-top: 0.2rem;
      word-break: break-word;
    }

    .info-item .value i {
      color: #f58a2e;
      margin-right: 0.3rem;
      font-size: 0.9rem;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #2d1f0c;
      margin: 2rem 0 1rem 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .section-title i {
      color: #f58a2e;
    }

    /* Class Cards - Clickable */
    .class-card {
      background: #fcf9f4;
      border-radius: 24px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
      border-left: 6px solid #f9b042;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .class-card:hover {
      background: #fefcf9;
      box-shadow: 0 4px 20px rgba(245,138,46,0.12);
      transform: translateX(6px);
      border-left-color: #f58a2e;
    }

    .class-card:active {
      transform: scale(0.98);
    }

    .class-card .click-hint {
      position: absolute;
      right: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: #b09a7e;
      font-size: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .class-card:hover .click-hint {
      opacity: 1;
    }

    .class-card h3 {
      font-size: 1.05rem;
      color: #2d1f0c;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .class-card h3 i {
      color: #f58a2e;
      font-size: 1rem;
    }

    .class-card .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #4d3e2b;
    }

    .class-card .meta span {
      background: white;
      padding: 0.2rem 0.9rem;
      border-radius: 60px;
      border: 1px solid #f0e2d2;
      font-weight: 500;
    }

    .class-card .meta i {
      color: #f58a2e;
      margin-right: 0.3rem;
    }

    .class-card .arrow-icon {
      color: #f58a2e;
      font-size: 1rem;
      margin-left: auto;
    }

    .perm-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.2rem;
      background: #fcf9f4;
      padding: 1rem 1.5rem;
      border-radius: 24px;
    }

    .perm-grid .perm-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
      color: #3d2e1b;
      font-size: 0.9rem;
    }

    .perm-grid .perm-item i {
      font-size: 0.9rem;
    }

    .perm-grid .perm-item .allowed { color: #2b8c4a; }
    .perm-grid .perm-item .denied { color: #b06b6b; }

    .profile-detail {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2.5rem;
      background: #fcf9f4;
      padding: 1.2rem 1.8rem;
      border-radius: 24px;
    }

    .profile-detail p {
      font-weight: 500;
      color: #2d1f0c;
    }

    .profile-detail p i {
      color: #f58a2e;
      width: 1.6rem;
    }

    .footer-note {
      margin-top: 2.5rem;
      border-top: 1px solid #f0e2d2;
      padding-top: 1.2rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      color: #b09a7e;
      font-size: 0.8rem;
    }

    .footer-note i { color: #f58a2e; }

    /* responsive */
    @media (max-width: 820px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .sidebar-nav { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .sidebar-nav a { flex: 1 0 auto; justify-content: center; padding: 0.5rem 1rem; font-size: 0.8rem; }
      .sidebar-title { text-align: center; }
      body { padding: 1rem; }
      .main-content { padding: 1.5rem; }
    }

    @media (max-width: 480px) {
      .topbar { padding: 0.6rem 1rem; }
      .topbar-brand { font-size: 1.2rem; }
      .info-grid { grid-template-columns: 1fr 1fr; }
      .class-card .click-hint { display: none; }
    }
  </style>
</head>
<body>

<!-- ========== TOP BAR ========== -->
<header class="topbar">
  <div class="topbar-brand">
    <i class="fas fa-sun"></i> Sunshine <span>School</span>
  </div>
  <div class="topbar-actions">
    <span class="teacher-badge"><i class="fas fa-user-graduate"></i> Teacher</span>
    <a href="index.html" class="logout-btn"><i class="fas fa-arrow-right-from-bracket"></i> Logout</a>
  </div>
</header>

<!-- ========== GRID ========== -->
<div class="dashboard-grid">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-title"><i class="fas fa-compass" style="margin-right:6px;"></i> navigation</div>
    <nav class="sidebar-nav">
      <a href="#" class="active"><i class="fas fa-id-card"></i> My Profile</a>
      
      <a href="view-notice.html"><i class="fas fa-calendar-check"></i> Notice Board</a>
      <a href="result2.html"><i class="fas fa-calendar-check"></i> Result</a>
      <a href="view-time-table.html"><i class="fas fa-calendar-check"></i> Time Table</a>
      <div class="sidebar-divider"></div>
      
      <a href="attendance2.html"><i class="fas fa-flag"></i> Attendance</a>
      <a href="exam2.html"><i class="fas fa-envelope"></i> Exam</a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content" id="mainContent">

    <div class="page-header">
      <h2><i class="fas fa-id-card"></i> Teacher Dashboard</h2>
      <span class="sub"><i class="far fa-calendar-alt"></i> <span id="currentDate"></span></span>
    </div>

    <!-- ====== DYNAMIC DATA RENDERED HERE ====== -->
    <div id="dynamicTeacherPanel">
      <!-- Will be filled by JS (logic untouched) -->
    </div>

    <div class="footer-note">
      <span><i class="fas fa-school"></i> Sunshine School · est. 2006</span>
      <span><i class="fas fa-lock"></i> secure session</span>
    </div>
  </main>
</div>

<!-- ========== SCRIPT ========== -->
<script>
  (function() {
    // Set current date
    const now = new Date();
    document.getElementById('currentDate').textContent = now.toLocaleDateString('en-IN', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });

    // ---- ORIGINAL LOGIC (100% preserved, only UI presentation enhanced) ----
    const teacherData = JSON.parse(localStorage.getItem("loggedInTeacher"));

    if (!teacherData) {
      window.location.href = "index.html";
      return;
    }

    const container = document.getElementById('dynamicTeacherPanel');

    // ---- Helper: Get class page URL ----
    // ---- Helper: Get class page URL ----
// SAME URL SYSTEM AS admin.html
function getClassPageUrl(className) {
  if (!className) return '#';

  const encodedName = encodeURIComponent(
    String(className).trim()
  );

  return `class.html?class=${encodedName}`;
}
    // ---- Helper: Get display name for class ----
    function getClassDisplayName(className) {
      if (!className) return 'N/A';
      if (['Nursery', 'LKG', 'UKG'].includes(className)) {
        return className;
      }
      return `Class ${className}`;
    }

    // ---- helper to build the UI from teacherData ----
    function renderTeacherPanel(data) {
      let html = '';

      // ---------- INFO GRID (basic info) ----------
      html += `<div class="info-grid">`;
      const fields = [
        { label: 'Teacher ID', key: 'teacherId', icon: 'fa-id-badge' },
        { label: 'Employee ID', key: 'employeeId', icon: 'fa-user-tie' },
        { label: 'Name', key: 'name', icon: 'fa-user' },
        { label: "Father's Name", key: 'fatherName', icon: 'fa-person' },
        { label: "Department", key: 'department', icon: 'fa-building' },
        { label: "Mother's Name", key: 'motherName', icon: 'fa-person-dress' },
        { label: 'Email', key: 'email', icon: 'fa-envelope' },
        { label: 'Phone', key: 'phone', icon: 'fa-phone' },
        { label: 'Gender', key: 'gender', icon: 'fa-venus-mars' },
        { label: 'Qualification', key: 'qualification', icon: 'fa-graduation-cap' },
        { label: 'Joining Date', key: 'joiningDate', icon: 'fa-calendar-plus', date: true },
        { label: 'Status', key: 'status', icon: 'fa-circle-check' }
      ];

      fields.forEach(f => {
        let val = data[f.key] || '-';
        if (f.date && val !== '-') {
          try { val = new Date(val).toLocaleDateString(); } catch(e){}
        }
        html += `
          <div class="info-item">
            <span class="label"><i class="fas ${f.icon}" style="margin-right:4px; color:#f58a2e;"></i> ${f.label}</span>
            <span class="value">${val}</span>
          </div>
        `;
      });
      html += `</div>`;

      // ---------- ASSIGNED CLASSES (Clickable) ----------
      html += `<div class="section-title"><i class="fas fa-chalkboard"></i> Assigned Classes & Subjects</div>`;
      html += `<p style="color:#7f6a4b;font-size:0.85rem;margin-bottom:1rem;"><i class="fas fa-info-circle" style="color:#f58a2e;"></i> Click on any class to view its students</p>`;

      if (data.assignedClasses && data.assignedClasses.length > 0) {
        data.assignedClasses.forEach((item, idx) => {
          const sections = (item.sections && item.sections.length) ? item.sections.join(', ') : '-';
          const subjects = (item.subjects && item.subjects.length) ? item.subjects.join(', ') : '-';
          const className = item.class || 'N/A';
          const displayName = getClassDisplayName(className);
          const pageUrl = getClassPageUrl(className);

          html += `
            <div class="class-card" onclick="window.location.href='${pageUrl}'" title="Click to view ${displayName} students">
              <h3>
                <i class="fas fa-layer-group"></i> ${displayName}
                <i class="fas fa-arrow-right arrow-icon"></i>
              </h3>
              <div class="meta">
                <span><i class="fas fa-users"></i> Sections: ${sections}</span>
                <span><i class="fas fa-book"></i> Subjects: ${subjects}</span>
              </div>
              <span class="click-hint"><i class="fas fa-hand-pointer"></i> Click to view</span>
            </div>
          `;
        });
      } else {
        html += `<p style="color:#7f6a4b; padding:0.5rem 0;"><i class="fas fa-info-circle" style="color:#f58a2e;"></i> No classes assigned.</p>`;
      }

      // ---------- PERMISSIONS ----------
      html += `<div class="section-title" style="margin-top:2rem;"><i class="fas fa-lock"></i> Permissions</div>`;
      if (data.permissions) {
        html += `<div class="perm-grid">`;
        Object.entries(data.permissions).forEach(([perm, value]) => {
          const icon = value ? 'fa-check-circle allowed' : 'fa-circle-xmark denied';
          const label = value ? 'Allowed' : 'Not Allowed';
          html += `
            <div class="perm-item">
              <i class="fas ${icon}"></i>
              <span>${perm}: <strong style="font-weight:600;">${label}</strong></span>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<p style="color:#7f6a4b;"><i class="fas fa-info-circle" style="color:#f58a2e;"></i> No permissions defined.</p>`;
      }

      // ---------- PROFILE (address, blood group) ----------
      html += `<div class="section-title" style="margin-top:2rem;"><i class="fas fa-address-card"></i> Profile</div>`;
      const address = data.profile?.address || '-';
      const blood = data.profile?.bloodGroup || '-';
      html += `
        <div class="profile-detail">
          <p><i class="fas fa-home"></i> Address: ${address}</p>
          <p><i class="fas fa-droplet"></i> Blood Group: ${blood}</p>
        </div>
      `;

      return html;
    }

    // render the enhanced UI
    container.innerHTML = renderTeacherPanel(teacherData);

    // ---- Hidden elements for original logic ----
    const hiddenContainer = document.createElement('div');
    hiddenContainer.style.display = 'none';
    hiddenContainer.innerHTML = `
      <span id="teacherId"></span>
      <span id="employeeId"></span>
      <span id="teacherName"></span>
      <span id="teacherFatherName"></span>
      <span id="teacherDepartment"></span>
      <span id="teacherMotherName"></span>
      <span id="teacherEmail"></span>
      <span id="teacherPhone"></span>
      <span id="teacherGender"></span>
      <span id="qualification"></span>
      <span id="joiningDate"></span>
      <span id="status"></span>
      <div id="assignedClasses"></div>
      <div id="permissions"></div>
      <span id="address"></span>
      <span id="bloodGroup"></span>
    `;
    document.body.appendChild(hiddenContainer);

    // ---- Original logic (preserved) ----
    (function originalLogic() {
      const teacherDataOrig = JSON.parse(localStorage.getItem("loggedInTeacher"));

      if (!teacherDataOrig) {
        window.location.href = "index.html";
      } else {
        document.getElementById("teacherId").textContent = teacherDataOrig.teacherId || "-";
        document.getElementById("employeeId").textContent = teacherDataOrig.employeeId || "-";
        document.getElementById("teacherName").textContent = teacherDataOrig.name || "-";
        document.getElementById("teacherFatherName").textContent = teacherDataOrig.fatherName || "-";
        document.getElementById("teacherDepartment").textContent = teacherDataOrig.department || "-";
        document.getElementById("teacherMotherName").textContent = teacherDataOrig.motherName || "-";
        document.getElementById("teacherEmail").textContent = teacherDataOrig.email || "-";
        document.getElementById("teacherPhone").textContent = teacherDataOrig.phone || "-";
        document.getElementById("teacherGender").textContent = teacherDataOrig.gender || "-";
        document.getElementById("qualification").textContent = teacherDataOrig.qualification || "-";
        document.getElementById("joiningDate").textContent = teacherDataOrig.joiningDate ? new Date(teacherDataOrig.joiningDate).toLocaleDateString() : "-";
        document.getElementById("status").textContent = teacherDataOrig.status || "-";

        const classesContainer = document.getElementById("assignedClasses");
        if (teacherDataOrig.assignedClasses && teacherDataOrig.assignedClasses.length > 0) {
          teacherDataOrig.assignedClasses.forEach((item, index) => {
            const div = document.createElement("div");
            div.innerHTML = `
              <h3>Assignment ${index + 1}</h3>
              <p><strong>Class:</strong> ${item.class || "-"}</p>
              <p><strong>Sections:</strong> ${item.sections && item.sections.length ? item.sections.join(", ") : "-"}</p>
              <p><strong>Subjects:</strong> ${item.subjects && item.subjects.length ? item.subjects.join(", ") : "-"}</p>
              <hr>
            `;
            classesContainer.appendChild(div);
          });
        } else {
          classesContainer.innerHTML = "<p>No classes assigned.</p>";
        }

        const permissionsContainer = document.getElementById("permissions");
        if (teacherDataOrig.permissions) {
          Object.entries(teacherDataOrig.permissions).forEach(([permission, value]) => {
            const p = document.createElement("p");
            p.innerHTML = `<strong>${permission}:</strong> ${value ? "Allowed" : "Not Allowed"}`;
            permissionsContainer.appendChild(p);
          });
        }

        document.getElementById("address").textContent = teacherDataOrig.profile?.address || "-";
        document.getElementById("bloodGroup").textContent = teacherDataOrig.profile?.bloodGroup || "-";
      }
    })();

  })();
</script>

</body>
</html>
