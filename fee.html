<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine · Fee Students</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f7f3ed;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* header */
        .page-header {
            background: white;
            border-radius: 32px;
            padding: 1.2rem 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-header h1 i {
            color: #f58a2e;
            background: #fcf3e8;
            padding: 0.3rem 0.6rem;
            border-radius: 16px;
            font-size: 1.2rem;
        }

        .page-header .header-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .page-header .badge {
            background: #fcf3e8;
            color: #7f6a4b;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            border: 1px solid rgba(245, 138, 46, 0.1);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .page-header .badge i {
            color: #f58a2e;
        }

        .stat-chip {
            background: linear-gradient(135deg, #fcf3e8, #fef7ef);
            padding: 0.3rem 1.4rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #2d1f0c;
            border: 1px solid rgba(245, 138, 46, 0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-chip i {
            color: #f58a2e;
        }

        .stat-chip .number {
            color: #f58a2e;
            font-size: 1.1rem;
        }

        /* search */
        .search-section {
            background: white;
            border-radius: 20px;
            padding: 0.8rem 1.5rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(245, 138, 46, 0.06);
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-section .search-icon {
            color: #b09a7e;
            font-size: 1rem;
        }

        .search-section input {
            flex: 1;
            min-width: 200px;
            padding: 0.6rem 0;
            border: none;
            outline: none;
            font-size: 0.95rem;
            background: transparent;
            color: #2d1f0c;
            font-weight: 500;
        }

        .search-section input::placeholder {
            color: #b8a58b;
            font-weight: 400;
        }

        .search-section .search-divider {
            width: 1px;
            height: 28px;
            background: #f0e2d2;
        }

        .search-section .filter-label {
            font-size: 0.8rem;
            color: #7f6a4b;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* class sections */
        .class-section {
            background: white;
            border-radius: 28px;
            padding: 1.5rem 1.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(245, 138, 46, 0.06);
            box-shadow: 0 4px 16px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }

        .class-section:hover {
            border-color: rgba(245, 138, 46, 0.12);
            box-shadow: 0 8px 24px rgba(245, 138, 46, 0.04);
        }

        .class-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid #fcf3e8;
        }

        .class-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .class-title i {
            color: #f58a2e;
        }

        .class-title .count-badge {
            background: #fcf3e8;
            color: #7f6a4b;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* table */
        .table-wrap {
            overflow-x: auto;
            border-radius: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            min-width: 750px;
        }

        thead {
            background: #fcf9f4;
        }

        th {
            padding: 0.7rem 1rem;
            text-align: left;
            font-weight: 700;
            color: #3d2e1b;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 2px solid #f0e2d2;
            white-space: nowrap;
        }

        td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #f0e2d2;
            color: #3d2e1b;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr {
            transition: background 0.2s;
            cursor: pointer;
        }

        tr:hover td {
            background: #fcf9f4;
        }

        .student-id {
            font-weight: 600;
            color: #f58a2e;
        }

        .student-name {
            font-weight: 600;
            color: #2d1f0c;
        }

        .father-name {
            color: #4d3e2b;
        }

        .mother-name {
            color: #4d3e2b;
        }

        .phone-number {
            color: #4d3e2b;
        }

        .roll-number {
            color: #7f6a4b;
            font-weight: 500;
        }

        .class-tag {
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            background: #fcf3e8;
            color: #f58a2e;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .view-icon {
            color: #b09a7e;
            transition: color 0.2s;
        }

        tr:hover .view-icon {
            color: #f58a2e;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            background: white;
            border-radius: 40px;
            border: 1px solid rgba(245, 138, 46, 0.06);
        }

        .empty-state i {
            font-size: 4rem;
            color: #f0e2d2;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: #2d1f0c;
            font-size: 1.3rem;
            margin-bottom: 0.4rem;
        }

        .empty-state p {
            color: #b09a7e;
        }

        .loading-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .loading-state .spinner {
            font-size: 2.5rem;
            color: #f58a2e;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state p {
            color: #7f6a4b;
            margin-top: 0.5rem;
        }

        /* footer */
        .footer-note {
            margin-top: 2.5rem;
            border-top: 1px solid #f0e2d2;
            padding-top: 1.2rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            color: #b09a7e;
            font-size: 0.75rem;
        }

        .footer-note i {
            color: #f58a2e;
        }

        /* responsive */
        @media (max-width: 900px) {
            table {
                min-width: 850px;
            }
        }

        @media (max-width: 820px) {
            .class-section {
                padding: 1.2rem 1.2rem;
            }
            .page-header {
                padding: 1.2rem 1.5rem;
            }
            .page-header h1 {
                font-size: 1.3rem;
            }
            .search-section {
                padding: 0.6rem 1rem;
            }
            table {
                font-size: 0.78rem;
                min-width: 750px;
            }
            th, td {
                padding: 0.4rem 0.6rem;
            }
        }

        @media (max-width: 600px) {
            .class-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .search-section {
                flex-direction: column;
                align-items: stretch;
            }
            .search-section .search-divider {
                display: none;
            }
            .search-section input {
                padding: 0.4rem 0;
            }
            .page-header .header-info {
                width: 100%;
                justify-content: flex-start;
            }
            table {
                min-width: 650px;
                font-size: 0.72rem;
            }
            th, td {
                padding: 0.3rem 0.4rem;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-coins"></i> Fee Students</h1>
        <div class="header-info">
            <span class="badge"><i class="fas fa-school"></i> Sunshine · fee management</span>
            <span class="stat-chip">
                <i class="fas fa-users"></i>
                Total: <span class="number" id="totalStudents">0</span>
            </span>
        </div>
    </div>

    <!-- SEARCH -->
    <div class="search-section">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search by name, ID, father, mother, or phone...">
        <div class="search-divider"></div>
        <span class="filter-label"><i class="fas fa-filter"></i> All Classes</span>
    </div>

    <!-- CLASSES CONTAINER -->
    <div id="classesContainer">
        <div class="loading-state">
            <div class="spinner"><i class="fas fa-circle-notch"></i></div>
            <p>Loading students...</p>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-note">
        <span><i class="fas fa-school"></i> Sunshine School · est. 2006</span>
        <span><i class="fas fa-lock"></i> secure · fee records</span>
    </div>

</div>

<script>
    const API_URL = "https://sunshine-vtal.onrender.com";
    const container = document.getElementById("classesContainer");
    const totalStudentsEl = document.getElementById("totalStudents");
    const searchInput = document.getElementById("searchInput");

    let allStudents = [];
    let classGroups = {};

    // ==========================================
    // LOAD STUDENTS
    // ==========================================

    async function loadStudents() {
        try {
            const response = await fetch(`${API_URL}/api/students`);
            const data = await response.json();

            if (!data.success) {
                throw new Error("Unable to fetch students");
            }

            allStudents = data.students || [];
            totalStudentsEl.textContent = allStudents.length;

            // Group students by class
            classGroups = {};

            allStudents.forEach(student => {
                const className = student.academic?.class || "Unknown";
                if (!classGroups[className]) {
                    classGroups[className] = [];
                }
                classGroups[className].push(student);
            });

            // Sort classes
            const sortedClasses = Object.keys(classGroups).sort((a, b) => {
                const numA = parseInt(a);
                const numB = parseInt(b);
                if (!isNaN(numA) && !isNaN(numB)) {
                    return numA - numB;
                }
                return a.localeCompare(b);
            });

            renderClasses(sortedClasses);

        } catch (error) {
            console.error("Error loading students:", error);
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-wifi"></i>
                    <h3>Connection Error</h3>
                    <p>Unable to connect with server. Please try again.</p>
                </div>
            `;
        }
    }

    // ==========================================
    // RENDER CLASSES
    // ==========================================

    function renderClasses(classes) {
        if (classes.length === 0 || allStudents.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-user-graduate"></i>
                    <h3>No Students Found</h3>
                    <p>No student records available.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = '';

        classes.forEach(className => {
            const students = classGroups[className];
            const section = document.createElement("div");
            section.className = "class-section";
            section.dataset.class = className;

            const displayName = ["Nursery", "LKG", "UKG"].includes(className) ? className : `Class ${className}`;

            let tableRows = '';
            students.forEach((student, index) => {
                const fatherName = student.father?.name || student.fatherName || '-';
                const motherName = student.mother?.name || student.motherName || '-';
                const phone = student.father?.phone || student.phone || student.fatherPhone || '-';
                const admissionNumber = student.admissionNumber || '-';
                const roll = student.rollNumber || '-';
                const studentId = student.studentId || '-';
                const name = student.studentName || '-';

                tableRows += `
                    <tr onclick="openFeeDetails('${student._id}')">
                        <td><span class="student-id">${studentId}</span></td>
                        <td><span class="student-name">${name}</span></td>
                        <td><span class="father-name">${fatherName}</span></td>
                        <td><span class="mother-name">${motherName}</span></td>
                        <td><span class="phone-number">${phone}</span></td>
                        <td><span class="roll-number">${roll}</span></td>
                        <td><span class="admission-number">${admissionNumber}</span></td>
                        <td><span class="class-tag">${displayName}</span></td>
                        <td style="text-align:right;width:40px;"><i class="fas fa-chevron-right view-icon"></i></td>
                    </tr>
                `;
            });

            section.innerHTML = `
                <div class="class-header">
                    <div class="class-title">
                        <i class="fas fa-layer-group"></i>
                        ${displayName}
                        <span class="count-badge">${students.length} students</span>
                    </div>
                    <span style="font-size:0.75rem;color:#b09a7e;">
                        <i class="fas fa-credit-card"></i> Click row to view fee details
                    </span>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Name</th>
                                <th>Father Name</th>
                                <th>Mother Name</th>
                                <th>Phone</th>
                                <th>Roll No</th>
                                <th>Admission No</th>
                                <th>Class</th>
                                <th style="width:40px;"></th>
                            </tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            `;

            container.appendChild(section);
        });
    }

    // ==========================================
    // SEARCH FUNCTIONALITY
    // ==========================================

    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();

        if (!query) {
            // Show all classes
            const sortedClasses = Object.keys(classGroups).sort((a, b) => {
                const numA = parseInt(a);
                const numB = parseInt(b);
                if (!isNaN(numA) && !isNaN(numB)) {
                    return numA - numB;
                }
                return a.localeCompare(b);
            });
            renderClasses(sortedClasses);
            return;
        }

        // Filter students across all classes
        const filtered = {};
        Object.keys(classGroups).forEach(className => {
            const matched = classGroups[className].filter(student => {
                const searchable = [
                    student.studentName,
                    student.studentId,
                    student.father?.name,
                    student.fatherName,
                    student.mother?.name,
                    student.motherName,
                    student.phone,
                    student.father?.phone,
                    student.rollNumber,
                    student.academic?.class,
                    student.admissionNumber
                ].join(' ').toLowerCase();
                return searchable.includes(query);
            });
            if (matched.length > 0) {
                filtered[className] = matched;
            }
        });

        const sortedFiltered = Object.keys(filtered).sort((a, b) => {
            const numA = parseInt(a);
            const numB = parseInt(b);
            if (!isNaN(numA) && !isNaN(numB)) {
                return numA - numB;
            }
            return a.localeCompare(b);
        });

        // Temporarily replace classGroups with filtered data for rendering
        const originalGroups = { ...classGroups };
        classGroups = filtered;
        renderClasses(sortedFiltered);
        classGroups = originalGroups;
    });

    // ==========================================
    // OPEN FEE DETAILS
    // ==========================================

    function openFeeDetails(id) {
        window.location.href = `fee-details.html?studentId=${id}`;
    }

    // ==========================================
    // START
    // ==========================================

    loadStudents();
</script>

</body>
</html>
