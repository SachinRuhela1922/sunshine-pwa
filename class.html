<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Sunshine · Class Students</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f7f3ed;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .page-header {
      background: white;
      border-radius: 32px;
      padding: 1.2rem 2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,.02);
      border: 1px solid rgba(245,138,46,.06);

      display: flex;
      align-items: center;
      justify-content: space-between;

      flex-wrap: wrap;
      gap: 1rem;

      margin-bottom: 1.5rem;
    }

    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2d1f0c;

      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .page-header h1 i {
      color: #f58a2e;
      background: #fcf3e8;
      padding: .3rem .6rem;
      border-radius: 16px;
      font-size: 1.2rem;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: .8rem;
      flex-wrap: wrap;
    }

    .badge {
      background: #fcf3e8;
      color: #7f6a4b;
      padding: .3rem 1.2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: .8rem;
      border: 1px solid rgba(245,138,46,.1);
    }

    .badge i {
      color: #f58a2e;
      margin-right: .3rem;
    }

    .btn-action {
      padding: .5rem 1.2rem;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      font-size: .8rem;
      cursor: pointer;
      transition: .2s;

      display: inline-flex;
      align-items: center;
      gap: .5rem;
    }

    .btn-action:hover {
      transform: scale(1.02);
    }

    .btn-success {
      background: linear-gradient(135deg,#2b7a3a,#3a9e4a);
      color: white;
    }

    .btn-primary {
      background: linear-gradient(135deg,#f58a2e,#f9b042);
      color: white;
    }

    .btn-back {
      background: #fcf3e8;
      color: #f58a2e;
      text-decoration: none;
    }


    /* ================= SYLLABUS MODAL ================= */

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(45,31,12,.45);
      z-index: 999;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .syllabus-modal {
      background: #f7f3ed;
      border-radius: 28px;
      max-width: 1100px;
      width: 100%;
      padding: 1.6rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .syllabus-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: .6rem;
    }

    .syllabus-modal-header h2 {
      font-size: 1.3rem;
      color: #2d1f0c;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .syllabus-modal-header h2 i {
      color: #f58a2e;
    }

    .syllabus-close-btn {
      background: #fcf3e8;
      color: #f58a2e;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }

    .term-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem;
    }

    .term-tab-btn {
      background: white;
      border: 1px solid rgba(245,138,46,.15);
      color: #7f6a4b;
      padding: .5rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: .8rem;
      cursor: pointer;
      transition: .2s;
    }

    .term-tab-btn.active {
      background: linear-gradient(135deg,#f58a2e,#f9b042);
      color: white;
      border-color: transparent;
    }

    .term-panel {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 1.2rem;
      border: 1px solid rgba(245,138,46,.06);
    }

    .term-panel.active {
      display: block;
    }

    .syllabus-row {
      display: grid;
      grid-template-columns: 1.4fr .7fr .7fr 1.4fr auto;
      gap: .6rem;
      margin-bottom: .6rem;
      align-items: center;
    }

    .syllabus-row input {
      padding: .55rem .7rem;
      border: 1px solid #f0e2d2;
      border-radius: 10px;
      font-size: .85rem;
      width: 100%;
    }

    .syllabus-row input:focus {
      outline: none;
      border-color: #f58a2e;
    }

    .row-remove-btn {
      background: #fdeaea;
      color: #c0392b;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }

    .add-row-btn {
      background: #fcf3e8;
      color: #f58a2e;
      border: 1px dashed #f58a2e;
      padding: .5rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: .8rem;
      cursor: pointer;
      margin-top: .3rem;
    }

    .syllabus-row-labels {
      display: grid;
      grid-template-columns: 1.4fr .7fr .7fr 1.4fr auto;
      gap: .6rem;
      margin-bottom: .4rem;
      font-size: .72rem;
      font-weight: 700;
      color: #a68a5e;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .syllabus-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: .6rem;
      margin-top: 1.2rem;
    }

    .syllabus-view-wrap {
      margin-top: 1.5rem;
    }

    .syllabus-view-term {
      background: white;
      border-radius: 20px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(245,138,46,.06);
    }

    .syllabus-view-term h3 {
      font-size: 1rem;
      color: #2d1f0c;
      margin-bottom: .6rem;
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .syllabus-view-term h3 i {
      color: #f58a2e;
    }

    .syllabus-view-item {
      padding: .6rem 0;
      border-bottom: 1px dashed #f0e2d2;
      font-size: .85rem;
      color: #4a3c26;
    }

    .syllabus-view-item:last-child {
      border-bottom: none;
    }

    .syllabus-view-item strong {
      color: #2d1f0c;
    }

    .syllabus-empty-note {
      color: #a68a5e;
      font-size: .8rem;
      padding: .3rem 0;
    }

    @media (max-width: 700px) {
      .syllabus-row, .syllabus-row-labels {
        grid-template-columns: 1fr;
      }
      .syllabus-row-labels { display: none; }
    }


    /* SEARCH */

    .search-section {
      background: white;
      border-radius: 20px;
      padding: .8rem 1.5rem;
      margin-bottom: 1.5rem;

      border: 1px solid rgba(245,138,46,.06);

      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-icon {
      color: #b09a7e;
    }

    .search-section input {
      flex: 1;
      min-width: 200px;
      padding: .6rem 0;

      border: none;
      outline: none;

      font-size: .95rem;
      background: transparent;
      color: #2d1f0c;
    }

    .search-divider {
      width: 1px;
      height: 28px;
      background: #f0e2d2;
    }

    .result-count {
      font-size: .8rem;
      color: #7f6a4b;
    }


    /* STATS */

    .stats-bar {
      display: none;
      grid-template-columns:
        repeat(auto-fit,minmax(140px,1fr));

      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stats-bar.visible {
      display: grid;
    }

    .stat-item {
      background: white;
      border-radius: 20px;
      padding: .8rem 1rem;
      border: 1px solid rgba(245,138,46,.06);
      text-align: center;
    }

    .stat-item .number {
      font-size: 1.6rem;
      font-weight: 800;
      color: #2d1f0c;
    }

    .stat-item .label {
      font-size: .7rem;
      color: #7f6a4b;
      font-weight: 600;
      text-transform: uppercase;
    }

    .stat-item .icon {
      color: #f58a2e;
      margin-right: .3rem;
    }


    /* TABLE */

    .table-wrapper {
      background: white;
      border-radius: 24px;
      padding: 1rem 1.2rem;

      border: 1px solid rgba(245,138,46,.06);

      box-shadow: 0 4px 16px rgba(0,0,0,.02);

      overflow-x: auto;
    }

    .students-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
      min-width: 1000px;
    }

    .students-table th,
    .students-table td {
      border: 1px solid #d6cbbc !important;

      padding: .6rem;

      text-align: left;
      vertical-align: middle;
    }

    .students-table thead {
      background: #fcf9f4;
    }

    .students-table th {
      font-weight: 700;
      color: #3d2e1b;
      font-size: .65rem;

      text-transform: uppercase;
      letter-spacing: .3px;

      background: #fcf9f4;

      position: sticky;
      top: 0;
      z-index: 10;
    }

    .students-table td {
      color: #3d2e1b;
      font-size: .78rem;
    }

    .students-table tr:hover td {
      background: #fcf9f4;
    }

    .wrap-text {
      white-space: normal;
      word-break: break-word;

      display: inline-block;
      max-width: 150px;
      line-height: 1.3;
    }

    .wrap-address {
      white-space: normal;
      word-break: break-word;

      display: inline-block;
      max-width: 180px;
      line-height: 1.3;
    }

    .student-name {
      font-weight: 600;
      color: #2d1f0c;
    }

    .student-id {
      font-size: .65rem;
      color: #b09a7e;
      display: block;
    }

    .view-btn {
      padding: .2rem .8rem;
      border: none;
      border-radius: 30px;

      font-weight: 600;
      font-size: .65rem;

      cursor: pointer;

      background: #fcf3e8;
      color: #f58a2e;

      display: inline-flex;
      align-items: center;
      gap: .3rem;
    }

    .view-btn:hover {
      background: #f58a2e;
      color: white;
    }


    /* EMPTY / LOADING */

    .empty-state {
      text-align: center;
      padding: 3rem 2rem;

      background: white;
      border-radius: 32px;

      border: 1px solid rgba(245,138,46,.06);
    }

    .empty-state i {
      font-size: 3.5rem;
      color: #f0e2d2;
      margin-bottom: .8rem;
    }

    .empty-state h3 {
      color: #2d1f0c;
      margin-bottom: .3rem;
    }

    .empty-state p {
      color: #b09a7e;
    }

    .loading-state {
      text-align: center;
      padding: 2.5rem;
    }

    .loading-state .spinner {
      font-size: 2.5rem;
      color: #f58a2e;
    }


    .footer-note {
      margin-top: 2rem;

      border-top: 1px solid #f0e2d2;

      padding-top: 1rem;

      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;

      color: #b09a7e;
      font-size: .75rem;
    }

    .footer-note i {
      color: #f58a2e;
    }


    @media(max-width:768px) {

      body {
        padding: .8rem;
      }

      .page-header {
        padding: 1rem 1.2rem;
      }

      .page-header h1 {
        font-size: 1.2rem;
      }

      .students-table {
        min-width: 800px;
      }

      .stats-bar {
        grid-template-columns: 1fr 1fr;
      }

    }

  </style>

</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="page-header">

    <h1>

      <i class="fas fa-layer-group"></i>
        Class
      <span id="classNameDisplay">
        Class
      </span>


    </h1>


    <div class="header-info">

      <span class="badge">

        <i class="fas fa-school"></i>

        Sunshine · class

      </span>


      <a href="admin.html"
        class="btn-action btn-back">

        <i class="fas fa-arrow-left"></i>

        Back

      </a>


      <button
        class="btn-action btn-success"
        id="exportPdfBtn">

        <i class="fas fa-file-pdf"></i>

        PDF

      </button>


      <button
        class="btn-action btn-primary"
        id="refreshBtn">

        <i class="fas fa-sync-alt"></i>

        Refresh

      </button>


      <button
        class="btn-action btn-primary"
        id="openSyllabusBtn">

        <i class="fas fa-book-open"></i>

        Syllabus

      </button>

    </div>

  </div>


  <!-- ================= SYLLABUS MODAL ================= -->

  <div class="modal-overlay" id="syllabusModalOverlay">

    <div class="syllabus-modal">

      <div class="syllabus-modal-header">
        <h2><i class="fas fa-book-open"></i> Syllabus · <span id="syllabusClassLabel">Class</span></h2>
        <button class="syllabus-close-btn" id="closeSyllabusBtn"><i class="fas fa-times"></i></button>
      </div>

      <div class="term-tabs" id="termTabs"></div>

      <div id="termPanels"></div>

      <div class="syllabus-modal-footer">
        <button class="btn-action btn-back" id="cancelSyllabusBtn">Cancel</button>
        <button class="btn-action btn-success" id="saveSyllabusBtn">
          <i class="fas fa-save"></i> Save Syllabus
        </button>
      </div>

      <div class="syllabus-view-wrap" id="syllabusViewWrap">
        <!-- Saved syllabus preview render hoga yaha -->
      </div>

    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-section">

    <i class="fas fa-search search-icon"></i>

    <input
      type="text"
      id="searchInput"
      placeholder="Search by name, father, mother, admission no...">

    <div class="search-divider"></div>

    <span
      class="result-count"
      id="resultCount">

      0 students

    </span>

  </div>


  <!-- STATS -->

  <div
    class="stats-bar"
    id="statsBar">


    <div class="stat-item">

      <div
        class="number"
        id="totalStudents">
        0
      </div>

      <div class="label">

        <i class="fas fa-users icon"></i>

        Total Students

      </div>

    </div>


    <div class="stat-item">

      <div
        class="number"
        id="totalDue">
        ₹0
      </div>

      <div class="label">

        <i class="fas fa-circle-exclamation icon"></i>

        Total Due

      </div>

    </div>


    <div class="stat-item">

      <div
        class="number"
        id="paidCount">
        0
      </div>

      <div class="label">

        <i class="fas fa-check-circle icon"></i>

        Fee Paid

      </div>

    </div>


    <div class="stat-item">

      <div
        class="number"
        id="dueCount">
        0
      </div>

      <div class="label">

        <i class="fas fa-exclamation-triangle icon"></i>

        Fee Due

      </div>

    </div>


  </div>


  <!-- STUDENTS -->

  <div id="studentsContainer">

    <div class="loading-state">

      <div class="spinner">

        <i class="fas fa-circle-notch fa-spin"></i>

      </div>

      <p>
        Loading students...
      </p>

    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer-note">

    <span>

      <i class="fas fa-school"></i>

      Sunshine School · est. 2006

    </span>

    <span>

      <i class="fas fa-lock"></i>

      secure · class records

    </span>

  </div>


</div>


<script>

const API_URL =
  "https://sunshine-swp6.onrender.com"; // Change this to your actual API URL


/* ================= CLASS NAME ================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const className =
  params.get("class");


if (!className) {

  document
    .getElementById("classNameDisplay")
    .textContent =
    "Class not selected";

}


/* DO NOT ADD "Class " HERE
   because MongoDB stores exact name */

const displayName =
  className || "Class";


document
  .getElementById("classNameDisplay")
  .textContent =
  displayName;


/* ELEMENTS */

const container =
  document.getElementById(
    "studentsContainer"
  );

const studentCount =
  document.getElementById(
    "totalStudents"
  );

const totalDueEl =
  document.getElementById(
    "totalDue"
  );

const paidCountEl =
  document.getElementById(
    "paidCount"
  );

const dueCountEl =
  document.getElementById(
    "dueCount"
  );

const statsBar =
  document.getElementById(
    "statsBar"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const resultCount =
  document.getElementById(
    "resultCount"
  );

const exportPdfBtn =
  document.getElementById(
    "exportPdfBtn"
  );

const refreshBtn =
  document.getElementById(
    "refreshBtn"
  );


let allStudentsData = [];

let filteredData = [];


/* ================= LOAD STUDENTS ================= */

async function loadClassStudents() {

  if (!className) {

    showError(
      "No class selected."
    );

    return;

  }


  try {

    container.innerHTML = `

      <div class="loading-state">

        <div class="spinner">

          <i class="fas fa-circle-notch fa-spin"></i>

        </div>

        <p>
          Loading ${escapeHtml(displayName)} students...
        </p>

      </div>

    `;


    const response =
      await fetch(
        `${API_URL}/api/students/class/${encodeURIComponent(className)}`
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.message ||
        "Unable to fetch students."
      );

    }


    allStudentsData =
      result.students || [];

    filteredData =
      [...allStudentsData];


    renderTable(
      filteredData
    );

    updateStats(
      filteredData
    );


  } catch (error) {

    console.error(error);

    showError(
      error.message ||
      "Unable to connect with server."
    );

  }

}


/* ================= ERROR ================= */

function showError(message) {

  container.innerHTML = `

    <div class="empty-state">

      <i class="fas fa-triangle-exclamation"></i>

      <h3>
        Error
      </h3>

      <p>
        ${escapeHtml(message)}
      </p>

    </div>

  `;

}


/* ================= SEARCH ================= */

searchInput.addEventListener(
  "input",
  function() {

    const query =
      this.value
        .toLowerCase()
        .trim();


    if (!query) {

      filteredData =
        [...allStudentsData];

    } else {

      filteredData =
        allStudentsData.filter(
          student => {

            const searchable = [

              student.studentName,

              student.father?.name,

              student.fatherName,

              student.mother?.name,

              student.motherName,

              student.admissionNumber,
              student.studentId,

              student.phone,

              student.contact?.phone,

              student.category,

              student.father?.occupation

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


            return searchable.includes(
              query
            );

          }
        );

    }


    renderTable(
      filteredData
    );

    updateStats(
      filteredData
    );

    resultCount.textContent =
      `${filteredData.length} students`;

  }
);
function formatDOB(dateValue) {
  if (!dateValue) return "-";

  // MongoDB ISO date: 2006-08-20T00:00:00.000Z
  // Sirf date portion lenge, timezone conversion nahi karenge.
  const dateString = String(dateValue).split("T")[0];

  const parts = dateString.split("-");

  if (parts.length === 3) {
    const [year, month, day] = parts;

    return `${day}/${month}/${year}`;
  }

  return "-";
}

/* ================= TABLE ================= */

function renderTable(students) {

  if (
    !students ||
    students.length === 0
  ) {

    container.innerHTML = `

      <div class="empty-state">

        <i class="fas fa-users-slash"></i>

        <h3>
          No Students Found
        </h3>

        <p>

          ${
            allStudentsData.length === 0
            ? `No students found in ${escapeHtml(displayName)}.`
            : "Try adjusting your search."

          }

        </p>

      </div>

    `;

    resultCount.textContent =
      "0 students";

    return;

  }


  let tableHtml = `

    <div class="table-wrapper">

      <table class="students-table">

        <thead>

          <tr>

            <th>#</th>

            <th>Student Name</th>

            <th>Father Name</th>

            <th>Mother Name</th>

            <th>DOB</th>

            <th>Caste</th>

            <th>S.R Number</th>

            <th>Mobile</th>

            <th>PEN No</th>

            <th>Aadhaar</th>

            <th>Category</th>

            <th>Father Occ.</th>

            <th>Admission No</th>

            <th>Address</th>
<th>Action</th>

          </tr>

        </thead>

        <tbody>

  `;


  students.forEach(
    (student,index) => {

      const dob = formatDOB(student.dob);

      const bloodGroup =
        student.bloodGroup ||
        student.personal?.bloodGroup ||
        student.medical?.bloodGroup ||
        student.documents?.bloodGroup ||
        "-";

      const previousClass =
        student.academic?.previousClass ||
        student.previousClass ||
        "-";


      const name =
        student.studentName || "-";


      const fatherName =
        student.father?.name ||
        student.fatherName ||
        "-";


      const motherName =
        student.mother?.name ||
        student.motherName ||
        "-";

/* ================= STATS ================= */

function updateStats(students) {

  if (
    !students ||
    students.length === 0
  ) {

    statsBar.classList.remove(
      "visible"
    );

    return;

  }


  let totalDueSum = 0;

  let paidCount = 0;

  let dueCount = 0;


  students.forEach(
    student => {

      if (student.fees) {

        const fee =
          student.fees;


        const monthlyFee =
          Number(
            fee.monthlyFee
          ) || 0;


        const paid =
          Number(
            fee.paid
          ) || 0;


        const previousDue =
          Number(
            fee.previousDue
          ) || 0;


        const totalDue =
          Math.max(
            monthlyFee -
            paid +
            previousDue,
            0
          );


        totalDueSum +=
          totalDue;


        if (
          fee.status ===
          "Paid"
        ) {

          paidCount++;

        } else {

          dueCount++;

        }

      } else {

        dueCount++;

      }

    }
  );


  statsBar.classList.add(
    "visible"
  );


  studentCount.textContent =
    students.length;


  totalDueEl.textContent =
    `₹${totalDueSum}`;


  paidCountEl.textContent =
    paidCount;


  dueCountEl.textContent =
    dueCount;

}

/* ================= PDF ================= */

exportPdfBtn.addEventListener("click", function () {

    const data = filteredData.length
        ? filteredData
        : allStudentsData;

    if (!data.length) {
        alert("No data to export.");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("landscape", "pt", "a4");

    const FONT_SIZE = 7;
    const CELL_PADDING = 2.5;
    const MIN_CELL_HEIGHT = 18;

    function createStudentRow(student, index) {
        return [
            index + 1,
            student.studentName || "-",
            student.father?.name || student.fatherName || "-",
            student.mother?.name || student.motherName || "-",
            formatDOB(student.dob),
            student.bloodGroup || student.personal?.bloodGroup || student.medical?.bloodGroup || student.documents?.bloodGroup || "-",
            student.academic?.previousClass || student.previousClass || "-",
            student.phone || student.father?.phone || student.contact?.phone || "-",
            student.fees?.transactionId || student.transactionId || "-",
            student.documents?.aadhaarNumber || student.aadhaarNumber || "-",
            student.category || "-",
            student.father?.occupation || "-",
            student.admissionNumber || "-",
            student.contact?.address || student.address || "-"
        ];
    }

    const headers = [[
        "#", "Student", "Father", "Mother", "DOB", "Caste",
        "S.R Number", "Mobile", "PEN No", "Aadhaar",
        "Category", "Father Occ.", "Admission No", "Address"
    ]];

    const columnStyles = {
        0: { cellWidth: 18 }, 1: { cellWidth: 65 }, 2: { cellWidth: 65 },
        3: { cellWidth: 65 }, 4: { cellWidth: 45 }, 5: { cellWidth: 52 },
        6: { cellWidth: 55 }, 7: { cellWidth: 52 }, 8: { cellWidth: 45 },
        9: { cellWidth: 58 }, 10: { cellWidth: 48 }, 11: { cellWidth: 55 },
        12: { cellWidth: 55 }, 13: { cellWidth: 110 }
    };

    // Ab saare rows ek hi baar me — koi manual slicing nahi
    const rows = data.map((student, index) => createStudentRow(student, index));

    doc.autoTable({
        head: headers,
        body: rows,
        theme: "grid",
        startY: 38,
        margin: { left: 20, right: 20, top: 38, bottom: 25 },
        tableWidth: "wrap",

        // Yehi key setting hai — page bharte hi khud naya page banayega
        pageBreak: "auto",
        rowPageBreak: "avoid",   // ek row beech me nahi kategi
        showHead: "everyPage",   // har page pe header repeat hoga

        styles: {
            font: "helvetica",
            fontSize: FONT_SIZE,
            cellPadding: CELL_PADDING,
            minCellHeight: MIN_CELL_HEIGHT,
            textColor: [0, 0, 0],
            lineColor: [0, 0, 0],
            lineWidth: 0.5,
            overflow: "linebreak",
            valign: "middle",
            halign: "left",
            fontStyle: "normal"
        },

        headStyles: {
            fillColor: [255, 255, 255],
            textColor: [0, 0, 0],
            fontStyle: "bold",
            fontSize: FONT_SIZE,
            cellPadding: CELL_PADDING,
            minCellHeight: 20,
            lineColor: [0, 0, 0],
            lineWidth: 0.5,
            halign: "left",
            valign: "middle"
        },

        alternateRowStyles: { fillColor: [255, 255, 255] },
        columnStyles: columnStyles,

        // Title aur footer har page pe autoTable khud draw karega jab bhi naya page bane
        didDrawPage: function () {
            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text(
                `Class = ${displayName} [Students List - Sunshine School]`,
                20, 28
            );

            const pageNumber = doc.internal.getNumberOfPages();
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7);
            doc.text(
                `Sunshine School | Students List | Page ${pageNumber}`,
                20,
                doc.internal.pageSize.getHeight() - 10
            );
        }
    });

    // Total pages ab pata chalega tabhi jab poora table ban chuka ho
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
        doc.setPage(i);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.text(
            `Page ${i} of ${totalPages}`,
            doc.internal.pageSize.getWidth() - 75,
            28
        );
    }

    doc.save(
        `${displayName}_students_${new Date().toISOString().split("T")[0]}.pdf`
    );
});

/* ================= ESCAPE ================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =====================================================
   SYLLABUS (Create + View for this class)
   Fixed terms: Unit 1, Unit 2, Half Yearly, Unit 3, Unit 4, Annual
===================================================== */

const SYLLABUS_TERMS = [
  { key: "unit1",      label: "Unit 1",      icon: "fa-1" },
  { key: "unit2",      label: "Unit 2",      icon: "fa-2" },
  { key: "halfYearly",  label: "Half Yearly", icon: "fa-calendar-check" },
  { key: "unit3",      label: "Unit 3",      icon: "fa-3" },
  { key: "unit4",      label: "Unit 4",      icon: "fa-4" },
  { key: "annual",     label: "Annual",      icon: "fa-trophy" }
];

let syllabusRowIdCounter = 0;
let activeSyllabusTerm = "unit1";

const syllabusModalOverlay = document.getElementById("syllabusModalOverlay");
const openSyllabusBtn = document.getElementById("openSyllabusBtn");
const closeSyllabusBtn = document.getElementById("closeSyllabusBtn");
const cancelSyllabusBtn = document.getElementById("cancelSyllabusBtn");
const saveSyllabusBtn = document.getElementById("saveSyllabusBtn");
const termTabsEl = document.getElementById("termTabs");
const termPanelsEl = document.getElementById("termPanels");
const syllabusViewWrap = document.getElementById("syllabusViewWrap");
const syllabusClassLabel = document.getElementById("syllabusClassLabel");

function buildSyllabusRow(termKey, data) {

  const row = data || { subject: "", chapterFrom: "", chapterTo: "", extra: "" };
  syllabusRowIdCounter++;
  const rowId = "srow_" + syllabusRowIdCounter;

  const div = document.createElement("div");
  div.className = "syllabus-row";
  div.dataset.rowId = rowId;

  div.innerHTML = `
    <input type="text" class="s-subject" placeholder="Subject (e.g. Mathematics)" value="${escapeHtml(row.subject)}">
    <input type="text" class="s-from" placeholder="Chapter from" value="${escapeHtml(row.chapterFrom)}">
    <input type="text" class="s-to" placeholder="Chapter to" value="${escapeHtml(row.chapterTo)}">
    <input type="text" class="s-extra" placeholder="Extra note (optional)" value="${escapeHtml(row.extra)}">
    <button type="button" class="row-remove-btn" title="Remove row"><i class="fas fa-trash"></i></button>
  `;

  div.querySelector(".row-remove-btn").addEventListener("click", function() {
    div.remove();
  });

  const panel = document.getElementById("panel_" + termKey);
  const addBtn = panel.querySelector(".add-row-btn");
  panel.querySelector(".syllabus-rows").appendChild(div);

  return div;
}

function renderSyllabusTabsAndPanels() {

  termTabsEl.innerHTML = "";
  termPanelsEl.innerHTML = "";

  SYLLABUS_TERMS.forEach((term, idx) => {

    const tabBtn = document.createElement("button");
    tabBtn.type = "button";
    tabBtn.className = "term-tab-btn" + (idx === 0 ? " active" : "");
    tabBtn.dataset.term = term.key;
    tabBtn.innerHTML = `<i class="fas ${term.icon}"></i> ${term.label}`;
    tabBtn.addEventListener("click", function() {
      activeSyllabusTerm = term.key;
      document.querySelectorAll(".term-tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".term-panel").forEach(p => p.classList.remove("active"));
      tabBtn.classList.add("active");
      document.getElementById("panel_" + term.key).classList.add("active");
    });
    termTabsEl.appendChild(tabBtn);

    const panel = document.createElement("div");
    panel.className = "term-panel" + (idx === 0 ? " active" : "");
    panel.id = "panel_" + term.key;
    panel.innerHTML = `
      <div class="syllabus-row-labels">
        <span>Subject</span><span>From</span><span>To</span><span>Extra note</span><span></span>
      </div>
      <div class="syllabus-rows"></div>
      <button type="button" class="add-row-btn"><i class="fas fa-plus"></i> Add Subject Row</button>
    `;
    termPanelsEl.appendChild(panel);

    panel.querySelector(".add-row-btn").addEventListener("click", function() {
      buildSyllabusRow(term.key, null);
    });

  });

}

function fillSyllabusForm(terms) {

  SYLLABUS_TERMS.forEach((term) => {

    const panel = document.getElementById("panel_" + term.key);
    panel.querySelector(".syllabus-rows").innerHTML = "";

    const rows = (terms && terms[term.key] && terms[term.key].length) ? terms[term.key] : [null];

    rows.forEach((row) => {
      buildSyllabusRow(term.key, row);
    });

  });

}

function collectSyllabusFormData() {

  const terms = {};

  SYLLABUS_TERMS.forEach((term) => {

    const panel = document.getElementById("panel_" + term.key);
    const rowEls = panel.querySelectorAll(".syllabus-row");

    const rows = [];

    rowEls.forEach((rowEl) => {

      const subject = rowEl.querySelector(".s-subject").value.trim();
      const chapterFrom = rowEl.querySelector(".s-from").value.trim();
      const chapterTo = rowEl.querySelector(".s-to").value.trim();
      const extra = rowEl.querySelector(".s-extra").value.trim();

      if (subject) {
        rows.push({ subject, chapterFrom, chapterTo, extra });
      }

    });

    terms[term.key] = rows;

  });

  return terms;

}

function renderSyllabusView(syllabus) {

  syllabusViewWrap.innerHTML = `<div class="section-divider" style="border-top:1px dashed #e6d4bb;margin:1rem 0 1rem;"></div>
    <h3 style="color:#2d1f0c;font-size:1rem;margin-bottom:.8rem;"><i class="fas fa-eye" style="color:#f58a2e;"></i> Saved Syllabus</h3>`;

  const terms = (syllabus && syllabus.terms) ? syllabus.terms : {};

  let anyData = false;

  SYLLABUS_TERMS.forEach((term) => {

    const rows = terms[term.key] || [];

    const block = document.createElement("div");
    block.className = "syllabus-view-term";

    let inner = `<h3><i class="fas ${term.icon}"></i> ${term.label}</h3>`;

    if (rows.length === 0) {
      inner += `<div class="syllabus-empty-note">No syllabus added yet for ${term.label}.</div>`;
    } else {
      anyData = true;
      rows.forEach((row) => {
        const range = (row.chapterFrom || row.chapterTo)
          ? ` (Chapter ${escapeHtml(row.chapterFrom || "-")} to ${escapeHtml(row.chapterTo || "-")})`
          : "";
        const extraText = row.extra ? ` — ${escapeHtml(row.extra)}` : "";
        inner += `<div class="syllabus-view-item"><strong>${escapeHtml(row.subject)}</strong>${range}${extraText}</div>`;
      });
    }

    block.innerHTML = inner;
    syllabusViewWrap.appendChild(block);

  });

  if (!anyData) {
    syllabusViewWrap.insertAdjacentHTML(
      "beforeend",
      `<p class="syllabus-empty-note"><i class="fas fa-info-circle"></i> Abhi tak is class ka koi syllabus save nahi hua.</p>`
    );
  }

}

async function loadSyllabusForClass() {

  fillSyllabusForm(null);
  syllabusViewWrap.innerHTML = `<p class="syllabus-empty-note"><i class="fas fa-circle-notch fa-spin"></i> Loading syllabus...</p>`;

  try {

    const response = await fetch(`${API_URL}/api/syllabus/${encodeURIComponent(className)}`);
    const result = await response.json();

    if (response.ok && result.success && result.syllabus) {
      fillSyllabusForm(result.syllabus.terms);
      renderSyllabusView(result.syllabus);
    } else {
      renderSyllabusView(null);
    }

  } catch (error) {

    console.error("Load syllabus error:", error);
    syllabusViewWrap.innerHTML = `<p class="syllabus-empty-note"><i class="fas fa-triangle-exclamation"></i> Syllabus load nahi ho paya.</p>`;

  }

}

function openSyllabusModal() {

  if (!className) {
    alert("No class selected.");
    return;
  }

  syllabusClassLabel.textContent = displayName;
  syllabusModalOverlay.classList.add("open");
  loadSyllabusForClass();

}

function closeSyllabusModal() {
  syllabusModalOverlay.classList.remove("open");
}

if (openSyllabusBtn) {
  renderSyllabusTabsAndPanels();
  openSyllabusBtn.addEventListener("click", openSyllabusModal);
}

if (closeSyllabusBtn) {
  closeSyllabusBtn.addEventListener("click", closeSyllabusModal);
}

if (cancelSyllabusBtn) {
  cancelSyllabusBtn.addEventListener("click", closeSyllabusModal);
}

if (syllabusModalOverlay) {
  syllabusModalOverlay.addEventListener("click", function(e) {
    if (e.target === syllabusModalOverlay) {
      closeSyllabusModal();
    }
  });
}

if (saveSyllabusBtn) {
  saveSyllabusBtn.addEventListener("click", async function() {

    const terms = collectSyllabusFormData();

    const oldText = saveSyllabusBtn.innerHTML;
    saveSyllabusBtn.disabled = true;
    saveSyllabusBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving...`;

    try {

      const response = await fetch(`${API_URL}/api/syllabus`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ className: className, terms: terms })
      });

      const result = await response.json();

      if (response.ok && result.success) {
        renderSyllabusView(result.syllabus);
        alert("Syllabus saved successfully.");
      } else {
        alert(result.message || "Unable to save syllabus.");
      }

    } catch (error) {

      console.error("Save syllabus error:", error);
      alert("Unable to save syllabus. Please try again.");

    } finally {

      saveSyllabusBtn.disabled = false;
      saveSyllabusBtn.innerHTML = oldText;

    }

  });
}

</script>
