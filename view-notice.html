<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunshine · Notice Board</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f7f3ed;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .page-header {
            background: linear-gradient(135deg, #f58a2e, #f9b042);
            border-radius: 32px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 8px 30px rgba(245, 138, 46, 0.2);
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            z-index: 1;
        }

        .page-header h1 i {
            background: rgba(255,255,255,0.15);
            padding: 0.3rem 0.6rem;
            border-radius: 16px;
            font-size: 1.2rem;
        }

        .page-header .header-sub {
            color: rgba(255,255,255,0.85);
            font-size: 0.85rem;
            z-index: 1;
        }

        .page-header .header-sub i {
            margin-right: 0.3rem;
        }

        .page-header .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            z-index: 1;
        }

        .btn-action {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.02);
        }

        /* ===== BANNER ===== */
        .banner {
            background: linear-gradient(135deg, #fcf3e8, #f9dbb8);
            border-radius: 28px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid rgba(245, 138, 46, 0.15);
        }

        .banner .banner-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .banner .banner-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f58a2e;
            font-size: 1.8rem;
            box-shadow: 0 4px 12px rgba(245, 138, 46, 0.1);
        }

        .banner .banner-details h2 {
            font-size: 1.2rem;
            color: #2d1f0c;
            font-weight: 700;
        }

        .banner .banner-details p {
            color: #8a765e;
            font-size: 0.85rem;
            margin-top: 0.1rem;
        }

        .banner .banner-badge {
            background: white;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #f58a2e;
            box-shadow: 0 2px 8px rgba(245, 138, 46, 0.08);
        }

        .banner .banner-badge i {
            margin-right: 0.4rem;
        }

        /* ===== SECTION HEADER ===== */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .section-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .section-header h3 i {
            color: #f58a2e;
        }

        .section-header .count-badge {
            background: #fcf3e8;
            color: #f58a2e;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            border: 1px solid rgba(245, 138, 46, 0.1);
        }

        .section-header .hint {
            font-size: 0.8rem;
            color: #b09a7e;
        }

        .section-header .hint i {
            color: #f58a2e;
        }

        /* ===== NOTICE ITEM ===== */
        .notice {
            background: white;
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(245, 138, 46, 0.06);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: all 0.3s;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .notice:hover {
            border-color: rgba(245, 138, 46, 0.15);
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            transform: translateX(4px);
        }

        .notice .notice-icon {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background: #fcf3e8;
            color: #f58a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-top: 0.1rem;
        }

        .notice .notice-content {
            flex: 1;
        }

        .notice .notice-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #2d1f0c;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .notice .notice-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.6rem;
            padding-top: 0.5rem;
            border-top: 1px solid #f0e2d2;
        }

        .notice .notice-footer .date {
            color: #b09a7e;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .notice .notice-footer .date i {
            color: #f58a2e;
            font-size: 0.7rem;
        }

        .notice .notice-footer .notice-id {
            color: #d5c8b8;
            font-size: 0.65rem;
            font-weight: 500;
        }

        /* ===== NOTICE NUMBERING ===== */
        .notice-number {
            font-size: 0.7rem;
            font-weight: 700;
            color: #b09a7e;
            background: #fcfaf7;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            border: 1px solid #f0e2d2;
        }

        /* ===== EMPTY STATE ===== */
        .empty {
            background: white;
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            color: #b09a7e;
            border: 1px solid rgba(245, 138, 46, 0.06);
        }

        .empty i {
            font-size: 3.5rem;
            color: #f0e2d2;
            display: block;
            margin-bottom: 0.8rem;
        }

        .empty h4 {
            color: #2d1f0c;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .empty p {
            color: #b09a7e;
            font-size: 0.95rem;
        }

        .empty .empty-hint {
            margin-top: 0.8rem;
            color: #d5c8b8;
            font-size: 0.85rem;
        }

        .empty .empty-hint i {
            font-size: 0.85rem;
            color: #f58a2e;
            display: inline;
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 3rem 2rem;
        }

        .loading i {
            font-size: 2.5rem;
            color: #f58a2e;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            color: #b09a7e;
            margin-top: 0.8rem;
            font-weight: 500;
        }

        /* ===== ERROR ===== */
        .error {
            text-align: center;
            padding: 3rem 2rem;
            color: #b53b2e;
            background: #fce4e0;
            border-radius: 20px;
        }

        .error i {
            font-size: 2.5rem;
            color: #f5b7b1;
            display: block;
            margin-bottom: 0.8rem;
        }

        .error h4 {
            color: #b53b2e;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .error p {
            color: #8a3a2e;
        }

        /* ===== FOOTER ===== */
        .footer-note {
            margin-top: 2.5rem;
            border-top: 1px solid #f0e2d2;
            padding-top: 1.2rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            color: #b09a7e;
            font-size: 0.75rem;
        }

        .footer-note i {
            color: #f58a2e;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .page-header {
                padding: 1.2rem 1.2rem;
                flex-direction: column;
                align-items: flex-start;
            }
            .page-header h1 {
                font-size: 1.2rem;
            }
            .banner {
                padding: 1rem 1.2rem;
                flex-direction: column;
                text-align: center;
            }
            .banner .banner-info {
                flex-direction: column;
                text-align: center;
            }
            .banner .banner-icon {
                width: 44px;
                height: 44px;
                font-size: 1.3rem;
            }
            .banner .banner-details h2 {
                font-size: 1rem;
            }
            .notice {
                flex-direction: column;
                padding: 1rem 1.2rem;
            }
            .notice .notice-icon {
                align-self: center;
            }
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            .page-header .actions .btn-action {
                font-size: 0.7rem;
                padding: 0.3rem 0.7rem;
            }
            .notice .notice-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }
        }

        /* ===== ANIMATIONS ===== */
        .notice {
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f58a2e">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sunshine">
  <script src="pwa.js" defer></script>
</head>

<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="page-header">
        <div>
            <h1>
                <i class="fas fa-bullhorn"></i>
                Notice Board
            </h1>
            <div class="header-sub">
                <i class="fas fa-info-circle"></i>
                Stay updated with latest announcements
            </div>
        </div>
        <div class="actions">
            <button class="btn-action btn-secondary" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </div>
    </div>

    <!-- ===== BANNER ===== -->
    <div class="banner">
        <div class="banner-info">
            <div class="banner-icon">
                <i class="fas fa-bullhorn"></i>
            </div>
            <div class="banner-details">
                <h2>School Notice Board</h2>
                <p><i class="fas fa-edit"></i> All important announcements and updates</p>
            </div>
        </div>
        <div class="banner-badge">
            <i class="fas fa-clock"></i> Live Updates
        </div>
    </div>

    <!-- ===== SECTION HEADER ===== -->
    <div class="section-header">
        <h3>
            <i class="fas fa-list"></i>
            All Notices
            <span class="count-badge" id="noticeCount">0</span>
        </h3>
        <span class="hint">
            <i class="fas fa-hand-pointer"></i>
            Latest announcements from the school
        </span>
    </div>

    <!-- ===== NOTICE CONTAINER ===== -->
    <div id="noticeContainer">
        <div class="loading">
            <i class="fas fa-circle-notch"></i>
            <p>Loading notices...</p>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer-note">
        <span><i class="fas fa-school"></i> Sunshine School · est. 2006</span>
        <span><i class="fas fa-bullhorn"></i> notice board</span>
    </div>

</div>


<script>

// ==========================================
// ALL LOGIC REMAINS EXACTLY THE SAME
// ==========================================

const API = "https://sunshine-vtal.onrender.com";

async function loadNotices() {
    const container = document.getElementById("noticeContainer");

    try {
        const response = await fetch(`${API}/api/notices`);
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to fetch notices.");
        }

        const notices = data.notices || [];

        // Update count
        document.getElementById("noticeCount").textContent = notices.length;

        if (!notices.length) {
            container.innerHTML = `
                <div class="empty">
                    <i class="fas fa-bullhorn"></i>
                    <h4>No Notices Available</h4>
                    <p>There are no announcements at the moment.</p>
                    <div class="empty-hint">
                        <i class="fas fa-info-circle"></i> Check back later for updates
                    </div>
                </div>
            `;
            return;
        }

        // Sort notices by createdAt (newest first)
        notices.sort((a, b) => {
            return new Date(b.createdAt) - new Date(a.createdAt);
        });

        container.innerHTML = notices.map((notice, index) => {
            const date = notice.createdAt
                ? new Date(notice.createdAt).toLocaleString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })
                : "";

            const noticeText = notice.notice || notice.message || "";

            return `
                <div class="notice" style="animation-delay: ${index * 0.05}s;">
                    <div class="notice-icon">
                        <i class="fas fa-bullhorn"></i>
                    </div>
                    <div class="notice-content">
                        <div class="notice-text">
                            ${escapeHtml(noticeText)}
                        </div>
                        <div class="notice-footer">
                            <div class="date">
                                <i class="fas fa-clock"></i>
                                ${date || "Date not available"}
                            </div>
                            <div class="notice-id">
                                <i class="fas fa-hashtag"></i>
                                Notice #${index + 1}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join("");

    } catch (error) {
        console.error(error);
        container.innerHTML = `
            <div class="error">
                <i class="fas fa-exclamation-triangle"></i>
                <h4>Unable to Load Notices</h4>
                <p>${escapeHtml(error.message)}</p>
            </div>
        `;
    }
}

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadNotices();

</script>

</body>
</html>
