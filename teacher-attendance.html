<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Attendance · Sunshine School</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f7f3ed;
            padding: 1.5rem;
            color: #2d1f0c;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            background: linear-gradient(135deg, #f58a2e, #f9b042);
            border-radius: 32px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 8px 30px rgba(245, 138, 46, 0.2);
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }

        .page-header .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 1;
        }

        .page-header .header-left .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .page-header .header-left .header-text h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.1rem;
        }

        .page-header .header-left .header-text p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
        }

        .page-header .header-left .header-text p i {
            margin-right: 0.3rem;
        }

        .page-header .header-right {
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 0.45rem 1.1rem;
            border-radius: 30px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .header-badge i {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* ===== CARD ===== */
        .card {
            background: white;
            border-radius: 24px;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(245, 138, 46, 0.06);
            margin-bottom: 1.5rem;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: rgba(245, 138, 46, 0.12);
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #2d1f0c;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px solid #fcf3e8;
        }

        .section-title i {
            color: #f58a2e;
        }

        .section-title .title-badge {
            background: #fcf3e8;
            color: #f58a2e;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-left: auto;
        }

        /* ===== TOP CONTROLS ===== */
        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            align-items: flex-end;
            justify-content: space-between;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .field label {
            font-size: 0.7rem;
            color: #b09a7e;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .field label i {
            color: #f58a2e;
            margin-right: 0.3rem;
        }

        input[type="date"],
        select,
        input[type="time"] {
            padding: 0.65rem 0.9rem;
            border: 1px solid #f0e2d2;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #fcfaf7;
            color: #2d1f0c;
            font-weight: 600;
            transition: all 0.2s;
            outline: none;
            font-family: inherit;
        }

        input[type="date"]:focus,
        select:focus,
        input[type="time"]:focus {
            border-color: #f58a2e;
            background: white;
            box-shadow: 0 0 0 3px rgba(245, 138, 46, 0.1);
        }

        input[type="time"]:disabled {
            background: #f5f0ea;
            color: #b09a7e;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ===== SEARCH BOX ===== */
        .search-field {
            flex: 1 1 240px;
            min-width: 200px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i.fa-magnifying-glass {
            position: absolute;
            left: 0.9rem;
            color: #b09a7e;
            font-size: 0.8rem;
            pointer-events: none;
        }

        .search-box input[type="text"] {
            width: 100%;
            padding: 0.65rem 2.2rem 0.65rem 2.2rem;
            border: 1px solid #f0e2d2;
            border-radius: 10px;
            font-size: 0.9rem;
            background: #fcfaf7;
            color: #2d1f0c;
            font-weight: 600;
            transition: all 0.2s;
            outline: none;
            font-family: inherit;
        }

        .search-box input[type="text"]:focus {
            border-color: #f58a2e;
            background: white;
            box-shadow: 0 0 0 3px rgba(245, 138, 46, 0.1);
        }

        .search-box .clear-search {
            position: absolute;
            right: 0.7rem;
            border: none;
            background: none;
            color: #b09a7e;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0.2rem;
            display: none;
        }

        .search-box .clear-search:hover {
            color: #f58a2e;
        }

        .search-box.has-value .clear-search {
            display: inline-flex;
        }

        .search-count {
            font-size: 0.7rem;
            color: #b09a7e;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        /* ===== BUTTONS ===== */
        .btn {
            border: none;
            border-radius: 60px;
            padding: 0.7rem 1.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: 0.2px;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f58a2e, #f9b042);
            color: white;
            box-shadow: 0 4px 12px rgba(245, 138, 46, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(245, 138, 46, 0.4);
        }

        .btn-secondary {
            background: #fcf3e8;
            color: #f58a2e;
            border: 1px solid #f0e2d2;
        }

        .btn-secondary:hover {
            background: #f9e6d2;
            border-color: #f9b042;
        }

        /* ===== MARK ALL ===== */
        .mark-all {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.75rem;
            color: #b09a7e;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .mark-all i {
            color: #f58a2e;
            margin-right: 0.2rem;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #f0e2d2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #fcf3e8;
        }

        th {
            text-align: left;
            padding: 0.7rem 1rem;
            color: #b09a7e;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 700;
            white-space: nowrap;
        }

        th i {
            color: #f58a2e;
            margin-right: 0.3rem;
            font-size: 0.65rem;
        }

        td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #f0e2d2;
            font-size: 0.85rem;
            color: #2d1f0c;
            vertical-align: middle;
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: #fcf9f4;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .teacher-name {
            font-weight: 700;
            color: #2d1f0c;
            display: block;
        }

        .teacher-name mark {
            background: #fde3b8;
            color: #7a4a12;
            border-radius: 3px;
            padding: 0 2px;
        }

        .teacher-id {
            color: #b09a7e;
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* ===== STATUS BUTTONS ===== */
        .status-group {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .status-btn {
            border: 1px solid #f0e2d2;
            background: #fcfaf7;
            padding: 0.35rem 0.85rem;
            border-radius: 30px;
            font-size: 0.72rem;
            cursor: pointer;
            font-weight: 700;
            color: #b09a7e;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .status-btn:hover {
            border-color: #f9b042;
            background: #fcf9f4;
            transform: translateY(-1px);
        }

        .status-btn.active[data-status="Present"] {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border-color: #16a34a;
            color: white;
            box-shadow: 0 3px 8px rgba(22, 163, 74, 0.25);
        }

        .status-btn.active[data-status="Absent"] {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            border-color: #dc2626;
            color: white;
            box-shadow: 0 3px 8px rgba(220, 38, 38, 0.25);
        }

        .status-btn.active[data-status="Half Day"] {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            border-color: #d97706;
            color: white;
            box-shadow: 0 3px 8px rgba(217, 119, 6, 0.25);
        }

        /* ===== TIME INPUTS ===== */
        .time-inputs {
            display: flex;
            gap: 0.5rem;
        }

        .time-inputs input[type="time"] {
            width: 135px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 0.65rem 0.5rem 0.65rem 0.8rem;
            text-align: center;
            /* ensure AM/PM part stays visible */
            min-width: 135px;
            letter-spacing: 0.5px;
            -webkit-appearance: none;
            appearance: none;
        }

        /* Make the native time picker indicator always visible & not cut off */
        .time-inputs input[type="time"]::-webkit-calendar-picker-indicator {
            opacity: 0.6;
            cursor: pointer;
            padding: 2px;
            margin-left: 2px;
            flex-shrink: 0;
        }

        .time-inputs input[type="time"]::-webkit-datetime-edit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        .time-inputs input[type="time"]::-webkit-datetime-edit-ampm-field {
            font-weight: 700;
            color: #f58a2e;
            padding-left: 2px;
        }

        /* Firefox / other */
        .time-inputs input[type="time"]::-moz-focus-inner {
            border: 0;
        }

        /* ===== EMPTY / LOADING ===== */
        .empty,
        .loading {
            text-align: center;
            color: #b09a7e;
            padding: 2.5rem 1rem;
            font-size: 0.85rem;
        }

        .empty i,
        .loading i {
            font-size: 2rem;
            color: #f0e2d2;
            display: block;
            margin-bottom: 0.5rem;
        }

        .loading i {
            color: #f58a2e;
        }

        /* ===== SUBMIT BAR ===== */
        .submit-bar {
            position: sticky;
            bottom: 1rem;
            z-index: 50;
            margin-top: 1.5rem;
            display: flex;
            justify-content: flex-end;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            border: 1px solid rgba(245, 138, 46, 0.15);
            box-shadow: 0 8px 30px rgba(245, 138, 46, 0.15);
        }

        .submit-bar .btn-primary {
            padding: 0.85rem 2.5rem;
            font-size: 0.9rem;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 0.9rem 1.3rem;
            border-radius: 12px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 999;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.3s ease;
        }

        #toast.success {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        #toast.error {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            body {
                padding: 1rem;
            }

            .page-header {
                padding: 1.2rem 1.2rem;
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header .header-left .avatar {
                width: 48px;
                height: 48px;
                font-size: 1.4rem;
            }

            .page-header .header-left .header-text h1 {
                font-size: 1.2rem;
            }

            .card {
                padding: 1.2rem 1.2rem;
            }

            .top-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-field {
                width: 100%;
            }

            .time-inputs {
                flex-direction: column;
                gap: 0.3rem;
            }

            .time-inputs input[type="time"] {
                width: 100%;
                min-width: unset;
            }
        }

        @media (max-width: 550px) {
            .page-header .header-right {
                width: 100%;
            }

            .header-badge {
                width: 100%;
                justify-content: center;
            }

            th,
            td {
                padding: 0.6rem 0.7rem;
                font-size: 0.78rem;
            }

            .status-group {
                flex-direction: column;
            }

            .status-btn {
                width: 100%;
                justify-content: center;
            }

            .mark-all {
                flex-direction: column;
                align-items: stretch;
            }

            .submit-bar {
                bottom: 0.5rem;
                border-radius: 20px;
            }

            .submit-bar .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ===== PAGE HEADER ===== -->
        <div class="page-header">
            <div class="header-left">
                <div class="avatar">
                    <i class="fas fa-clipboard-check"></i>
                </div>
                <div class="header-text">
                    <h1>Teacher Attendance</h1>
                    <p><i class="fas fa-school"></i> Sunshine School · Staff Portal</p>
                </div>
            </div>
            <div class="header-right">
               <a href="teacher-attendance-view.html" class="header-link">
                 <div class="header-badge">
                    <i class="fas fa-pen-to-square"></i>
                    Mark & Submit
                </div>
               </a>
            </div>
        </div>

        <!-- ===== TOP CONTROLS ===== -->
        <div class="card">
            <div class="section-title">
                <i class="fas fa-sliders"></i>
                Attendance Controls
                <span class="title-badge">Setup</span>
            </div>

            <div class="top-controls">
                <div class="field">
                    <label for="attendanceDate">
                        <i class="fas fa-calendar-day"></i> Select Date
                    </label>
                    <input type="date" id="attendanceDate" />
                </div>

                <div class="field search-field">
                    <label for="teacherSearch">
                        <i class="fas fa-magnifying-glass"></i> Search Teacher
                    </label>
                    <div class="search-box" id="searchBox">
                        <i class="fas fa-magnifying-glass"></i>
                        <input type="text" id="teacherSearch" placeholder="Search by name, ID or department..." autocomplete="off" />
                        <button type="button" class="clear-search" id="clearSearch" title="Clear search">
                            <i class="fas fa-circle-xmark"></i>
                        </button>
                    </div>
                </div>

                <button class="btn btn-secondary" id="loadBtn">
                    <i class="fas fa-rotate"></i> Load Attendance
                </button>

                <div class="mark-all">
                    <span><i class="fas fa-bolt"></i> Mark all as:</span>
                    <button class="status-btn" data-mark-all="Present">
                        <i class="fas fa-check"></i> Present
                    </button>
                    <button class="status-btn" data-mark-all="Absent">
                        <i class="fas fa-times"></i> Absent
                    </button>
                    <button class="status-btn" data-mark-all="Half Day">
                        <i class="fas fa-clock"></i> Half Day
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== TEACHER TABLE ===== -->
        <div class="card">
            <div class="section-title">
                <i class="fas fa-users"></i>
                Teachers List
                <span class="title-badge" id="listBadge">Timimg -> 07:20 AM</span>
            </div>

            <div id="tableWrap">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    Loading teachers...
                </div>
            </div>
        </div>

        <!-- ===== SUBMIT BAR ===== -->
        <div class="submit-bar" id="submitBar" style="display:none;">
            <button class="btn btn-primary" id="submitBtn" style="display:none;">
                <i class="fas fa-paper-plane"></i> Submit Attendance
            </button>
        </div>

    </div>

    <div id="toast"></div>

    <script>
        // ==========================================
        // CONFIG
        // ==========================================
        const API_BASE = "https://sunshine-vtal.onrender.com"; // Change this to your server's base URL

        const dateInput = document.getElementById("attendanceDate");
        const tableWrap = document.getElementById("tableWrap");
        const submitBtn = document.getElementById("submitBtn");
        const submitBar = document.getElementById("submitBar");
        const loadBtn = document.getElementById("loadBtn");
        const toast = document.getElementById("toast");
        const teacherSearch = document.getElementById("teacherSearch");
        const searchBox = document.getElementById("searchBox");
        const clearSearch = document.getElementById("clearSearch");
        const listBadge = document.getElementById("listBadge");

        let teachers = [];
        // rowState keyed by teacher _id -> { status, inTime, outTime }
        let rowState = {};
        let searchTerm = "";
        const defaultBadgeText = listBadge.textContent;

        // Race-condition guards for loading saved attendance
        let loadSeq = 0;        // har naye load par badhta hai (purane response ignore karne ke liye)
        let loadedDate = null;  // jis date ka saved data successfully check ho chuka hai (found ya not-found)

        // Default date = today
        // Local date (toISOString UTC deta hai, jo subah 5:30 se pehle kal ki date de deta tha)
        (function setToday() {
            const n = new Date();
            const p = (x) => String(x).padStart(2, "0");
            dateInput.value = `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
        })();

        // ==========================================
        // HELPERS
        // ==========================================
        function showToast(message, type) {
            toast.innerHTML = `<i class="fas ${type === "success" ? "fa-check-circle" : "fa-exclamation-circle"}"></i> ${escapeHtml(message)}`;
            toast.className = type;
            toast.style.display = "flex";
            setTimeout(() => { toast.style.display = "none"; }, 2500);
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str || "";
            return div.innerHTML;
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        // Highlight the matched search term inside a name/id, safely
        // (escapes the value first, then wraps the match in <mark>)
        function highlightMatch(value, term) {
            const safeValue = escapeHtml(value || "");
            if (!term) return safeValue;
            const safeTerm = escapeRegExp(term);
            const regex = new RegExp(`(${safeTerm})`, "ig");
            return safeValue.replace(regex, "<mark>$1</mark>");
        }

        function statusIcon(status) {
            if (status === "Present") return "fa-check";
            if (status === "Absent") return "fa-times";
            return "fa-clock";
        }

        // Returns teachers matching the current search term
        // (matches on name, teacherId, employeeId, department)
        function getFilteredTeachers() {
            if (!searchTerm) return teachers;
            const q = searchTerm.trim().toLowerCase();
            if (!q) return teachers;

            return teachers.filter(t => {
                const haystack = [
                    t.name,
                    t.teacherId,
                    t.employeeId,
                    t.department
                ].filter(Boolean).join(" ").toLowerCase();
                return haystack.includes(q);
            });
        }

        // ==========================================
        // SYNC LIVE DOM TIME VALUES -> rowState
        // ==========================================
        function syncTimesFromDOM() {
            document.querySelectorAll(".in-time").forEach(input => {
                const id = input.dataset.teacherId;
                if (rowState[id]) rowState[id].inTime = input.value;
            });
            document.querySelectorAll(".out-time").forEach(input => {
                const id = input.dataset.teacherId;
                if (rowState[id]) rowState[id].outTime = input.value;
            });
        }

        // ==========================================
        // FETCH TEACHERS
        // ==========================================
        async function fetchTeachers() {
            tableWrap.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    Loading teachers...
                </div>
            `;

            try {
                const res = await fetch(`${API_BASE}/api/teachers`, { cache: "no-store" });
                const data = await res.json();

                if (!data.success) {
                    throw new Error(data.message || "Failed to load teachers");
                }

                teachers = data.teachers || [];

                if (teachers.length === 0) {
                    tableWrap.innerHTML = `
                        <div class="empty">
                            <i class="fas fa-user-slash"></i>
                            No teachers found.
                        </div>
                    `;
                    submitBtn.style.display = "none";
                    submitBar.style.display = "none";
                    return;
                }

                // Default state: Present, no times
                teachers.forEach(t => {
                    if (!rowState[t._id]) {
                        rowState[t._id] = { status: "Present", inTime: "", outTime: "" };
                    }
                });

                renderTable();
                submitBtn.style.display = "inline-flex";
                submitBar.style.display = "flex";

                // Page khulte hi saved attendance + times auto-load
                await loadExistingAttendance(true);

            } catch (err) {
                console.error(err);
                tableWrap.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-exclamation-triangle"></i>
                        Could not load teachers. Check server connection.
                    </div>
                `;
            }
        }

        // ==========================================
        // RENDER TABLE
        // ==========================================
        function renderTable() {
            const visibleTeachers = getFilteredTeachers();

            // Update the badge to show search result count when searching
            if (searchTerm) {
                listBadge.textContent = `${visibleTeachers.length} match${visibleTeachers.length === 1 ? "" : "es"}`;
            } else {
                listBadge.textContent = defaultBadgeText;
            }

            if (visibleTeachers.length === 0) {
                tableWrap.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-user-slash"></i>
                        No teachers match "${escapeHtml(searchTerm)}".
                    </div>
                `;
                return;
            }

            let html = `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th><i class="fas fa-user"></i> Teacher</th>
                                <th><i class="fas fa-building"></i> Department</th>
                                <th><i class="fas fa-circle-info"></i> Status</th>
                                <th><i class="fas fa-right-to-bracket"></i> In Time</th>
                                <th><i class="fas fa-right-from-bracket"></i> Out Time</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            visibleTeachers.forEach(t => {
                const state = rowState[t._id];
                const disabled = state.status === "Absent" ? "disabled" : "";
                const nameHtml = highlightMatch(t.name || "", searchTerm);
                const idHtml = highlightMatch(t.teacherId || t.employeeId || "", searchTerm);

                html += `
                    <tr data-teacher-id="${t._id}">
                        <td>
                            <span class="teacher-name">${nameHtml}</span>
                            <span class="teacher-id">${idHtml}</span>
                        </td>
                        <td>${escapeHtml(t.department || "-")}</td>
                        <td>
                            <div class="status-group">
                                ${renderStatusBtn(t._id, "Present", state.status)}
                                ${renderStatusBtn(t._id, "Absent", state.status)}
                                ${renderStatusBtn(t._id, "Half Day", state.status)}
                            </div>
                        </td>
                        <td>
                            <div class="time-inputs">
                                <input type="time" class="in-time" value="${state.inTime}" data-teacher-id="${t._id}" ${disabled} />
                            </div>
                        </td>
                        <td>
                            <div class="time-inputs">
                                <input type="time" class="out-time" value="${state.outTime}" data-teacher-id="${t._id}" ${disabled} />
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
            tableWrap.innerHTML = html;

            attachRowListeners();
        }

        function renderStatusBtn(teacherId, status, currentStatus) {
            const active = status === currentStatus ? "active" : "";
            return `<button type="button" class="status-btn ${active}" data-status="${status}" data-teacher-id="${teacherId}">
                        <i class="fas ${statusIcon(status)}"></i> ${status}
                    </button>`;
        }

        // ==========================================
        // ATTACH LISTENERS
        // ==========================================
        function attachRowListeners() {
            document.querySelectorAll(".status-btn[data-teacher-id]").forEach(btn => {
                btn.addEventListener("click", () => {
                    syncTimesFromDOM();

                    const teacherId = btn.dataset.teacherId;
                    const status = btn.dataset.status;
                    rowState[teacherId].status = status;

                    if (status === "Absent") {
                        rowState[teacherId].inTime = "";
                        rowState[teacherId].outTime = "";
                    }

                    renderTable();
                });
            });

            document.querySelectorAll(".in-time").forEach(input => {
                input.addEventListener("input", (e) => {
                    rowState[e.target.dataset.teacherId].inTime = e.target.value;
                });
            });

            document.querySelectorAll(".out-time").forEach(input => {
                input.addEventListener("input", (e) => {
                    rowState[e.target.dataset.teacherId].outTime = e.target.value;
                });
            });
        }

        // ==========================================
        // SEARCH HANDLERS
        // ==========================================
        teacherSearch.addEventListener("input", (e) => {
            syncTimesFromDOM();
            searchTerm = e.target.value;
            searchBox.classList.toggle("has-value", searchTerm.length > 0);
            renderTable();
        });

        clearSearch.addEventListener("click", () => {
            syncTimesFromDOM();
            searchTerm = "";
            teacherSearch.value = "";
            searchBox.classList.remove("has-value");
            teacherSearch.focus();
            renderTable();
        });

        // ==========================================
        // MARK-ALL BUTTONS
        // ==========================================
        document.querySelectorAll("[data-mark-all]").forEach(btn => {
            btn.addEventListener("click", () => {
                syncTimesFromDOM();
                const status = btn.dataset.markAll;
                // Mark-all only affects the teachers currently visible
                // (respects an active search filter)
                getFilteredTeachers().forEach(t => {
                    rowState[t._id].status = status;
                    if (status === "Absent") {
                        rowState[t._id].inTime = "";
                        rowState[t._id].outTime = "";
                    }
                });
                renderTable();
            });
        });

        // ==========================================
        // LOAD EXISTING ATTENDANCE
        // ==========================================
        // Sab teachers ko default (Present, no time) par reset karo
        function resetRowState() {
            teachers.forEach(t => {
                rowState[t._id] = { status: "Present", inTime: "", outTime: "" };
            });
        }

        // Selected date ka saved attendance (status + in/out time) form me bhar do.
        // silent = true -> koi toast nahi (auto-load ke time)
        async function loadExistingAttendance(silent) {
            const date = dateInput.value;
            if (!date || teachers.length === 0) return;

            const seq = ++loadSeq;
            loadedDate = null; // jab tak load confirm na ho, submit block rahega

            try {
                const res = await fetch(`${API_BASE}/api/teacher-attendance/${date}`, { cache: "no-store" });
                const data = await res.json();

                // Beech me date badal gayi / naya load shuru ho gaya -> ye purana response ignore karo
                if (seq !== loadSeq) return;

                // 200 = mil gaya, 404 = us date ka record hi nahi hai. Baaki sab error hai.
                if (res.status !== 200 && res.status !== 404) {
                    throw new Error(data.message || "Server error");
                }

                resetRowState();

                if (data.success) {
                    const saved = data.attendance.teachers || [];
                    saved.forEach(entry => {
                        const id = entry.teacher;
                        if (rowState[id]) {
                            rowState[id] = {
                                status: entry.status,
                                inTime: entry.inTime || "",
                                outTime: entry.outTime || ""
                            };
                        }
                    });
                    if (!silent) showToast("Existing attendance loaded.", "success");
                } else if (!silent) {
                    showToast(data.message || "No existing attendance for this date.", "error");
                }

                loadedDate = date;
                renderTable();

            } catch (err) {
                if (seq !== loadSeq) return;
                console.error(err);
                // Silent ho tab bhi dikhao: load fail hua to submit karne se purana data overwrite ho sakta hai
                showToast("Saved attendance load nahi hui. Page refresh karo, tab tak submit band hai.", "error");
            }
        }

        loadBtn.addEventListener("click", () => loadExistingAttendance(false));

        // Date badalte hi us date ka saved data (times ke saath) apne aap aa jaye
        dateInput.addEventListener("change", () => loadExistingAttendance(true));

        // ==========================================
        // SUBMIT ATTENDANCE
        // ==========================================
        submitBtn.addEventListener("click", async () => {
            syncTimesFromDOM();

            const date = dateInput.value;
            if (!date) {
                showToast("Please select a date.", "error");
                return;
            }

            // Saved data (in/out time) load hone se pehle submit karoge to blank se overwrite ho sakta hai
            if (loadedDate !== date) {
                showToast("Is date ki saved attendance abhi load nahi hui. 1-2 second ruk kar dobara submit karo.", "error");
                return;
            }

            const payload = {
                date,
                teachers: teachers.map(t => ({
                    teacher: t._id,
                    teacherId: t.teacherId || "",
                    employeeId: t.employeeId || "",
                    name: t.name || "",
                    department: t.department || "",
                    status: rowState[t._id].status,
                    inTime: rowState[t._id].inTime,
                    outTime: rowState[t._id].outTime
                }))
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Submitting...`;

            try {
                const res = await fetch(`${API_BASE}/api/teacher-attendance`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!data.success) {
                    throw new Error(data.message || "Failed to save attendance.");
                }

                showToast("Attendance submitted successfully!", "success");

            } catch (err) {
                console.error(err);
                showToast(err.message || "Something went wrong.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fas fa-paper-plane"></i> Submit Attendance`;
            }
        });

        // ==========================================
        // INIT
        // ==========================================
        fetchTeachers();
    </script>

</body>

</html>
