<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>  · Teacher Panel</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f7f3ed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    /* ---------- top bar ---------- */
    .topbar {
      background: linear-gradient(135deg, #f9b042, #f58a2e);
      padding: 0.8rem 2rem;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      box-shadow: 0 8px 24px rgba(245, 138, 46, 0.15);
      margin-bottom: 2rem;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .topbar-brand i {
      background: rgba(255,255,255,0.2);
      padding: 0.4rem 0.6rem;
      border-radius: 30px;
      font-size: 1.6rem;
    }

    .topbar-brand span {
      font-weight: 300;
      opacity: 0.9;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .teacher-badge {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logout-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* ---------- main layout ---------- */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.8rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    /* sidebar */
    .sidebar {
      background: white;
      border-radius: 32px;
      padding: 2rem 1.2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.02);
      border: 1px solid rgba(245, 138, 46, 0.06);
      height: fit-content;
      position: sticky;
      top: 1.5rem;
    }

    .sidebar-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #b8a58b;
      font-weight: 700;
      margin-bottom: 1.8rem;
      padding-left: 0.5rem;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 60px;
      color: #4d3e2b;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .sidebar-nav a i {
      width: 1.8rem;
      color: #b8a58b;
      transition: color 0.2s;
      text-align: center;
      font-size: 1.05rem;
    }

    .sidebar-nav a:hover {
      background: #fcf3e8;
      border-color: #f9dbb8;
      color: #f58a2e;
    }
    .sidebar-nav a:hover i { color: #f58a2e; }

    .sidebar-nav a.active {
      background: linear-gradient(135deg, #fcf3e8, #fef7ef);
      border-color: #f9b042;
      color: #d97d22;
      box-shadow: 0 4px 12px rgba(245,138,46,0.06);
    }
    .sidebar-nav a.active i { color: #f58a2e; }

    .sidebar-divider {
      height: 1px;
      background: linear-gradient(to right, #f0e2d2, transparent);
      margin: 1.2rem 0.5rem;
    }

    /* main content */
    .main-content {
      background: white;
      border-radius: 32px;
      padding: 2rem 2.2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.02);
      border: 1px solid rgba(245, 138, 46, 0.06);
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .page-header h2 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #2d1f0c;
    }
    .page-header h2 i {
      color: #f58a2e;
      margin-right: 0.6rem;
    }

    .page-header .sub {
      background: #fcf3e8;
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      font-size: 0.85rem;
      color: #7f6a4b;
    }

    /* info cards */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .info-item {
      background: #fcf9f4;
      border-radius: 20px;
      padding: 0.9rem 1.2rem;
      border: 1px solid rgba(245,138,46,0.04);
      display: flex;
      flex-direction: column;
    }

    .info-item .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #b09a7e;
      font-weight: 600;
    }

    .info-item .value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2d1f0c;
      margin-top: 0.2rem;
      word-break: break-word;
    }

    .info-item .value i {
      color: #f58a2e;
      margin-right: 0.3rem;
      font-size: 0.9rem;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #2d1f0c;
      margin: 2rem 0 1rem 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .section-title i {
      color: #f58a2e;
    }

    /* ===== SYLLABUS (assigned class) ===== */
    .syllabus-class-block {
      background: #fcf9f4;
      border: 1px solid #f0e2d2;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
    }
    .syllabus-class-block > h3 {
      color: #2d1f0c;
      font-size: 1.05rem;
      margin-bottom: .8rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .syllabus-class-block > h3 i {
      color: #f58a2e;
    }
    .syllabus-term-block {
      background: white;
      border-radius: 12px;
      padding: .8rem 1rem;
      margin-bottom: .7rem;
      border: 1px solid rgba(245,138,46,.06);
    }
    .syllabus-term-block h4 {
      font-size: .9rem;
      color: #2d1f0c;
      margin-bottom: .5rem;
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .syllabus-term-block h4 i {
      color: #f58a2e;
    }
    .syllabus-term-item {
      padding: .4rem 0;
      border-bottom: 1px dashed #f0e2d2;
      font-size: .85rem;
      color: #4a3c26;
    }
    .syllabus-term-item:last-child { border-bottom: none; }
    .syllabus-term-item strong { color: #2d1f0c; }
    .syllabus-empty-note {
      color: #a68a5e;
      font-size: .8rem;
      padding: .3rem 0;
    }

    /* Class Cards - Clickable */
    .class-card {
      background: #fcf9f4;
      border-radius: 24px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
      border-left: 6px solid #f9b042;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .class-card:hover {
      background: #fefcf9;
      box-shadow: 0 4px 20px rgba(245,138,46,0.12);
      transform: translateX(6px);
      border-left-color: #f58a2e;
    }

    .class-card:active {
      transform: scale(0.98);
    }

    .class-card .click-hint {
      position: absolute;
      right: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: #b09a7e;
      font-size: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .class-card:hover .click-hint {
      opacity: 1;
    }

    .class-card h3 {
      font-size: 1.05rem;
      color: #2d1f0c;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .class-card h3 i {
      color: #f58a2e;
      font-size: 1rem;
    }

    .class-card .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #4d3e2b;
    }

    .class-card .meta span {
      background: white;
      padding: 0.2rem 0.9rem;
      border-radius: 60px;
      border: 1px solid #f0e2d2;
      font-weight: 500;
    }

    .class-card .meta i {
      color: #f58a2e;
      margin-right: 0.3rem;
    }

    .class-card .arrow-icon {
      color: #f58a2e;
      font-size: 1rem;
      margin-left: auto;
    }

    .perm-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.2rem;
      background: #fcf9f4;
      padding: 1rem 1.5rem;
      border-radius: 24px;
    }

    .perm-grid .perm-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
      color: #3d2e1b;
      font-size: 0.9rem;
    }

    .perm-grid .perm-item i {
      font-size: 0.9rem;
    }

    .perm-grid .perm-item .allowed { color: #2b8c4a; }
    .perm-grid .perm-item .denied { color: #b06b6b; }

    .profile-detail {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2.5rem;
      background: #fcf9f4;
      padding: 1.2rem 1.8rem;
      border-radius: 24px;
    }

    .profile-detail p {
      font-weight: 500;
      color: #2d1f0c;
    }

    .profile-detail p i {
      color: #f58a2e;
      width: 1.6rem;
    }

    .footer-note {
      margin-top: 2.5rem;
      border-top: 1px solid #f0e2d2;
      padding-top: 1.2rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      color: #b09a7e;
      font-size: 0.8rem;
    }

    .footer-note i { color: #f58a2e; }

    /* responsive */
    @media (max-width: 820px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .sidebar-nav { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .sidebar-nav a { flex: 1 0 auto; justify-content: center; padding: 0.5rem 1rem; font-size: 0.8rem; }
      .sidebar-title { text-align: center; }
      body { padding: 1rem; }
      .main-content { padding: 1.5rem; }
    }

    @media (max-width: 480px) {
      .topbar { padding: 0.6rem 1rem; }
      .topbar-brand { font-size: 1.2rem; }
      .info-grid { grid-template-columns: 1fr 1fr; }
      .class-card .click-hint { display: none; }
    }
  </style>
</head>

<div class="section-title" style="margin-top:2rem;">
  <i class="fas fa-calendar-check"></i> My Attendance

    <div class="section-title" style="margin-top:2rem;">

<!-- ========== SCRIPT ========== -->
<script>
  (function() {
    // Set current date
    const now = new Date();
    document.getElementById('currentDate').textContent = now.toLocaleDateString('en-IN', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });

    // ---- ORIGINAL LOGIC (100% preserved, only UI presentation enhanced) ----
    const teacherData = JSON.parse(localStorage.getItem("loggedInTeacher"));

    if (!teacherData) {
      window.location.href = "index.html";
      return;
    }

    const container = document.getElementById('dynamicTeacherPanel');

    // ---- Helper: Get class page URL ----
    // ---- Helper: Get class page URL ----
// SAME URL SYSTEM AS admin.html
function getClassPageUrl(className) {
  if (!className) return '#';

  const encodedName = encodeURIComponent(
    String(className).trim()
  );

  return `class.html?class=${encodedName}`;
}
    // ---- Helper: Get display name for class ----
    function getClassDisplayName(className) {
      if (!className) return 'N/A';
      if (['Nursery', 'LKG', 'UKG'].includes(className)) {
        return className;
      }
      return `Class ${className}`;
    }

    // ---- helper to build the UI from teacherData ----
    function renderTeacherPanel(data) {
      let html = '';

      // ---------- INFO GRID (basic info) ----------
      html += `<div class="info-grid">`;
      const fields = [
        { label: 'Teacher ID', key: 'teacherId', icon: 'fa-id-badge' },
        { label: 'Employee ID', key: 'employeeId', icon: 'fa-user-tie' },
        { label: 'Name', key: 'name', icon: 'fa-user' },
        { label: "Father's Name", key: 'fatherName', icon: 'fa-person' },
        { label: "Department", key: 'department', icon: 'fa-building' },
        { label: "Mother's Name", key: 'motherName', icon: 'fa-person-dress' },
        { label: "Husband's Name", key: 'husbandName', icon: 'fa-ring' },
        { label: 'Email', key: 'email', icon: 'fa-envelope' },
        { label: 'Phone', key: 'phone', icon: 'fa-phone' },
        { label: 'Gender', key: 'gender', icon: 'fa-venus-mars' },
        { label: 'Qualification', key: 'qualification', icon: 'fa-graduation-cap' },
        { label: 'Joining Date', key: 'joiningDate', icon: 'fa-calendar-plus', date: true },
        { label: 'Status', key: 'status', icon: 'fa-circle-check' }
      ];

      fields.forEach(f => {
        let val = data[f.key] || '-';
        if (f.date && val !== '-') {
          try { val = new Date(val).toLocaleDateString(); } catch(e){}
        }
        html += `
          <div class="info-item">
            <span class="label"><i class="fas ${f.icon}" style="margin-right:4px; color:#f58a2e;"></i> ${f.label}</span>
            <span class="value">${val}</span>
          </div>
        `;
      });
      html += `</div>`;

      // ---------- ASSIGNED CLASSES (Clickable) ----------
      html += `<div class="section-title"><i class="fas fa-chalkboard"></i> Assigned Classes & Subjects</div>`;
      html += `<p style="color:#7f6a4b;font-size:0.85rem;margin-bottom:1rem;"><i class="fas fa-info-circle" style="color:#f58a2e;"></i> Click on any class to view its students</p>`;

      if (data.assignedClasses && data.assignedClasses.length > 0) {
        data.assignedClasses.forEach((item, idx) => {
          const sections = (item.sections && item.sections.length) ? item.sections.join(', ') : '-';
          const subjects = (item.subjects && item.subjects.length) ? item.subjects.join(', ') : '-';
          const className = item.class || 'N/A';
          const displayName = getClassDisplayName(className);
          const pageUrl = getClassPageUrl(className);

          html += `
            <div class="class-card" onclick="window.location.href='${pageUrl}'" title="Click to view ${displayName} students">
              <h3>
                <i class="fas fa-layer-group"></i> ${displayName}
                <i class="fas fa-arrow-right arrow-icon"></i>
              </h3>
              <div class="meta">
                <span><i class="fas fa-users"></i> Sections: ${sections}</span>
                <span><i class="fas fa-book"></i> Subjects: ${subjects}</span>
              </div>
              <span class="click-hint"><i class="fas fa-hand-pointer"></i> Click to view</span>
            </div>
          `;
        });
      } else {
        html += `<p style="color:#7f6a4b; padding:0.5rem 0;"><i class="fas fa-info-circle" style="color:#f58a2e;"></i> No classes assigned.</p>`;
      }

      // ---------- PERMISSIONS ----------
      html += `<div class="section-title" style="margin-top:2rem;"><i class="fas fa-lock"></i> Permissions</div>`;
      if (data.permissions) {
        html += `<div class="perm-grid">`;
        Object.entries(data.permissions).forEach(([perm, value]) => {
          const icon = value ? 'fa-check-circle allowed' : 'fa-circle-xmark denied';
          const label = value ? 'Allowed' : 'Not Allowed';
          html += `
            <div class="perm-item">
              <i class="fas ${icon}"></i>
              <span>${perm}: <strong style="font-weight:600;">${label}</strong></span>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<p style="color:#7f6a4b;"><i class="fas fa-info-circle" style="color:#f58a2e;"></i> No permissions defined.</p>`;
      }

      // ---------- PROFILE (address, blood group) ----------
      html += `<div class="section-title" style="margin-top:2rem;"><i class="fas fa-address-card"></i> Profile</div>`;
      const address = data.profile?.address || '-';
      const blood = data.profile?.bloodGroup || '-';
      html += `
        <div class="profile-detail">
          <p><i class="fas fa-home"></i> Address: ${address}</p>
          <p><i class="fas fa-droplet"></i> Blood Group: ${blood}</p>
        </div>
      `;

      return html;
    }

    // render the enhanced UI
    container.innerHTML = renderTeacherPanel(teacherData);

    // ======================================================
// LOGGED-IN TEACHER ATTENDANCE
// ======================================================

const attendanceDateInput =
  document.getElementById("teacherAttendanceDate");

const attendanceBtn =
  document.getElementById("loadTeacherAttendance");

const attendanceResult =
  document.getElementById("teacherAttendanceResult");

const API_BASE = "https://sunshine-swp6.onrender.com"; // Change this to your actual API URL

// Default date = today
attendanceDateInput.value = new Date().toISOString().slice(0, 10);


// Escape HTML
function escapeAttendanceHtml(value) {
  const div = document.createElement("div");
  div.textContent = value ?? "";
  return div.innerHTML;
}


// Load only logged-in teacher attendance
async function loadMyAttendance(date) {

  if (!date) {
    attendanceResult.innerHTML = `
      <p style="color:#b06b6b;padding:1rem 0;">
        Please select a date.
      </p>
    `;
    return;
  }

  attendanceResult.innerHTML = `
    <div style="text-align:center;padding:1.5rem;color:#b09a7e;">
      <i class="fas fa-spinner fa-spin"></i>
      Loading attendance...
    </div>
  `;

  try {

    // Logged-in teacher details
    const loggedTeacher =
      JSON.parse(localStorage.getItem("loggedInTeacher"));

    if (!loggedTeacher) {
      window.location.href = "index.html";
      return;
    }

    const loggedTeacherId =
      String(loggedTeacher.teacherId || "").trim();

    const loggedEmployeeId =
      String(loggedTeacher.employeeId || "").trim();

    const loggedTeacherName =
      String(loggedTeacher.name || "").trim();


    // Fetch attendance for selected date
    const res = await fetch(
      `${API_BASE}/api/teacher-attendance/${date}`
    );

    const data = await res.json();

      return;
    }


    // All teachers attendance from backend
    const teachers = data.attendance.teachers || [];


    // ==================================================
    // IMPORTANT:
    // Match ONLY logged-in teacher
    // ==================================================

    const myAttendance = teachers.find(t => {

      const attendanceTeacherId =
        String(t.teacherId || "").trim();

      const attendanceEmployeeId =
        String(t.employeeId || "").trim();

      const attendanceName =
        String(t.name || "").trim();


      // First priority: Teacher ID
      if (
        loggedTeacherId &&
        attendanceTeacherId &&
        loggedTeacherId === attendanceTeacherId
      ) {
        return true;
      }

      // Second priority: Employee ID
      if (
        loggedEmployeeId &&
        attendanceEmployeeId &&
        loggedEmployeeId === attendanceEmployeeId
      ) {
        return true;
      }

      return false;
    });


    if (!myAttendance) {

      attendanceResult.innerHTML = `
        <div style="
          background:#fcf9f4;
          border-radius:20px;
          padding:1.5rem;
          text-align:center;
          color:#7f6a4b;
        ">
          <i class="fas fa-calendar-xmark"
             style="color:#f58a2e;font-size:1.5rem;"></i>

          <div style="margin-top:0.5rem;font-weight:600;">
            No attendance found for you on this date.
          </div>
        </div>
      `;

      return;
    }


    // ==================================================
    // SHOW ONLY THIS TEACHER
    // ==================================================

    const status = myAttendance.status || "-";

    let statusColor = "#f58a2e";

    if (status === "Present") {
      statusColor = "#2b8c4a";
    } else if (status === "Absent") {
      statusColor = "#c94c4c";
    }


    attendanceResult.innerHTML = `
      <div style="
        background:#fcf9f4;
        border-radius:24px;
        padding:1.3rem 1.5rem;
        border-left:6px solid ${statusColor};
      ">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          flex-wrap:wrap;
          gap:1rem;
        ">

          <div>
            <h3 style="
              color:#2d1f0c;
              font-size:1.1rem;
              margin-bottom:0.4rem;
            ">
              <i class="fas fa-user-check"
                 style="color:#f58a2e;"></i>
              ${escapeAttendanceHtml(myAttendance.name || loggedTeacherName)}
            </h3>

            <div style="
              color:#7f6a4b;
              font-size:0.85rem;
            ">
              Teacher ID:
              ${escapeAttendanceHtml(
                myAttendance.teacherId ||
                loggedTeacherId ||
                "-"
              )}
            </div>
          </div>


          <span style="
            background:${statusColor};
            color:white;
            padding:0.45rem 1rem;
            border-radius:60px;
            font-size:0.85rem;
            font-weight:700;
          ">
            ${escapeAttendanceHtml(status)}
          </span>

        </div>


        <div class="info-grid" style="margin-top:1rem;margin-bottom:0;">

          <div class="info-item">
            <span class="label">
              <i class="fas fa-right-to-bracket"
                 style="color:#f58a2e;"></i>
              In Time
            </span>

            <span class="value">
              ${escapeAttendanceHtml(myAttendance.inTime || "-")}
            </span>
          </div>


          <div class="info-item">
            <span class="label">
              <i class="fas fa-right-from-bracket"
                 style="color:#f58a2e;"></i>
              Out Time
            </span>

            <span class="value">
              ${escapeAttendanceHtml(myAttendance.outTime || "-")}
            </span>
          </div>


          <div class="info-item">
            <span class="label">
              <i class="fas fa-calendar"
                 style="color:#f58a2e;"></i>
              Date
            </span>

            <span class="value">
              ${new Date(date).toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric"
              })}
            </span>
          </div>

        </div>

      </div>
    `;

  } catch (error) {

    console.error("Teacher attendance error:", error);

    attendanceResult.innerHTML = `
      <div style="
        background:#fff5f5;
        padding:1rem;
        border-radius:16px;
        color:#c94c4c;
      ">
        <i class="fas fa-triangle-exclamation"></i>
        Could not load attendance.
      </div>
    `;
  }
}

<!-- ===== SYLLABUS FOR ASSIGNED CLASS(ES) ===== -->
<script>
  (function() {

    const API_BASE = "https://sunshine-swp6.onrender.com"; // Change this to your actual API URL

    const SYLLABUS_TERMS = [
      { key: "unit1",      label: "Unit 1",      icon: "fa-1" },
      { key: "unit2",      label: "Unit 2",      icon: "fa-2" },
      { key: "halfYearly", label: "Half Yearly", icon: "fa-calendar-check" },
      { key: "unit3",      label: "Unit 3",      icon: "fa-3" },
      { key: "unit4",      label: "Unit 4",      icon: "fa-4" },
      { key: "annual",     label: "Annual",      icon: "fa-trophy" }
    ];

    function escapeHtmlSyllabus(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // className -> terms data, PDF banane ke liye yahi se uthayenge
    const syllabusDataStore = {};

    function buildPivotedSyllabusRows(terms) {

      const subjectOrder = [];
      const subjectMap = {};

      SYLLABUS_TERMS.forEach((term) => {

        const termRows = (terms && terms[term.key]) ? terms[term.key] : [];

        termRows.forEach((row) => {

          const subj = row.subject || "-";

          if (!subjectMap[subj]) {
            subjectMap[subj] = {};
            subjectOrder.push(subj);
          }

          let cell = (row.chapterFrom || row.chapterTo)
            ? `Ch ${row.chapterFrom || "-"} to ${row.chapterTo || "-"}`
            : "-";

          if (row.extra) {
            cell = (cell === "-") ? row.extra : `${cell} (${row.extra})`;
          }

          subjectMap[subj][term.key] = cell;

        });

      });

      return subjectOrder.map((subj) => {
        const row = [subj];
        SYLLABUS_TERMS.forEach((term) => {
          row.push(subjectMap[subj][term.key] || "-");
        });
        return row;
      });

    }

    function generateSyllabusPdf(className, terms) {

      if (!window.jspdf) {
        alert("PDF library load nahi hui, page reload karke try karo.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF("landscape", "pt", "a4");

      const rows = buildPivotedSyllabusRows(terms);

      if (rows.length === 0) {
        rows.push(["-", "-", "-", "-", "-", "-", "-"]);
      }

      const headers = [["Subject", ...SYLLABUS_TERMS.map(t => t.label)]];

      doc.autoTable({
        head: headers,
        body: rows,
        theme: "grid",
        startY: 40,
        margin: { left: 25, right: 25, top: 40, bottom: 25 },

        styles: {
          font: "helvetica",
          fontSize: 8.5,
          cellPadding: 5,
          textColor: [0, 0, 0],
          lineColor: [0, 0, 0],
          lineWidth: 0.5,
          overflow: "linebreak",
          valign: "middle"
        },

        headStyles: {
          fillColor: [245, 138, 46],
          textColor: [255, 255, 255],
          fontStyle: "bold",
          fontSize: 9.5,
          halign: "center"
        },

        columnStyles: {
          0: { cellWidth: 100, fontStyle: "bold" }
        },

        didDrawPage: function () {
          doc.setTextColor(0, 0, 0);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(13);
          doc.text(`Syllabus - ${getClassDisplayNameLocal(className)} [Sunshine School]`, 25, 26);

          const pageNumber = doc.internal.getNumberOfPages();
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8);
          doc.text(`Page ${pageNumber}`, doc.internal.pageSize.getWidth() - 60, 26);
        }
      });

      doc.save(`Syllabus_${className}.pdf`);

    }

    function getClassDisplayNameLocal(className) {
      if (!className) return "Class";
      if (["Nursery", "LKG", "UKG"].includes(className)) return className;
      return `Class ${className}`;
    }

    function renderClassSyllabusHtml(className, syllabus) {

      const terms = (syllabus && syllabus.terms) ? syllabus.terms : {};
      syllabusDataStore[className] = terms;

      let html = `<div class="syllabus-class-block">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem;margin-bottom:.8rem;">
          <h3 style="margin-bottom:0;"><i class="fas fa-layer-group"></i> Class ${escapeHtmlSyllabus(className)}</h3>
          <button type="button" class="syllabus-download-btn" data-class="${escapeHtmlSyllabus(className)}"
            style="background:linear-gradient(135deg,#f58a2e,#f9b042);color:white;border:none;padding:.45rem .9rem;border-radius:60px;font-weight:600;font-size:.78rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;">
            <i class="fas fa-file-pdf"></i> Download PDF
          </button>
        </div>`;

      let anyData = false;

      SYLLABUS_TERMS.forEach((term) => {

        const rows = terms[term.key] || [];

        html += `<div class="syllabus-term-block"><h4><i class="fas ${term.icon}"></i> ${term.label}</h4>`;

        if (rows.length === 0) {
          html += `<div class="syllabus-empty-note">No syllabus added yet for ${term.label}.</div>`;
        } else {
          anyData = true;
          rows.forEach((row) => {
            const range = (row.chapterFrom || row.chapterTo)
              ? ` (Chapter ${escapeHtmlSyllabus(row.chapterFrom || "-")} to ${escapeHtmlSyllabus(row.chapterTo || "-")})`
              : "";
            const extraText = row.extra ? ` — ${escapeHtmlSyllabus(row.extra)}` : "";
            html += `<div class="syllabus-term-item"><strong>${escapeHtmlSyllabus(row.subject)}</strong>${range}${extraText}</div>`;
          });
        }

        html += `</div>`;

      });

      if (!anyData) {
        html += `<p class="syllabus-empty-note"><i class="fas fa-info-circle"></i> Is class ka abhi tak koi syllabus admin ne save nahi kiya.</p>`;
      }

      html += `</div>`;

      return html;

    }

    async function loadTeacherSyllabus() {

      const resultEl = document.getElementById("teacherSyllabusResult");
      if (!resultEl) return;

      const teacherData = JSON.parse(localStorage.getItem("loggedInTeacher") || "null");

      if (!teacherData || !teacherData.assignedClasses || teacherData.assignedClasses.length === 0) {
        resultEl.innerHTML = `<p class="syllabus-empty-note"><i class="fas fa-info-circle"></i> No classes assigned, so no syllabus to show.</p>`;
        return;
      }

      // Unique class names jo teacher ko assign hain
      const classNames = [...new Set(
        teacherData.assignedClasses
          .map(item => item.class)
          .filter(Boolean)
      )];

      if (classNames.length === 0) {
        resultEl.innerHTML = `<p class="syllabus-empty-note"><i class="fas fa-info-circle"></i> No classes assigned, so no syllabus to show.</p>`;
        return;
      }

      resultEl.innerHTML = "";

      for (const className of classNames) {

        try {

          const response = await fetch(`${API_BASE}/api/syllabus/${encodeURIComponent(className)}`);
          const result = await response.json();

          if (response.ok && result.success && result.syllabus) {
            resultEl.insertAdjacentHTML("beforeend", renderClassSyllabusHtml(className, result.syllabus));
          } else {
            resultEl.insertAdjacentHTML("beforeend", renderClassSyllabusHtml(className, null));
          }

        } catch (error) {

          console.error("Load teacher syllabus error:", error);
          resultEl.insertAdjacentHTML(
            "beforeend",
            `<p class="syllabus-empty-note"><i class="fas fa-triangle-exclamation"></i> Class ${escapeHtmlSyllabus(className)} ka syllabus load nahi ho paya.</p>`
          );

        }

      }

    }

    document.addEventListener("DOMContentLoaded", function() {

      loadTeacherSyllabus();

      const resultEl = document.getElementById("teacherSyllabusResult");
      if (resultEl) {
        resultEl.addEventListener("click", function(e) {
          const btn = e.target.closest(".syllabus-download-btn");
          if (!btn) return;
          const className = btn.dataset.class;
          generateSyllabusPdf(className, syllabusDataStore[className] || {});
        });
      }

    });

  })();
</script>
