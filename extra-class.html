<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sunshine · Extra Classes</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
}

body {
    background: #f7f3ed;
    min-height: 100vh;
    padding: 1.5rem;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

/* ===== HEADER ===== */
.page-header {
    background: white;
    border-radius: 32px;
    padding: 1.2rem 2rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.02);
    border: 1px solid rgba(245, 138, 46, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.8rem;
}

.page-header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #2d1f0c;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.page-header h1 i {
    color: #f58a2e;
    background: #fcf3e8;
    padding: 0.3rem 0.6rem;
    border-radius: 16px;
    font-size: 1.2rem;
}

.page-header .header-sub {
    font-size: 0.85rem;
    color: #b09a7e;
    font-weight: 500;
    margin-top: 0.2rem;
}

.page-header .header-sub i {
    color: #f58a2e;
    margin-right: 0.3rem;
}

.page-header .actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
}

.btn-action {
    padding: 0.5rem 1.2rem;
    border: none;
    border-radius: 60px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
}

.btn-secondary {
    background: #f0e2d2;
    color: #4d3e2b;
}

.btn-secondary:hover {
    background: #e6d5c0;
}

.btn-primary {
    background: linear-gradient(135deg, #f58a2e, #f9b042);
    color: white;
    box-shadow: 0 4px 12px rgba(245, 138, 46, 0.2);
}

.btn-primary:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(245, 138, 46, 0.3);
}

/* ===== BANNER ===== */
.banner {
    background: linear-gradient(135deg, #fcf3e8, #f9dbb8);
    border-radius: 28px;
    padding: 1.5rem 2rem;
    margin-bottom: 1.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    border: 1px solid rgba(245, 138, 46, 0.15);
}

.banner .banner-info {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.banner .banner-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f58a2e;
    font-size: 1.8rem;
    box-shadow: 0 4px 12px rgba(245, 138, 46, 0.1);
}

.banner .banner-details h2 {
    font-size: 1.2rem;
    color: #2d1f0c;
    font-weight: 700;
}

.banner .banner-details p {
    color: #8a765e;
    font-size: 0.85rem;
    margin-top: 0.1rem;
}

.banner .banner-badge {
    background: white;
    padding: 0.4rem 1.2rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.8rem;
    color: #f58a2e;
    box-shadow: 0 2px 8px rgba(245, 138, 46, 0.08);
}

.banner .banner-badge i {
    margin-right: 0.4rem;
}

/* ===== SECTION HEADER ===== */
.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
}

.section-header h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: #2d1f0c;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.section-header h3 i {
    color: #f58a2e;
}

.section-header .count-badge {
    background: #fcf3e8;
    color: #f58a2e;
    padding: 0.2rem 0.8rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.75rem;
    border: 1px solid rgba(245, 138, 46, 0.1);
}

.section-header .hint {
    font-size: 0.8rem;
    color: #b09a7e;
}

.section-header .hint i {
    color: #f58a2e;
}

/* ===== CLASS GRID ===== */
.class-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.2rem;
}

/* ===== CLASS CARD ===== */
.class-card {
    background: white;
    border-radius: 24px;
    padding: 1.5rem 1.5rem 1.2rem;
    box-shadow: 0 8px 30px rgba(0,0,0,0.02);
    border: 1px solid rgba(245, 138, 46, 0.06);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

.class-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #f58a2e, #f9b042);
    opacity: 0;
    transition: opacity 0.3s;
}

.class-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(245, 138, 46, 0.08);
    border-color: rgba(245, 138, 46, 0.2);
}

.class-card:hover::before {
    opacity: 1;
}

.class-card .card-top {
    cursor: pointer;
}

.class-card .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: #fcf3e8;
    color: #f58a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin-bottom: 0.8rem;
    transition: all 0.3s;
}

.class-card:hover .card-icon {
    background: #f58a2e;
    color: white;
    transform: scale(1.05);
}

.class-card h4 {
    font-size: 1.1rem;
    font-weight: 700;
    color: #2d1f0c;
    margin-bottom: 0.2rem;
}

.class-card .class-meta {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 0.3rem;
    font-size: 0.78rem;
    color: #b09a7e;
}

.class-card .class-meta span {
    display: flex;
    align-items: center;
    gap: 0.3rem;
}

.class-card .class-meta i {
    color: #f58a2e;
    font-size: 0.7rem;
}

.class-card .class-desc {
    color: #7f6a4b;
    font-size: 0.82rem;
    margin-top: 0.3rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.class-card .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 1rem;
    padding-top: 0.8rem;
    border-top: 1px solid #f0e2d2;
}

.class-card .card-footer .student-info {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.8rem;
    color: #7f6a4b;
}

.class-card .card-footer .student-info i {
    color: #f58a2e;
}

.class-card .card-footer .actions {
    display: flex;
    gap: 0.4rem;
}

.btn-open {
    background: #f0e2d2;
    color: #4d3e2b;
    border: none;
    padding: 0.3rem 1rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
}

.btn-open:hover {
    background: #f58a2e;
    color: white;
    transform: scale(1.05);
}

.btn-open i {
    font-size: 0.65rem;
}

.btn-delete-card {
    background: #fce4e0;
    color: #b53b2e;
    border: none;
    padding: 0.3rem 1rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
}

.btn-delete-card:hover {
    background: #b53b2e;
    color: white;
    transform: scale(1.05);
}

.btn-delete-card i {
    font-size: 0.65rem;
}

/* ===== EMPTY STATE ===== */
.empty-state {
    background: white;
    border-radius: 24px;
    padding: 4rem 2rem;
    text-align: center;
    border: 1px solid rgba(245, 138, 46, 0.06);
    grid-column: 1 / -1;
}

.empty-state i {
    font-size: 4rem;
    color: #f0e2d2;
    margin-bottom: 1rem;
}

.empty-state h3 {
    color: #2d1f0c;
    font-size: 1.3rem;
    margin-bottom: 0.3rem;
}

.empty-state p {
    color: #b09a7e;
    font-size: 0.95rem;
}

.empty-state .empty-hint {
    margin-top: 1rem;
    color: #d5c8b8;
    font-size: 0.85rem;
}

.empty-state .empty-hint i {
    font-size: 0.85rem;
    color: #f58a2e;
    display: inline;
}

/* ===== LOADING ===== */
.loading-state {
    text-align: center;
    padding: 3rem 2rem;
    grid-column: 1 / -1;
}

.loading-state i {
    font-size: 2.5rem;
    color: #f58a2e;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-state p {
    color: #b09a7e;
    margin-top: 0.8rem;
    font-weight: 500;
}

/* ===== MODAL ===== */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
    backdrop-filter: blur(4px);
}

.modal.show {
    display: flex;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 550px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 28px;
    padding: 2rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: modalIn 0.3s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 2px solid #fcf3e8;
}

.modal-header h2 {
    font-size: 1.3rem;
    color: #2d1f0c;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.modal-header h2 i {
    color: #f58a2e;
}

.btn-close-modal {
    background: #fce4e0;
    color: #b53b2e;
    border: none;
    padding: 0.4rem 1rem;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-close-modal:hover {
    background: #f5b7b1;
}

.modal-body .form-group {
    margin-bottom: 1rem;
}

.modal-body .form-group:last-child {
    margin-bottom: 0;
}

.modal-body label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    color: #5d4b35;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 0.2rem;
}

.modal-body label i {
    color: #f58a2e;
    margin-right: 0.3rem;
}

.modal-body input,
.modal-body select,
.modal-body textarea {
    width: 100%;
    padding: 0.6rem 0.9rem;
    border: 1.5px solid #f0e2d2;
    background: #fcfaf7;
    border-radius: 12px;
    outline: none;
    font-size: 0.88rem;
    transition: all 0.2s;
    color: #1f160c;
    font-weight: 500;
}

.modal-body input:focus,
.modal-body select:focus,
.modal-body textarea:focus {
    border-color: #f58a2e;
    background: white;
    box-shadow: 0 0 0 3px rgba(245, 138, 46, 0.06);
}

.modal-body input::placeholder,
.modal-body textarea::placeholder {
    color: #b8a58b;
    font-weight: 400;
}

.modal-body textarea {
    min-height: 80px;
    resize: vertical;
    font-weight: 400;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.8rem;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 2px solid #fcf3e8;
}

.btn-cancel-modal {
    background: #f0e2d2;
    color: #4d3e2b;
    border: none;
    padding: 0.6rem 1.8rem;
    border-radius: 60px;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-cancel-modal:hover {
    background: #e6d5c0;
}

.btn-submit-modal {
    background: linear-gradient(135deg, #f58a2e, #f9b042);
    color: white;
    border: none;
    padding: 0.6rem 1.8rem;
    border-radius: 60px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(245, 138, 46, 0.2);
}

.btn-submit-modal:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 20px rgba(245, 138, 46, 0.3);
}

.btn-submit-modal:disabled {
    background: #6c757d;
    cursor: not-allowed;
    opacity: 0.7;
    box-shadow: none;
}

.btn-submit-modal:disabled:hover {
    transform: none;
    box-shadow: none;
}

/* ===== FOOTER ===== */
.footer-note {
    margin-top: 2.5rem;
    border-top: 1px solid #f0e2d2;
    padding-top: 1.2rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    color: #b09a7e;
    font-size: 0.75rem;
}

.footer-note i {
    color: #f58a2e;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 820px) {
    body {
        padding: 1rem;
    }
    .page-header {
        padding: 1rem 1.2rem;
        flex-direction: column;
        align-items: flex-start;
    }
    .page-header h1 {
        font-size: 1.2rem;
    }
    .banner {
        padding: 1rem 1.2rem;
        flex-direction: column;
        text-align: center;
    }
    .banner .banner-info {
        flex-direction: column;
        text-align: center;
    }
    .banner .banner-icon {
        width: 44px;
        height: 44px;
        font-size: 1.3rem;
    }
    .banner .banner-details h2 {
        font-size: 1rem;
    }
    .class-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 0.8rem;
    }
    .section-header {
        flex-direction: column;
        align-items: flex-start;
    }
    .modal-box {
        padding: 1.2rem;
        margin: 0.5rem;
    }
}

@media (max-width: 480px) {
    .page-header .actions .btn-action {
        font-size: 0.7rem;
        padding: 0.3rem 0.7rem;
    }
    .class-grid {
        grid-template-columns: 1fr;
    }
    .class-card .card-footer {
        flex-direction: column;
        gap: 0.5rem;
    }
    .class-card .card-footer .actions {
        width: 100%;
        justify-content: center;
    }
    .modal-footer {
        flex-direction: column;
    }
    .modal-footer button {
        width: 100%;
        justify-content: center;
    }
}

</style>

</head>

<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="page-header">
        <div>
            <h1>
                <i class="fas fa-chalkboard"></i>
                Extra Classes
            </h1>
            <div class="header-sub">
                <i class="fas fa-edit"></i>
                Manage extra classes and students
            </div>
        </div>
        <div class="actions">
            <button class="btn-action btn-secondary" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <button class="btn-action btn-primary" onclick="openClassModal()">
                <i class="fas fa-plus-circle"></i> Create Class
            </button>
        </div>
    </div>

    <!-- ===== BANNER ===== -->
    <div class="banner">
        <div class="banner-info">
            <div class="banner-icon">
                <i class="fas fa-users"></i>
            </div>
            <div class="banner-details">
                <h2>Extra Class Management</h2>
                <p><i class="fas fa-info-circle"></i> Create and manage extra classes with student details</p>
            </div>
        </div>
        <div class="banner-badge">
            <i class="fas fa-calendar-alt"></i> Academic Year 2026-27
        </div>
    </div>

    <!-- ===== SECTION HEADER ===== -->
    <div class="section-header">
        <h3>
            <i class="fas fa-list"></i> All Classes
            <span class="count-badge" id="classCount">0</span>
        </h3>
        <span class="hint">
            <i class="fas fa-hand-pointer"></i> Click a class to manage students
        </span>
    </div>

    <!-- ===== CLASS GRID ===== -->
    <div id="classGrid" class="class-grid">
        <div class="loading-state">
            <i class="fas fa-circle-notch"></i>
            <p>Loading classes...</p>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer-note">
        <span><i class="fas fa-school"></i> Sunshine School · est. 2006</span>
        <span><i class="fas fa-lock"></i> secure · extra class management</span>
    </div>

</div>


<!-- ===== CREATE CLASS MODAL ===== -->
<div class="modal" id="classModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>
                <i class="fas fa-plus-circle"></i> Create New Class
            </h2>
            <button class="btn-close-modal" onclick="closeClassModal()">
                <i class="fas fa-times"></i> Close
            </button>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label><i class="fas fa-graduation-cap"></i> Class Name</label>
                <input type="text" id="className" placeholder="Example: Class 6 - A" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calendar"></i> Academic Year</label>
                <input type="text" id="academicYear" placeholder="2026-27">
            </div>

            <div class="form-group">
                <label><i class="fas fa-align-left"></i> Description</label>
                <textarea id="classDescription" placeholder="Class description (optional)"></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel-modal" onclick="closeClassModal()">
                <i class="fas fa-times"></i> Cancel
            </button>
            <button class="btn-submit-modal" id="createBtn" onclick="createClass()">
                <i class="fas fa-save"></i> Create Class
            </button>
        </div>
    </div>
</div>


<script>

// ==========================================
// ALL LOGIC REMAINS EXACTLY THE SAME
// ==========================================

const API_URL = "https://sunshine-vtal.onrender.com"; // Change this to your server URL if needed

async function loadClasses() {
    try {
        const response = await fetch(`${API_URL}/api/extra-classes`);
        const data = await response.json();

        if (!data.success) {
            throw new Error(data.message);
        }

        renderClasses(data.classes);

    } catch (error) {
        console.error(error);
        document.getElementById("classGrid").innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Unable to Load Classes</h3>
                <p>Please check your connection and try again.</p>
                <div class="empty-hint">
                    <i class="fas fa-info-circle"></i> ${escapeHtml(error.message)}
                </div>
            </div>
        `;
    }
}

function renderClasses(classes) {
    const grid = document.getElementById("classGrid");
    document.getElementById("classCount").textContent = classes.length;

    if (!classes.length) {
        grid.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-chalkboard"></i>
                <h3>No Classes Created</h3>
                <p>Create your first extra class to get started.</p>
                <div class="empty-hint">
                    <i class="fas fa-info-circle"></i> Click "Create Class" to add one
                </div>
            </div>
        `;
        return;
    }

    grid.innerHTML = classes.map(cls => `
        <div class="class-card">
            <div class="card-top" onclick="openClass('${cls._id}')">
                <div class="card-icon">
                    <i class="fas fa-school"></i>
                </div>
                <h4>${escapeHtml(cls.className)}</h4>
                <div class="class-meta">
                    <span><i class="fas fa-user-graduate"></i> ${cls.students?.length || 0} Students</span>
                    ${cls.academicYear ? `<span><i class="fas fa-calendar"></i> ${escapeHtml(cls.academicYear)}</span>` : ''}
                </div>
                ${cls.description ? `<div class="class-desc">${escapeHtml(cls.description)}</div>` : ''}
            </div>

            <div class="card-footer">
                <div class="student-info">
                    <i class="fas fa-users"></i>
                    ${cls.students?.length || 0} Student${cls.students?.length !== 1 ? 's' : ''}
                </div>
                <div class="actions">
                    <button class="btn-open" onclick="openClass('${cls._id}')">
                        <i class="fas fa-arrow-right"></i> Open
                    </button>
                    <button class="btn-delete-card" onclick="deleteClass('${cls._id}')">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    `).join("");
}

async function createClass() {
    const className = document.getElementById("className").value.trim();
    const academicYear = document.getElementById("academicYear").value.trim();
    const description = document.getElementById("classDescription").value.trim();

    if (!className) {
        alert("Please enter a class name.");
        return;
    }

    const btn = document.getElementById("createBtn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

    try {
        const response = await fetch(`${API_URL}/api/extra-classes`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                className,
                academicYear,
                description
            })
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.message);
            return;
        }

        alert("✅ Class created successfully.");
        closeClassModal();
        loadClasses();

    } catch (error) {
        console.error(error);
        alert("Unable to create class.");
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Create Class';
    }
}

async function deleteClass(id) {
    if (!confirm("Are you sure you want to delete this class? This will remove all students in it.")) {
        return;
    }

    try {
        const response = await fetch(`${API_URL}/api/extra-classes/${id}`, {
            method: "DELETE"
        });

        const data = await response.json();

        if (!data.success) {
            alert(data.message);
            return;
        }

        loadClasses();

    } catch (error) {
        console.error(error);
        alert("Unable to delete class.");
    }
}

function openClass(id) {
    window.location.href = `extra-class-students.html?classId=${id}`;
}

function openClassModal() {
    document.getElementById("classModal").classList.add("show");
    document.getElementById("className").focus();
}

function closeClassModal() {
    document.getElementById("classModal").classList.remove("show");
    document.getElementById("className").value = "";
    document.getElementById("academicYear").value = "";
    document.getElementById("classDescription").value = "";
}

// Close modal on ESC key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeClassModal();
    }
});

// Close modal on outside click
document.getElementById("classModal").addEventListener('click', function(e) {
    if (e.target === this) {
        closeClassModal();
    }
});

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadClasses();
